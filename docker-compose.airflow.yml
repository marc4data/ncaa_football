# Local Airflow 3 for cfdb. Runs alongside the Postgres in docker-compose.yml, reusing it
# for Airflow's own metadata database (a separate `airflow` database on the same server).
#
# Bring up:
#   docker compose -f docker-compose.yml -f docker-compose.airflow.yml up -d airflow-init
#   docker compose -f docker-compose.yml -f docker-compose.airflow.yml up -d
#   open http://localhost:8080   (local stack logs in as admin automatically)
#
# Secrets come from .env and are never baked into the image. Generate them once with:
#   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
#   python -c "import secrets; print(secrets.token_hex(32))"

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  image: cfdb/airflow:3.3.1
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://cfdb:cfdb@postgres:5432/airflow
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__API__BASE_URL: http://localhost:8080
    # Airflow 3 defaults to SimpleAuthManager. For a single-user local stack, treating
    # every visitor as admin avoids managing a generated password file; this is a
    # local-dev-only posture — the site itself is protected by Cloudflare Access.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    # Workers call back to the API server here. Without this they fall back to
    # localhost:8080, which inside a scheduler container is nothing at all.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    # Publishing to the droplet. The KEY PATH travels, never the key material — nothing
    # here is secret, and nothing here reaches a task log.
    SERVING_PUBLISH_KEY: /opt/airflow/.ssh/cfdb_publish
    SERVING_PUBLISH_HOST: ${SERVING_PUBLISH_HOST:-cfdb_publish@143.110.225.139}
    # The project is importable as `src.*`, and relative paths like data/raw resolve
    # because every service runs with the project as its working directory.
    PYTHONPATH: /opt/airflow/project
    CFBD_API_KEY: ${CFBD_API_KEY}
    # dbt reads its profile from the repo, pointed at the compose network's Postgres.
    DBT_PROFILES_DIR: /opt/airflow/project/dbt/profiles_airflow
    # On the compose network Postgres answers to `postgres`. src/load_raw_to_postgres.py
    # defaults to localhost, which inside a container is nothing.
    PG_HOST: postgres
    PG_PORT: "5432"
    PG_USER: cfdb
    PG_PASSWORD: cfdb
    PG_DB: cfdb
    # Databricks, for the daily raw sync. Left empty rather than defaulted so a machine
    # without credentials fails loudly in the task instead of syncing nothing quietly.
    DATABRICKS_SERVER_HOSTNAME: ${DATABRICKS_SERVER_HOSTNAME:-}
    DATABRICKS_HTTP_PATH: ${DATABRICKS_HTTP_PATH:-}
    DATABRICKS_TOKEN: ${DATABRICKS_TOKEN:-}
    DATABRICKS_CATALOG: ${DATABRICKS_CATALOG:-workspace}
    DATABRICKS_RAW_SCHEMA: ${DATABRICKS_RAW_SCHEMA:-raw}
    # Failure triage. Without this the alert email still sends, in its plain form —
    # the summary is an enhancement to the alert, never a precondition for it.
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ALERT_TRIAGE_MODEL: ${ALERT_TRIAGE_MODEL:-claude-sonnet-5}
    ALERT_SMTP_HOST: ${ALERT_SMTP_HOST:-}
    ALERT_SMTP_PORT: ${ALERT_SMTP_PORT:-587}
    ALERT_SMTP_USER: ${ALERT_SMTP_USER:-}
    ALERT_SMTP_PASSWORD: ${ALERT_SMTP_PASSWORD:-}
    ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
    ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
  volumes:
    # CODE comes from ../cfdb_deploy, a git worktree PINNED TO MAIN — never the working tree.
    #
    # Airflow reads these paths live, so while they pointed at the development tree a
    # `git checkout` WAS a production deployment. That caused two incidents: the live lines
    # schedule silently reverting to @daily, and a branch predating the cadence-gate PR
    # removing config/lines_cadence.json out from under a running DAG. "Merge quickly" is a
    # habit, not a mitigation. This is the mitigation.
    #
    # It also closes the gap dbt selectors cannot: `--select +tag:production` protects the
    # refresh from a model that FAILS, but dbt parses the whole project before selection
    # applies, so a half-written model that does not COMPILE still breaks every invocation.
    # A pinned tree means unfinished work is not visible to Airflow at all.
    #
    # Refresh after merging with:  scripts/deploy_main.sh
    - ../cfdb_deploy/dags:/opt/airflow/dags
    - ../cfdb_deploy/src:/opt/airflow/project/src
    - ../cfdb_deploy/dbt:/opt/airflow/project/dbt
    # Cadence window for the lines DAG; read at task runtime, not at parse time.
    - ../cfdb_deploy/config:/opt/airflow/project/config
    # STATE stays on the primary tree: data/ and logs/ are gitignored, so they do not exist
    # in a worktree at all, and the 1.6 GB raw layer must not be duplicated.
    - ./data:/opt/airflow/project/data
    - ./logs:/opt/airflow/logs
    # The publish key, READ-ONLY and from OUTSIDE the repository.
    #
    # It is a dedicated ed25519 keypair whose public half is pinned in the droplet's
    # authorized_keys behind a forced command, so holding it permits exactly the publish
    # verbs and nothing else — no shell, no file read, no port forward, no Docker.
    #
    # Deliberately not the root key that publishes from a laptop: a key that can open a
    # root shell does not belong in a scheduler that runs code from a repository. And
    # deliberately not inside the repo — a key in the tree is a key that gets committed.
    - ${CFDB_PUBLISH_KEY:-~/.ssh/cfdb_publish_ed25519}:/opt/airflow/.ssh/cfdb_publish:ro
  working_dir: /opt/airflow/project
  depends_on:
    - postgres

services:
  # One-shot: create the metadata schema and the admin user, then exit.
  airflow-init:
    <<: *airflow-common
    command: db migrate
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped

  # Airflow 3 parses DAGs in a dedicated process rather than inside the scheduler.
  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: unless-stopped
