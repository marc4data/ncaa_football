name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:  # lets the CFBD live smoke test below be run on demand
  schedule:
    # Monday 06:00 UTC. Two things need a clock rather than a commit:
    #
    #   1. Upstream drift. CFBD ships endpoints between releases and the repo cannot notice
    #      on its own — v5.25.0 added five `passing/*` paths and nothing here said so until
    #      the spec was vendored. See the spec-drift job.
    #   2. Dependency drift. A weekly build with no source change is a free canary for the
    #      class of failure that broke the site nav: `streamlit>=1.40` resolved to 1.62.0 on
    #      a rebuild, auto-discovery of `pages/` overrode st.navigation, and the first
    #      report was Marc looking at the live site. A red Monday is a much cheaper signal.
    - cron: '0 6 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: flake8 + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (flake8)
        run: flake8 src dags tests

      - name: Test (pytest)
        run: pytest -q

      - name: Assert no secrets are tracked in git
        run: |
          if git ls-files | grep -iE '(^|/)\.env$|secret|token'; then
            echo "::error::Tracked file looks like a secret — see the CFBD terms constraint in CLAUDE.md"
            exit 1
          fi
          echo "No tracked secrets."

      - name: Assert no raw data is tracked in git
        run: |
          if git ls-files | grep -E '^data/'; then
            echo "::error::Raw CFBD responses must never be committed (redistribution risk)"
            exit 1
          fi
          echo "No tracked raw data."

      - name: Assert no office documents are tracked in git
        run: |
          # .gitignore stops accidents; `git add -f` bypasses it. This does not.
          #
          # TWO DELIBERATE EXCEPTIONS, and they must match `!docs/*.xlsx` in .gitignore.
          # One policy enforced in two places is two places to change when the policy
          # changes — this guard failed the first build after docs/ landed precisely
          # because the ignore rule was updated and this was not.
          #
          # Narrow on purpose: only .xlsx, only DIRECTLY under docs/, and the name may not
          # begin with ~$. A stray document anywhere else is still refused, a .docx in docs/
          # is still refused, and so is docs/~$whatever.xlsx — the lock file Excel writes
          # while a workbook is open, which is one of the things this rule exists to catch.
          # An exception that readmits the original target is not an exception, it is a hole.
          ALLOWED='^docs/[^~/][^/]*\.xlsx$'
          if git ls-files | grep -vE "$ALLOWED" | grep -iE '\.(docx?|xlsx?|pptx)$|^~\$|/~\$'; then
            echo "::error::Project writing lives in the Cowork folder outside this repo — a document here is a stray copy"
            echo "::error::The only exception is docs/*.xlsx, which are published deliverables."
            exit 1
          fi
          echo "No tracked office documents outside the docs/ exception."

  spec-drift:
    name: CFBD spec is current
    # Not on pull requests. The offline tests in tests/test_cfbd_spec.py already hold the
    # registry and the VENDORED spec together on every PR; this job answers the different
    # question of whether the vendored copy still matches upstream, which needs the network
    # and has nothing to do with the change under review. Failing someone's PR because CFBD
    # shipped a release, or because their API was briefly down, is noise.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Compare the vendored spec against upstream
        # No API key: the spec is served unauthenticated because it describes a public API.
        # A failure here is a task, not a fault — run scripts/refresh_cfbd_spec.py, then
        # decide what to do about whatever moved.
        run: python scripts/refresh_cfbd_spec.py --check

  cfbd-smoke:
    name: CFBD live smoke test
    # Manual only: hitting the real API on every PR burns rate limit for no signal.
    # This is the acceptance test for the CFBD_API_KEY repo secret.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch teams from CFBD
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python -m src.ingest fetch teams

      - name: Assert the response was a 200
        run: |
          python - <<'PY'
          import json, pathlib, sys
          manifest = pathlib.Path("data/raw/teams/manifest.json")
          if not manifest.exists():
              sys.exit("No manifest written — the fetch did not run.")
          latest = json.loads(manifest.read_text())[-1]
          print("Latest manifest entry:", latest)
          if latest["status_code"] != 200:
              sys.exit(f"CFBD returned {latest['status_code']} — check the CFBD_API_KEY secret.")
          print("CFBD key is valid.")
          PY
      # Raw data is deliberately not uploaded as an artifact — CFBD terms prohibit
      # redistribution, and the workspace is discarded when the job ends.

  dbt:
    name: dbt build (models + tests)
    runs-on: ubuntu-latest
    # Transform correctness gets the same gate as Python. Without this, a model change
    # that breaks a reconciliation test is only caught by the weekly DAG — in production,
    # after merge.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: cfdb
          POSTGRES_PASSWORD: cfdb
          POSTGRES_DB: cfdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PG_HOST: localhost
      PG_PORT: "5432"
      PG_USER: cfdb
      PG_PASSWORD: cfdb
      PG_DB: cfdb
      DBT_PROFILES_DIR: dbt/profiles_ci
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Load the raw-layer fixture
        env:
          PGPASSWORD: cfdb
        run: psql -h localhost -U cfdb -d cfdb -v ON_ERROR_STOP=1 -f ci/fixtures.sql

      # R-313. The guard runs HERE as well as on a laptop, and it must PASS here: CI's
      # profile resolves to the workflow's Postgres service container, which is a correct
      # `localhost`, and the `ci` target is exempt from the host checks by name. This step is
      # what stops the guard from being tightened later in a way that breaks the one
      # environment nobody runs by hand.
      - name: Preflight — say which database this build reaches
        run: python scripts/preflight_env.py --no-connect

      - name: dbt build
        run: dbt build --project-dir dbt

      - name: Assert the production selector covers the serving layer
        # `+tag:production` once resolved to six models, none of them a serving view, and
        # every scheduled refresh was green while rebuilding nothing anyone reads. This
        # asserts what the selector RESOLVES TO, not that it ran.
        run: python ci/check_production_selector.py

      - name: Assert every page query resolves
        env:
          PGPASSWORD: cfdb
        # The contract test proves each query is legally shaped; it cannot prove the
        # columns exist. Scores asked for eight columns srv_scoreboard did not have and
        # rendered the Error state on every load, which looks like a handled failure.
        run: python ci/check_page_queries.py

      - name: Assert every health signal fires
        env:
          PGPASSWORD: cfdb
        # The System Overview page has five severity ladders and only one of them had ever
        # been observed climbing. A branch that never evaluates true looks exactly like a
        # healthy system until the day it matters.
        run: python ci/check_health_signals.py

      - name: Assert layer boundaries
        # Schema-per-layer separates outputs; it cannot stop a mart selecting straight
        # from raw. This reads the compiled dependency graph, where that would show up.
        run: python ci/check_layering.py

      - name: Assert no test can block the two-hourly publish
        # SEVEN TESTS HAVE STRADDLED THE GATED DAG'S REFRESH BOUNDARY, comparing something it
        # rebuilds against something it does not. The seventh blocked three consecutive runs
        # on 2026-09-04 and would have blocked all twelve on a Saturday, because
        # publish_to_serving sits downstream of dbt_test on all_success — so a false failure
        # does not just report a problem, it stops the site updating.
        #
        # Six point fixes and a prose rule did not prevent a seventh. This reads the manifest.
        run: python ci/check_test_refresh_scope.py

      - name: Assert the site image's boundary
        # R-225. The image is built with `context: ./site`, so anything above that directory
        # does not exist in the container. Three modules have reached past it — a config at
        # the repo root, a constant in src/, the dbt vars — and each one FELL BACK rather than
        # failing, so the deployed site was wrong or coincidentally right and nothing said so.
        # The layer check above guards the data boundary by machine; this is the other half.
        run: python ci/check_site_paths.py

      - name: Assert the fixture exercised both date eras
        env:
          PGPASSWORD: cfdb
        # A fixture that only covered the modern era would let the date-only regression
        # test pass without testing anything.
        run: |
          eras=$(psql -h localhost -U cfdb -d cfdb -tAc \
            "select count(distinct kickoff_time_known) from marts.mart_team_schedule;")
          if [ "$eras" -ne 2 ]; then
            echo "::error::fixture covers $eras date era(s); it must cover both"
            exit 1
          fi
          echo "Fixture covers both date eras."

  site-image:
    name: site image builds and renders
    runs-on: ubuntu-latest
    # THE ONLY JOB THAT LOOKS AT WHAT USERS LOOK AT.
    #
    # Until 30 August nothing in CI touched the site image at all — its Dockerfile and
    # requirements were not even in the repo. A rebuild silently upgraded Streamlit, the
    # sidebar fell back to raw filenames, every page went blank, and the site stayed that way
    # for a day. The pipeline had 261 passing tests throughout, the database was healthy, and
    # the deployment was verified by querying it, which is not the same claim.
    steps:
      - uses: actions/checkout@v7

      - name: Build the site image
        # Catches a broken Dockerfile and any dependency missing from the site's own
        # requirements — a separate list from the repo root, which has already lost openpyxl
        # once and fails only at runtime on the page that needs it.
        run: docker build -t cfdb-site:ci site/

      - name: Run the entrypoint and check the nav it builds
        # Executes the real app.py inside the real image at the pinned Streamlit version,
        # with st.navigation stubbed so no page needs a database. Asserts the app gets that
        # far and registers 18 titled pages — the half that was silently wrong.
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/ci/site_smoke.py:/app/site_smoke.py:ro" \
            cfdb-site:ci python /app/site_smoke.py

      - name: Assert the image has no auto-discovered pages directory
        # Streamlit builds a multipage app from any directory named `pages/` next to the
        # entrypoint, overriding st.navigation. The repo forbids the name; this checks the
        # image, where a stray COPY could recreate it somewhere no local test can see.
        run: |
          if docker run --rm cfdb-site:ci test -d /app/pages; then
            echo "::error::/app/pages exists in the image — Streamlit will auto-discover it"
            exit 1
          fi
          docker run --rm cfdb-site:ci test -d /app/views
          echo "Image has /app/views and no /app/pages."

      - name: Boot the container and check it serves
        # Import-time failures do not show up until the server starts.
        run: |
          docker run -d --name cfdb-site-ci -p 8501:8501 cfdb-site:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8501/_stcore/health || true)
            [ "$code" = "200" ] && { echo "Site healthy after ~$((i*2))s"; exit 0; }
            sleep 2
          done
          echo "::error::site did not become healthy"
          docker logs cfdb-site-ci
          exit 1
