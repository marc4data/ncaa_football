name: cfdb_dbt
version: '0.1'
config-version: 2

profile: cfdb_profile

model-paths: ["models"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target"]

# EVERY dbt INVOCATION SAYS WHICH DATABASE IT REACHED, AND REFUSES THE ONE THAT IS GONE.
#
# dbt/profiles.yml is gitignored, so it is per working copy and hand-copied, and a fix that
# merges to main does not reach it. On 2026-09-05 that cost a session: a profile copied from
# the old template pointed at localhost:5432, a Postgres dropped that same day, and the
# conclusion drawn was "there is no warehouse to build against." There is; it is on the
# droplet. See dbt/macros/preflight_target.sql and scripts/preflight_env.py.
#
# on-run-start rather than a README paragraph, because this is the one place a dbt run
# cannot route around.
on-run-start:
  - "{{ preflight_target() }}"

models:
  cfdb_dbt:
    +materialized: view
    # Push schema.yml descriptions into the database as native comments. This is what makes
    # dim_field_metadata possible without a second document: descriptions are authored once
    # here, and the data dictionary is read back out of the warehouse's own catalogue.
    +persist_docs:
      relation: true
      columns: true
    # Schema per layer (decision log 2026-08-17). Raw is written by the loaders, not dbt.
    staging:
      +schema: staging
      # STAGING IS KEPT FRESH WHETHER OR NOT A PAGE READS IT.
      #
      # The serving layer carries `production`, and `+tag:production` pulls its ancestors —
      # so a staging model reached the scheduled refresh only by being upstream of something
      # the site renders. That was the right rule when the site WAS the product. It is the
      # wrong rule now: prompt 029 makes the warehouse itself the deliverable, and the whole
      # of Priority 3 is staging models for endpoints no page consumes.
      #
      # Without this tag those models exist in git and never materialise. stg_game_weather
      # and stg_game_player_stat shipped in the games family and neither was in the
      # selection — 58 of 66 models, the two new ones outside it. That is the same "green
      # and useless" shape ci/check_production_selector.py was written for: every run
      # succeeds, and the thing you added is simply never built.
      #
      # A SEPARATE TAG RATHER THAN `production`, because the two words mean different
      # things. `production` is "the site is stale without this", and the scores DAG rebuilds
      # it every two hours. `warehouse` is "the warehouse should hold this", which the weekly
      # DAG is the right cadence for — box scores and weather are immutable once the week
      # completes, and rebuilding 1.27M player-stat rows two-hourly would buy nothing.
      +tags: ['warehouse']
    marts:
      +schema: marts
    # Serving layer: denormalized, pre-joined, what the site reads. Tables rather than
    # views because the publish job ships rows via pg_dump — a view would ship its
    # definition and reference marts tables that do not exist on the droplet.
    serving:
      +schema: serving
      +materialized: table
      # THE SERVING LAYER IS THE PRODUCTION SURFACE, so it carries the production tag by
      # construction rather than one model at a time.
      #
      # Airflow's refresh runs `dbt build --select +tag:production`. Until now that tag was
      # on three legacy marts and nothing else, so the selector resolved to SIX models —
      # mart_data_freshness, mart_team_schedule, mart_team_season_record and three staging
      # ancestors. Not one srv_ view. Not fct_game. The scheduled refresh fetched results
      # every Sunday, landed them in raw, rebuilt three marts nothing on the site reads, and
      # stopped. Every view the site actually serves was rebuilt only when somebody ran dbt
      # by hand.
      #
      # The tag was narrow to keep half-finished work out of the runtime path, and that is a
      # real concern with two better answers already in place: Airflow reads a worktree
      # PINNED TO MAIN, and CI builds the entire project on every pull request. Unfinished
      # work cannot reach the tree Airflow runs. The narrow selector was guarding a door
      # that is bolted from two other sides, while leaving the site's data stale by
      # construction.
      #
      # `+` pulls ancestors, so tagging serving pulls the marts and staging models it needs
      # and nothing else. A new mart that no serving view reads stays out of the runtime
      # path exactly as before.
      +tags: ['production']

# R-141. THE UPSET SCALE'S BOUNDARIES ARE A METRIC DEFINITION, SO THEY LIVE HERE.
#
# Marc asked for the split between levels to be configurable. Configurable does NOT mean a
# constant in schedule.py: the standing rule is that metric definitions live upstream, and the
# site renders a level it was handed rather than one it computed. Changing the scale is a
# one-line edit here plus a rebuild, and every consumer moves together.
#
# Margins are in points, exclusive: a 7-point upset is level 1, an 8-point upset is level 2.
vars:
  upset_margin_big: 7
  upset_margin_blowout: 14

  # ------------------------------------------------------------------------------------
  # WEEKLY DISTRIBUTION BINS (R-197). CONFIGURATION, NOT DATA — and the edges are FIXED and
  # identical across every week, which is the decision that cannot be revisited cheaply.
  #
  # If each week binned itself, week-over-week comparison would be meaningless and a row of
  # sparklines actively misleading: different-shaped pictures on different axes read as
  # different distributions. Fixed edges make the edges configuration, which is why they
  # live here next to the upset margins rather than in the app.
  #
  # MEASURED, NOT CHOSEN. Every bound below was set from the observed range over FBS 2024+
  # with the closing line where held, then checked for clipping. Five of six clip nothing at
  # all; temperature clips ONE game of 1,853 (a 105.6°F kickoff), which is an honest tail
  # rather than a cliff and is reported on the row as above_max_count.
  #
  #       metric                            min     max    observed range
  #       spread                            -56     +34    -55.5 .. +32.5
  #       spread_abs                          0      60      1.0 .. 55.5
  #       total                              30      80     33.0 .. 78.5
  #       market_implied_favorite_points      0      60     18.5 .. 59.5
  #       market_implied_underdog_points      0      60      2.5 .. 38.8
  #       temperature_f                      15     105     15.8 .. 105.6
  #
  # TEN BINS, not the twenty an earlier draft proposed. A week holds ~55 FBS games (2025
  # regular: avg 55.5, range 51-96), and twenty bins over 55 observations is a scatter, not a
  # distribution — measured on 2025 week 9, twenty bins gave six empty ones and a single bar
  # of 14. Sturges on n=55 is ~7; ten is the compromise, and a 120px sparkline cannot resolve
  # more.
  #
  # THE IMPLIED PAIR SHARES ONE AXIS ON PURPOSE (0..60). Drawn on the same scale, the gap
  # between the two humps IS the spread, and the pair converging through the season is the
  # whole picture. Zero clipping on both at these bounds.
  #
  # Changing an edge after snapshot rows exist invalidates comparison across the change. If
  # one has to move, that is a new bin_version on the row, not an edit.
  # ------------------------------------------------------------------------------------
  distribution_bin_count: 10
  distribution_bins:
    spread:                         {min: -56, max: 34}
    spread_abs:                     {min: 0,   max: 60}
    total:                          {min: 30,  max: 80}
    market_implied_favorite_points: {min: 0,   max: 60}
    market_implied_underdog_points: {min: 0,   max: 60}
    temperature_f:                  {min: 15,  max: 105}
