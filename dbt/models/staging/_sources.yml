version: 2

sources:
  - name: raw
    description: >
      Immutable landing tables written by `src/load_raw_to_postgres.py`. One row per
      raw API response file. Never modified by dbt — everything downstream rebuilds
      from here (data quality rule #1).
    schema: "{{ var('raw_schema', 'raw') }}"
    tables:
      - name: raw_teams
        description: CFBD /teams responses.
        columns:
          - name: filename
            description: Raw file name; the natural key for a single API response.
            data_tests:
              - unique
              - not_null
      - name: raw_games
        description: CFBD /games responses, one row per fetch (params record the season).
        columns:
          - name: filename
            data_tests:
              - unique
              - not_null
      - name: raw_venues
        description: CFBD /venues responses. Not season-scoped — one call returns every venue.
        columns:
          - name: filename
            data_tests: [unique, not_null]
      - name: raw_conferences
        description: CFBD /conferences responses, one per season.
        columns:
          - name: filename
            data_tests: [unique, not_null]
      - name: raw_calendar
        description: >
          CFBD /calendar responses, one per season. Serves nothing before 2002, which bounds
          every week-grain join — asserted in dim_week.
        columns:
          - name: filename
            data_tests: [unique, not_null]
      - name: raw_lines
        description: >
          CFBD /lines snapshots. One row per fetch, not per game: the same request is
          re-issued every 4 hours in season and each response is a point in time. This is the
          only endpoint whose history cannot be backfilled.
        columns:
          - name: filename
            data_tests: [unique, not_null]
      - name: raw_games_teams
        description: CFBD /games/teams team box scores. Stats arrive EAV-shaped as strings.
        columns:
          - name: filename
            data_tests: [unique, not_null]
      - name: raw_games_players
        description: >
          CFBD /games/players player box scores — the deepest payload the API serves:
          game -> teams[] -> categories[] -> types[] -> athletes[]. Identifies teams by NAME
          only; unlike /games/teams it ships no teamId.
        columns:
          - name: filename
            data_tests: [unique, not_null]
      - name: raw_games_weather
        description: >
          CFBD /games/weather. One row per game, flat, twenty-two fields. Landed since
          August and read by nothing until stg_game_weather — the endpoint was in the sweep,
          so every DAG was green while the data sat unused.
        columns:
          - name: filename
            data_tests: [unique, not_null]
      - name: raw_records
        description: >
          CFBD /records. Landed but deliberately NOT a source for fct_team_record — records
          are derived from the game spine, and this endpoint is used only to reconcile
          against that derivation.
        columns:
          - name: filename
            data_tests: [unique, not_null]
      - name: raw_games_media
        description: >
          CFBD /games/media — broadcast outlet per game per media type. Landed since the
          full-breadth backfill and unmodelled until now; `network` on Schedule and Today
          reads from here.
        columns:
          - name: filename
            data_tests: [unique, not_null]
      - name: raw_rankings
        description: >
          CFBD /rankings. Three levels of nesting — week, then poll, then rank — so one file
          can hold several hundred rows and a team appears once per poll it is ranked in.
        columns:
          - name: filename
            data_tests: [unique, not_null]
      - name: raw_stats_season
        description: >
          CFBD /stats/season. EAV by nature: one row per team per stat name, with the value
          arriving as either a string or a number.
        columns:
          - name: filename
            data_tests: [unique, not_null]
      - name: raw_stats_season_advanced
        description: >
          CFBD /stats/season/advanced. Deeply nested offense/defense splits rather than EAV,
          so it is flattened by explicit path rather than pivoted.
        columns:
          - name: filename
            data_tests: [unique, not_null]
      - name: raw_stats_categories
        description: >
          CFBD /stats/categories. A BARE ARRAY OF STRINGS — the only endpoint shaped that
          way, with no wrapping object. The controlled vocabulary behind
          stg_game_team_stat.stat_category.
        columns:
          - name: filename
            data_tests: [unique, not_null]
      - name: raw_stats_game_advanced
        description: >
          CFBD /stats/game/advanced. 62 field paths, the richest per-game payload CFBD
          serves — PPA, success rate, explosiveness, line yards, split by down type and
          play type, for offense and defense.
        columns:
          - name: filename
            data_tests: [unique, not_null]
      - name: raw_stats_game_havoc
        description: CFBD /stats/game/havoc. Havoc rates per game, offense and defense.
        columns:
          - name: filename
            data_tests: [unique, not_null]
      - name: raw_stats_player_season
        description: >
          CFBD /stats/player/season. EAV-shaped and the highest-volume endpoint in the stats
          family — 132,277 rows for a single 2024 fetch. Carries a real playerId.
        columns:
          - name: filename
            data_tests: [unique, not_null]
      - name: raw_stats_player_success
        description: CFBD /stats/player/success. Season success rate, passing and rushing.
        columns:
          - name: filename
            data_tests: [unique, not_null]
      - name: raw_stats_player_success_game
        description: >
          CFBD /stats/player/success/game. Per-game success rate. A THIRD OF THE LANDED
          RESPONSES ARE 400s and that is correct: CFBD rejects a year-only call here, so the
          early season-scoped attempts were refused and the registry fetches it per week.
          The refusals stay in raw because raw is immutable.
        columns:
          - name: filename
            data_tests: [unique, not_null]
      - name: raw_info
        description: >
          Point-in-time snapshots of CFBD call quota from /info. Every snapshot is kept
          rather than the latest, because the endpoint reports a running monthly total:
          one row says where we stand, only a series says where we are heading.
        columns:
          - name: filename
            data_tests: [unique, not_null]
      - name: raw_info_usage
        description: >
          Snapshots of /info/usage — per-endpoint request counts over a trailing window.
          Truncated to the API's `limit` parameter, so these are the top endpoints per
          snapshot and not the complete set.
        columns:
          - name: filename
            data_tests: [unique, not_null]
      - name: raw_model_prediction
        # Landed from model_outputs/*.csv. The PACK is licensed and never loaded anywhere;
        # this is DERIVED OUTPUT, which the licence explicitly permits for private projects,
        # and it carries none of the pack's 86 training features. Builds on both engines
        # (decision log 2026-08-19).
        description: >
          Model prediction exports, one row per CSV row, stored whole. Follows the pack's
          42-column contract; the away-minus-home sign convention is preserved verbatim.
        columns:
          - name: source_file
            data_tests: [not_null]
          - name: model_version
            data_tests: [not_null]
      - name: raw_deploy_status
        tags: ['postgres_only']
        description: >
          How far Airflow's pinned deploy worktree is behind main. The pin stops a dev
          checkout changing production; this measures its mirror image, production silently
          running old code. Written by src/deploy_status.py.
        columns:
          - name: observed_at
            data_tests: [not_null]
      - name: raw_dbt_test_result
        # Written straight to Postgres by src/*.py, never landed as a CFBD response, so
        # it has no Databricks equivalent and the analytics build excludes it by tag.
        tags: ['postgres_only']
        description: >
          dbt's own test outcomes, one row per test per invocation, landed by
          src/dbt_artifacts.py. dbt overwrites run_results.json every run, so the current
          state is visible and the trend is not — this table is the trend.
        columns:
          - name: invocation_id
            data_tests: [not_null]
          - name: unique_id
            data_tests: [not_null]
      - name: raw_warehouse_usage
        # Written straight to Postgres by src/*.py, never landed as a CFBD response, so
        # it has no Databricks equivalent and the analytics build excludes it by tag.
        tags: ['postgres_only']
        description: >
          cfdb's own telemetry, not a CFBD endpoint. Databricks Free Edition documents no
          account-level API, so warehouse consumption cannot be read back and is measured
          client-side by src/warehouse_usage.py instead.
        columns:
          - name: observed_at
            data_tests: [not_null]
          - name: operation
            data_tests: [not_null]
      - name: raw_manifest
        description: >
          One row per landed response across every endpoint, written by
          src/load_raw_to_postgres.py. Carries fetched_at (observation time) and row_count,
          which is what makes freshness and empty-response detection possible at all.
        columns:
          - name: endpoint
            data_tests:
              - not_null
          - name: filename
            data_tests:
              - not_null
      # The five rating systems. All landed SEASON-scoped: CFBD's spec allows a `week`
      # parameter on /ratings/elo alone, and even that has only ever been fetched with a
      # year. Verified against config/api-docs.json before stg_team_rating was built,
      # because the model was going to be called fct_team_week_rating.
      - name: raw_ratings_sp
        description: SP+ ratings. The only system publishing a PRESEASON PROJECTION.
      - name: raw_ratings_srs
        description: Simple Rating System. Results-derived, so empty until games are played.
      - name: raw_ratings_elo
        description: Elo. Results-derived. Weekly-capable at the API, landed season-only.
      - name: raw_ratings_fpi
        description: ESPN FPI. Also a preseason projection.
      - name: raw_ratings_sp_conferences
        description: >
          CFBD /ratings/sp/conferences. SP+ at conference grain — the same metric set as
          /ratings/sp with the team dimension collapsed and NO ranking anywhere, because
          CFBD does not rank conferences here.
        columns:
          - name: filename
            data_tests: [unique, not_null]
      - name: raw_ratings_srs_expanded
        description: >
          CFBD /ratings/srs/expanded. SRS plus `classification` (fbs/fcs/ii/iii), which is
          what makes SRS's wider team coverage usable — 265 rows for 2024 against 134 for
          Elo, because it rates FCS teams too.
        columns:
          - name: filename
            data_tests: [unique, not_null]
      - name: raw_ratings_core
        description: >
          CFBD /ratings/core. CFBD's own rating, published AS OF a point in the season —
          the grain is (season, team, throughSeasonType, throughWeek), not (season, team).
          The landed data holds one as-of point per season today, which is precisely the
          condition under which a (season, team) assumption looks correct.
        columns:
          - name: filename
            data_tests: [unique, not_null]
      - name: raw_ppa_teams
        description: Predicted points added per play, offence and defence. Results-derived.
      - name: raw_ppa_games
        description: >
          CFBD /ppa/games. Team PPA per game, offense and defense, six splits each. Two rows
          per game — one per team — so a game and its opponent are both present.
        columns:
          - name: filename
            data_tests: [unique, not_null]
      - name: raw_ppa_players_season
        description: >
          CFBD /ppa/players/season. Player PPA, average AND total, each carrying the same
          eight keys. SPELLS CONFERENCES AS ABBREVIATIONS — `B1G`, `B12`, `AAC` — where every
          other endpoint uses full names. A cross-model filter on `conference = 'Big 12'`
          silently returns nothing from this one.
        columns:
          - name: filename
            data_tests: [unique, not_null]
      - name: raw_ppa_players_games
        description: >
          CFBD /ppa/players/games. Player PPA per game — and NO gameId on the payload, so the
          game is identified only by season, week, season type and opponent. Publishes only
          averagePPA.all / .pass / .rush: no totals, no down splits, no conference.
        columns:
          - name: filename
            data_tests: [unique, not_null]
      - name: raw_wepa_team_season
        description: >
          CFBD /wepa/team/season. Opponent-adjusted team metrics, each block published twice —
          once for what the team did and once suffixed `Allowed` for what it conceded. THE ONE
          METRICS ENDPOINT THAT SHIPS A teamId, so it joins to dim_team without a name match.
        columns:
          - name: filename
            data_tests: [unique, not_null]
      - name: raw_wepa_players_passing
        description: CFBD /wepa/players/passing. wEPA and the play count it was earned over.
        columns:
          - name: filename
            data_tests: [unique, not_null]
      - name: raw_wepa_players_rushing
        description: CFBD /wepa/players/rushing. Same shape as the passing endpoint.
        columns:
          - name: filename
            data_tests: [unique, not_null]
      - name: raw_wepa_players_kicking
        description: >
          CFBD /wepa/players/kicking. THE ODD ONE: the metric is `paar` (Points Above Average
          Replacement), not wEPA, on a different scale; the denominator is `attempts`, not
          `plays`; and there is no `position` because every row is a kicker.
        columns:
          - name: filename
            data_tests: [unique, not_null]

