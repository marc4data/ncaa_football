version: 2

sources:
  - name: raw
    description: >
      Immutable landing tables written by `src/load_raw_to_postgres.py`. One row per
      raw API response file. Never modified by dbt — everything downstream rebuilds
      from here (data quality rule #1).
    schema: "{{ target.schema }}"
    tables:
      - name: raw_teams
        description: CFBD /teams responses.
        columns:
          - name: filename
            description: Raw file name; the natural key for a single API response.
            data_tests:
              - unique
              - not_null
      - name: raw_games
        description: CFBD /games responses, one row per fetch (params record the season).
        columns:
          - name: filename
            data_tests:
              - unique
              - not_null
      - name: raw_manifest
        description: >
          One row per landed response across every endpoint, written by
          src/load_raw_to_postgres.py. Carries fetched_at (observation time) and row_count,
          which is what makes freshness and empty-response detection possible at all.
        columns:
          - name: endpoint
            data_tests:
              - not_null
          - name: filename
            data_tests:
              - not_null
