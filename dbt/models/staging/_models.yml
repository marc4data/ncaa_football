version: 2

models:
  - name: stg_teams
    description: >
      One row per team per season, from the latest successful year-parameterized /teams
      fetch for that season. Conference and classification are as of that season, not today.
    columns:
      - name: team_season_key
        description: season + team_id — the grain, stated explicitly.
        data_tests:
          - unique
          - not_null
      - name: team_id
        description: CFBD's own team id. Not unique on its own — a team appears once per season.
        data_tests:
          - not_null
      - name: season
        data_tests:
          - not_null
      - name: school
        data_tests:
          - not_null

  - name: stg_games
    description: One row per game from the latest successful /games fetch per season.
    columns:
      - name: game_id
        description: CFBD's own game id.
        data_tests:
          - unique
          - not_null
      - name: season
        data_tests:
          - not_null
      - name: home_team_id
        data_tests:
          - not_null
      - name: away_team_id
        data_tests:
          - not_null
      - name: season_type
        description: >
          regular, postseason, or the 2020-only spring_regular / spring_postseason — the FCS
          season moved to spring 2021. The spring values entered this model on 2026-08-18
          when the ingestion gap was closed; accepting them is correct, filtering them would
          re-create the 532-game hole the /records reconciliation test found.
        data_tests:
          - accepted_values:
              values: ['regular', 'postseason', 'spring_regular', 'spring_postseason']

  - name: stg_raw_manifest
    description: >
      Every landed API response, with observation time and row count. Deliberately not
      deduplicated — each fetch is a fact about the pipeline.
    columns:
      - name: endpoint
        data_tests:
          - not_null
      - name: is_success
        data_tests:
          - not_null
      - name: is_empty
        data_tests:
          - not_null
