version: 2

models:
  - name: stg_teams
    description: One row per team from the latest successful /teams fetch.
    columns:
      - name: team_id
        description: CFBD's own team id — the join key everywhere downstream.
        data_tests:
          - unique
          - not_null
      - name: school
        data_tests:
          - not_null

  - name: stg_games
    description: One row per game from the latest successful /games fetch per season.
    columns:
      - name: game_id
        description: CFBD's own game id.
        data_tests:
          - unique
          - not_null
      - name: season
        data_tests:
          - not_null
      - name: home_team_id
        data_tests:
          - not_null
      - name: away_team_id
        data_tests:
          - not_null
      - name: season_type
        data_tests:
          - accepted_values:
              values: ['regular', 'postseason']
