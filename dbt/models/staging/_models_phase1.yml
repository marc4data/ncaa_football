version: 2

models:
  - name: stg_conferences
    description: One row per conference per season. Note the payload's naming inversion — CFBD's `name` is the short form ("ACC") and `shortName` is the full title.
    columns:
      - name: season
        description: Season the conference roster applies to.
        data_tests: [not_null]
      - name: conference_id
        description: CFBD conference id.
        data_tests: [not_null]
      - name: conference_name
        description: Short form ("ACC"). This is what stg_teams.conference carries and what joins.
        data_tests: [not_null]
      - name: conference_long_name
        description: Full title ("Atlantic Coast Conference").
      - name: conference_abbreviation
        description: CFBD's abbreviation, often equal to conference_name.
      - name: classification
        description: fbs / fcs / ii / iii.
      - name: member_count_reported
        description: Member count as CFBD reports it; compared against the counted membership in dim_conference.

  - name: stg_venues
    description: One row per venue. Not season-scoped — /venues takes no year.
    columns:
      - name: venue_id
        description: CFBD venue id.
        data_tests: [unique, not_null]
      - name: venue_name
        description: Stadium name as CFBD spells it.
      - name: city
        description: Venue city.
      - name: state
        description: Venue state or province.
      - name: zip
        description: Postal code.
      - name: country_code
        description: ISO country code.
      - name: timezone
        description: IANA timezone; null for many venues.
      - name: latitude
        description: Decimal degrees.
      - name: longitude
        description: Decimal degrees.
      - name: elevation_m
        description: Elevation in metres.
      - name: capacity
        description: Seating capacity.
      - name: construction_year
        description: Year built.
      - name: is_grass
        description: Natural grass surface; null where unknown.
      - name: is_dome
        description: Enclosed venue.

  - name: stg_calendar
    description: One row per (season, season_type, week). CFBD serves nothing before 2002, which bounds every week-grain join.
    columns:
      - name: season
        description: Season.
        data_tests: [not_null]
      - name: season_type
        description: >
          regular, postseason, or the 2020-only spring_regular / spring_postseason — the
          COVID season, when FCS moved its 2020 schedule to spring 2021. Part of the key:
          Postseason Week 1 is not Regular Season Week 1, and neither is Spring Week 1.
          The spring values are accepted rather than filtered, because filtering would
          silently drop real games from a real season.
        data_tests:
          - not_null
          - accepted_values:
              values: ['regular', 'postseason', 'spring_regular', 'spring_postseason']
      - name: week
        description: Week number within the season type.
        data_tests: [not_null]
      - name: start_at
        description: Week window start, UTC.
      - name: end_at
        description: Week window end, UTC.
      - name: first_game_at
        description: Kickoff of the first game in the week.
      - name: last_game_at
        description: Kickoff of the last game in the week.

  - name: stg_game_team_stat
    description: >
      Box score, long: one row per (game, team, stat category). /games/teams ships ~35
      category/stat pairs per team with values as strings, including compound values like
      thirdDownEff "4-9" and possessionTime "31:24". Landed verbatim; fct_game_team pivots a
      curated subset.
    columns:
      - name: game_id
        description: CFBD game id.
        data_tests: [not_null]
      - name: team_id
        description: CFBD team id.
        data_tests: [not_null]
      - name: home_away
        description: Which side of the game this team was.
      - name: points
        description: Points scored, as reported on the box score.
      - name: team
        description: >
          School name as the box score reported it. Distinct from stg_teams.school, which is
          the season-correct affiliation — this is what CFBD printed on this game.
        data_tests: [not_null]
      - name: conference
        description: Conference as the box score reported it, same caveat as `team`.
      - name: stat_category
        description: CFBD's category name, e.g. totalYards, thirdDownEff.
        data_tests: [not_null]
      - name: stat_raw
        description: Value exactly as landed, string. Never parsed here.

  - name: stg_game_player_stat
    description: >
      Player box score, long: one row per (game, team, stat category, stat type, athlete).
      /games/players nests four arrays deep — game -> teams[] -> categories[] -> types[] ->
      athletes[] — and this flattens all of it. Values stay strings because the type names are
      open-ended and category-specific (C/ATT, YDS, QBR, LONG), so any parsing rule would be a
      decision to drop whatever CFBD adds next.
    columns:
      - name: game_id
        description: CFBD game id.
        data_tests: [not_null]
      - name: team
        description: >
          School name. THIS PAYLOAD SHIPS NO TEAM ID — unlike /games/teams. Joining it to a
          team dimension is a join on a string, and school names are not stable across
          seasons; resolution needs a season-scoped map and belongs in a mart.
        data_tests: [not_null]
      - name: conference
        description: Conference as the box score reported it.
      - name: home_away
        description: Which side of the game this team was.
      - name: points
        description: Team points, repeated on every athlete row of that team.
      - name: stat_category
        description: passing, rushing, receiving, kicking, punting, returns, interceptions.
        data_tests: [not_null]
      - name: stat_type
        description: The measure within the category — C/ATT, YDS, TD, INT, QBR, LONG, CAR.
        data_tests: [not_null]
      - name: athlete_id
        description: >
          CFBD athlete id, STRING. It looks numeric and is left as text: the spec types it as
          a string, and casting would be a lossy guess about an identifier CFBD never promised
          is one.
        data_tests: [not_null]
      - name: athlete_name
        description: Athlete name as reported on this box score.
      - name: stat_raw
        description: Value exactly as landed, string. "12/31" for C/ATT, "58" for YDS.

  - name: stg_game_weather
    description: >
      One row per game: conditions at kickoff plus the venue and matchup context CFBD ships
      with them. All twenty-two published fields are carried through. The endpoint had been
      landing since August and nothing read it — no page needed weather, so every DAG stayed
      green while the data sat unused.
    columns:
      - name: game_id
        description: CFBD game id.
        data_tests: [not_null, unique]
      - name: season
        description: Season, read from the row rather than parsed out of the request params.
        data_tests: [not_null]
      - name: week
        description: Week number within the season type.
      - name: season_type
        description: regular / postseason.
      - name: start_at
        description: Kickoff, timestamptz.
      - name: home_team
        description: >
          Home school by NAME. /games/weather ships no team ids at all, so this is a
          string-keyed join for anything downstream — same hazard as /teams/matchup.
      - name: home_conference
        description: Home conference as reported.
      - name: away_team
        description: Away school by name; same caveat as home_team.
      - name: away_conference
        description: Away conference as reported.
      - name: venue_id
        description: CFBD venue id — the one id this payload does carry, joinable to stg_venues.
      - name: venue
        description: Venue name as reported.
      - name: is_indoors
        description: >
          Whether the game was played indoors. Indoor games STILL report temperature and
          humidity — the stadium's, not the sky's — so any weather-effect analysis has to
          filter on this or it averages a dome into the rain.
      - name: temperature_f
        description: Temperature, Fahrenheit.
      - name: dew_point_f
        description: Dew point, Fahrenheit.
      - name: humidity_pct
        description: Relative humidity, percent.
      - name: precipitation_in
        description: Precipitation, inches.
      - name: snowfall_in
        description: Snowfall, inches.
      - name: wind_direction_deg
        description: Wind direction, degrees clockwise from north.
      - name: wind_speed_mph
        description: Wind speed, miles per hour.
      - name: pressure_mb
        description: Barometric pressure, millibars.
      - name: weather_condition_code
        description: CFBD's numeric condition code.
      - name: weather_condition
        description: Human-readable condition, e.g. "Fair".

  - name: stg_game_team_advanced
    description: >
      Advanced box score, wide: one row per (game, team) with offense and defense side by
      side. /stats/game/advanced publishes 62 field paths — PPA, success rate, explosiveness,
      line yards, stuff rate, and the same set again split by standard/passing downs and
      rushing/passing plays — and nothing read any of them until now. Wide rather than long
      because the schema is FIXED and typed, unlike the box-score endpoints whose category
      names CFBD can extend. Both sides are generated from one Jinja list so a
      `defense_x reads offense.x` mix-up is unrepresentable.
    columns:
      - name: game_id
        description: CFBD game id.
        data_tests: [not_null]
      - name: season
        data_tests: [not_null]
      - name: team
        description: >
          Team by NAME; this endpoint ships no ids. Resolution needs a season-scoped team
          map and belongs in a mart.
        data_tests: [not_null]
      - name: opponent
        description: Opponent by name, same caveat.
      - name: offense_ppa
        description: Predicted points added per play, this team's offense.
      - name: defense_ppa
        description: PPA per play allowed by this team's defense.

  - name: stg_team_season_advanced
    description: >
      Advanced season profile, wide: one row per (season, team). The widest payload CFBD
      serves at 82 field paths — the season companion to stg_game_team_advanced, plus a
      `rate` on each split, field position, havoc and scoring opportunities.
      `totalOpportunies` is CFBD's own typo and is the actual wire key; the lookup preserves
      it and the column is named correctly.
    columns:
      - name: season
        data_tests: [not_null]
      - name: team
        description: Team by name; no ids in this payload.
        data_tests: [not_null]
      - name: conference
        description: Conference as reported for that season.
      - name: offense_total_opportunities
        description: >
          Scoring opportunities — drives reaching the opponent's 40. Read from the wire key
          `totalOpportunies`, which is misspelled upstream; reading the correct spelling
          returns null for every row, silently.

  - name: stg_game_team_havoc
    description: >
      Havoc rates per (game, team). `offense` is havoc INFLICTED ON this team's offense,
      `defense` is havoc its defense created — both kept, neither renamed, because
      "allowed"/"created" would be an interpretation and staging represents the endpoint.
    columns:
      - name: game_id
        data_tests: [not_null]
      - name: team
        data_tests: [not_null]
      - name: conference
        description: This team's conference — stg_game_team_advanced does not carry it.
      - name: opponent_conference
        description: Opponent's conference.

  - name: stg_stat_category
    description: >
      The controlled vocabulary of box-score stat categories, one row per name. The
      authoritative list behind stg_game_team_stat.stat_category — without it, validating
      those categories means hardcoding a list that goes stale when CFBD adds one.
    columns:
      - name: stat_category
        description: Category name as CFBD publishes it, e.g. totalYards, thirdDownEff.
        data_tests: [not_null, unique]

  - name: stg_player_season_stat
    description: >
      Player season totals, long: one row per (season, player, category, stat type). Flat and
      EAV-shaped, and the highest-volume endpoint in the stats family. Values stay strings
      because statType is open-ended and each type carries its own units.
    columns:
      - name: season
        data_tests: [not_null]
      - name: player_id
        description: >
          CFBD player id, STRING — a real id, unlike the game box scores which carry only a
          name. Left as text because the spec types it as a string.
        data_tests: [not_null]
      - name: player_name
        description: Player name as reported.
      - name: position
        description: Listed position.
      - name: stat_category
        description: e.g. passing, rushing, defensive.
        data_tests: [not_null]
      - name: stat_type
        description: The measure within the category, e.g. YDS, TD, PD.
        data_tests: [not_null]
      - name: stat_raw
        description: Value exactly as landed, string. Never parsed here.

  - name: stg_player_season_success
    description: >
      Player success rate for a season: one row per (season, player), passing and rushing
      generated from one list. successRate is NULL when plays is zero, which is most rows;
      kept null rather than coerced to 0, because 0% on no attempts and 0% on twenty
      attempts are different facts.
    columns:
      - name: season
        data_tests: [not_null]
      - name: player_id
        data_tests: [not_null]
      - name: passing_success_rate
        description: Share of passing plays that stayed on schedule. Null when plays is 0.
      - name: rushing_success_rate
        description: Share of rushing plays that stayed on schedule. Null when plays is 0.

  - name: stg_player_game_success
    description: >
      Player success rate for a single game: one row per (game, player). A third of the
      landed responses for this endpoint are 400s — CFBD rejects a year-only call — and
      `status_code = 200` is what excludes them.
    columns:
      - name: game_id
        data_tests: [not_null]
      - name: player_id
        data_tests: [not_null]
      - name: opponent
        description: Opponent by name.

  - name: stg_rating_sp
    description: >
      SP+ team ratings, one row per (season, team), with offense / defense / special teams
      components. Exists ALONGSIDE stg_team_rating, which unions five ratings endpoints into
      a conformed long shape and necessarily drops what they do not share — six of eighteen
      SP+ fields survived that. Conforming is a mart's job; representing the endpoint is
      staging's, and nothing was doing it.
    columns:
      - name: season
        description: From the wire key `year`; renamed so it joins like every other model.
        data_tests: [not_null]
      - name: team
        data_tests: [not_null]
      - name: rating
        description: Overall SP+ rating, points per game above average.
      - name: ranking
        description: SP+ rank, 1 is best.
      - name: offense_success
        description: >
          Component metric. NULL for recent seasons — CFBD publishes SP+ components for
          older seasons and has not backfilled them. Carried anyway: a column that is null
          today and populated by a 2015 backfill tomorrow is worth having.
      - name: defense_havoc_total
        description: Havoc rate, nested one level deeper than the other defensive metrics.
      - name: special_teams_rating
        description: SP+ special teams rating.

  - name: stg_rating_sp_conference
    description: >
      SP+ at conference grain, one row per (season, conference). Same metrics as
      stg_rating_sp with the team dimension collapsed and no ranking on any axis. Its own
      model rather than a union with the team-grain one: different key, different columns.
    columns:
      - name: season
        data_tests: [not_null]
      - name: conference
        data_tests: [not_null]
      - name: rating
        description: Conference SP+ rating.

  - name: stg_rating_fpi
    description: >
      ESPN's FPI, one row per (season, team), with resume ranks and efficiency components.
      TWO KINDS OF NUMBER: `resume_rank_*` are RANKS where 1 is best; `efficiency_*` and
      `fpi` are RATINGS where higher is better. `fpi` appears in both groups under the same
      name upstream, so the prefixes are load-bearing.
    columns:
      - name: season
        data_tests: [not_null]
      - name: team
        data_tests: [not_null]
      - name: fpi
        description: The FPI rating itself. Not the same number as resume_rank_fpi.
      - name: resume_rank_fpi
        description: The team's RANK by FPI, 1 is best. Not the same number as fpi.
      - name: efficiency_overall
        description: Overall efficiency rating, higher is better.

  - name: stg_rating_srs
    description: >
      Simple Rating System, one row per (season, team). Covers far more teams than the other
      ratings — 265 rows for 2024 against 134 for Elo and FPI, because it rates FCS teams
      too, so a side-by-side join finds SRS populated where the others are null.
      /ratings/srs returns some schools TWICE, once with a conference and once with
      `conference: null` carrying an identical rating; the dedup prefers the row that names
      a conference.
    columns:
      - name: season
        data_tests: [not_null]
      - name: team
        data_tests: [not_null]
      - name: rating
        description: SRS rating, points above average adjusted for schedule.
      - name: ranking
        description: SRS rank, 1 is best.

  - name: stg_rating_srs_expanded
    description: >
      SRS plus `classification` — the field that makes the wider coverage usable. Its own
      model rather than folded into stg_rating_srs: separate endpoints, separate raw tables,
      and merging them would make the coverage matrix lie about both.
    columns:
      - name: season
        data_tests: [not_null]
      - name: team
        data_tests: [not_null]
      - name: classification
        description: fbs / fcs / ii / iii.

  - name: stg_rating_elo
    description: >
      Elo ratings, one row per (season, team) — the smallest ratings payload. A running
      rating rather than a season summary; the value is the rating at the end of the season
      fetched. NO ranking column: ordering by elo within a season produces one, and doing
      that in a mart is honest where inventing the column here would not be.
    columns:
      - name: season
        data_tests: [not_null]
      - name: team
        data_tests: [not_null]
      - name: elo
        description: Elo rating at the end of the fetched season.

  - name: stg_rating_core
    description: >
      CFBD's core rating. THE GRAIN IS (season, team, through_season_type, through_week) —
      the rating AS OF a point in the season, so a full backfill accumulates a time series.
      The landed data holds one as-of point per season today, which is exactly the condition
      under which a (season, team) assumption looks correct and silently drops rows later.
    columns:
      - name: season
        data_tests: [not_null]
      - name: through_week
        description: The rating is as of the end of this week.
      - name: team
        data_tests: [not_null]
      - name: model_version
        description: >
          Carried because a rating is not comparable across model versions — a chart that
          spliced core-v1 and core-v2 would show a step change that is an artifact.

  - name: stg_team_season_ppa
    description: >
      Team PPA for a season, one row per (season, team), offense and defense side by side.
      Alongside stg_team_rating, which takes `offense.overall` and nothing else — three of
      ten fields survived conforming. TWO SCALES: the flat metrics are per-play averages,
      `*_cumulative_*` are season totals. Defensive PPA is NOT sign-flipped: lower is better
      on the defensive columns, as CFBD publishes it.
    columns:
      - name: season
        data_tests: [not_null]
      - name: team
        data_tests: [not_null]
      - name: offense_overall
        description: PPA per play, this team's offense. Higher is better.
      - name: defense_overall
        description: PPA per play allowed. LOWER is better — the sign is not inverted here.
      - name: offense_cumulative_total
        description: Season total PPA, not a per-play average. Different scale to the above.

  - name: stg_game_team_ppa
    description: >
      Team PPA for a single game, one row per (game, team). Same six offensive and six
      defensive splits as the season model, no cumulative block — one game has no season
      total. Carries `opponent`, which the season model cannot.
    columns:
      - name: game_id
        data_tests: [not_null]
      - name: team
        data_tests: [not_null]
      - name: opponent
        description: Opponent by name; both teams' rows exist and join on game_id.

  - name: stg_player_season_ppa
    description: >
      Player PPA for a season, one row per (season, player). `averagePPA` and `totalPPA`
      carry the IDENTICAL eight keys, so the `average_ppa_` / `total_ppa_` prefixes are the
      only thing separating 0.352 from 114.748 for the same player and statistic.
    columns:
      - name: season
        data_tests: [not_null]
      - name: player_id
        description: CFBD player id, string.
        data_tests: [not_null]
      - name: conference_abbreviation
        description: >
          NAMED FOR WHAT IT HOLDS, BECAUSE THIS ENDPOINT IS THE ODD ONE OUT. It reports
          `B1G`, `B12`, `AAC` where /ppa/teams, /ppa/games and every ratings endpoint report
          `Big Ten`, `Big 12`, `American Athletic`. Calling it `conference` would invite a
          join that returns nothing and raises no error. Carried verbatim; mapping it is a
          mart's job.
      - name: average_ppa_all
        description: PPA per play across all plays.
      - name: total_ppa_all
        description: PPA accumulated across the season. Same statistic, different scale.

  - name: stg_player_game_ppa
    description: >
      Player PPA for a single game. THE GRAIN IS (season, season_type, week, player) because
      the payload carries NO gameId — the game is identified by week and opponent only, so a
      join to stg_games needs the (season, week, season_type, team) tuple. Thinner than the
      season model by the endpoint's own content, not by omission: averagePPA only, and only
      all / pass / rush. No conference column, because there is none on the payload.
    columns:
      - name: season
        data_tests: [not_null]
      - name: week
        data_tests: [not_null]
      - name: player_id
        data_tests: [not_null]
      - name: opponent
        description: The only identifier of who the game was against.
      - name: average_ppa_all
        description: PPA per play in this game.

  - name: stg_team_season_wepa
    description: >
      Opponent-adjusted team profile, one row per (season, team). Every block is published
      twice — once for what the team did, once suffixed `Allowed` for what it conceded — so
      this model loops over ['', 'Allowed'] where the ppa models loop over offense/defense.
      THE ONE METRICS ENDPOINT THAT SHIPS A teamId: /ratings/*, /ppa/* and
      /stats/season/advanced all identify a team by name only, so this is the single place in
      the adjusted-metrics family where a name-keyed join is not forced on the caller.
    columns:
      - name: season
        data_tests: [not_null]
      - name: team_id
        description: CFBD team id — joins straight to dim_team, unlike its siblings.
        data_tests: [not_null]
      - name: epa_total
        description: Opponent-adjusted EPA per play generated.
      - name: epa_allowed_total
        description: >
          EPA per play conceded. NOT inverted — a high value here is a bad defence, matching
          how CFBD publishes it.
      - name: explosiveness_allowed
        description: Explosiveness conceded.

  - name: stg_player_season_wepa_passing
    description: >
      Opponent-adjusted passing value per player, one row per (season, athlete). `plays` is
      load-bearing: wEPA is a per-play average, so 0.48 over 304 plays and 0.48 over 12 are
      different claims and any leaderboard needs a minimum-plays filter.
    columns:
      - name: season
        data_tests: [not_null]
      - name: athlete_id
        description: CFBD athlete id, string.
        data_tests: [not_null]
      - name: wepa
        description: Opponent-adjusted EPA per play.
      - name: plays
        description: Plays the average was earned over.

  - name: stg_player_season_wepa_rushing
    description: >
      Opponent-adjusted rushing value per player, one row per (season, athlete). Same shape
      as the passing model; a separate endpoint and raw table, so a separate model.
    columns:
      - name: season
        data_tests: [not_null]
      - name: athlete_id
        data_tests: [not_null]
      - name: wepa
        description: Opponent-adjusted EPA per play.
      - name: plays
        description: Plays the average was earned over.

  - name: stg_player_season_wepa_kicking
    description: >
      Opponent-adjusted kicking value per player. THE ODD ONE OF THE THREE AND DELIBERATELY
      NOT NORMALISED: the metric is `paar` (Points Above Average Replacement) on a different
      scale from wEPA, the denominator is `attempts` not `plays`, and there is no `position`
      because every row is a kicker. Renaming paar to wepa for symmetry would make three
      models look unionable when their measures are not comparable.
    columns:
      - name: season
        data_tests: [not_null]
      - name: athlete_id
        data_tests: [not_null]
      - name: paar
        description: Points Above Average Replacement. NOT wEPA, and not comparable to it.
      - name: attempts
        description: Kick attempts. The denominator here, where the others use plays.

  - name: stg_team_fbs
    description: >
      The FBS team list for a season, one row per (season, team), with its venue fully
      unnested. Its own model rather than a filter on stg_teams: a different endpoint and
      raw table, and the two do not always agree — /teams is the full universe including FCS
      opponents and stubs, /teams/fbs is CFBD's own answer to who is FBS. Where they differ,
      the difference is the interesting part and a filter would hide it.
    columns:
      - name: season
        description: From the request params; the payload carries no year.
        data_tests: [not_null]
      - name: team_id
        data_tests: [not_null]
      - name: venue_capacity
        description: From the embedded location object, not from /venues.
      - name: venue_elevation
        description: >
          Arrives as a STRING on the wire, unlike the other numerics in the block. Parsed
          with safe_numeric so an empty string does not fail the model.
      - name: alternate_names
        description: JSON array, carried as JSON.

  - name: stg_team_season_ats
    description: >
      Against-the-spread record, one row per (season, team). Ships a real teamId. `games` is
      NOT ats_wins + ats_losses + ats_pushes — an unlined game counts toward games and toward
      none of the outcomes, so the difference is the number of unlined games, which is worth
      knowing and would be destroyed by deriving the total.
    columns:
      - name: season
        data_tests: [not_null]
      - name: team_id
        data_tests: [not_null]
      - name: games
        description: Games played. Not the sum of the three outcome columns; see above.
      - name: avg_cover_margin
        description: Signed — positive means the team beat the spread on average.

  - name: stg_player_portal
    description: >
      Transfer portal entries. NO PLAYER ID: first and last name only, in the one dataset
      where a player's team is changing, so the grain includes `origin_team` — the same name
      entering from two schools is two entries and collapsing on name would merge two people.
    columns:
      - name: season
        data_tests: [not_null]
      - name: first_name
        data_tests: [not_null]
      - name: destination_team
        description: >
          NULL MEANS "entered the portal, not yet committed" — data, not a gap. Counting
          transfers INTO a school must exclude nulls; counting entries must not.
      - name: stars
        description: Recruiting-service star rating. Present far more often than `rating`.
      - name: rating
        description: Null for most rows. A null rating with 4 stars is a real combination.

  - name: stg_team_returning_production
    description: >
      Returning production, one row per (season, team). TEAM GRAIN DESPITE THE ENDPOINT NAME
      — /player/returning publishes nothing per player, only the share of last season's
      production coming back per team. THREE SCALES IN ONE ROW: total_*_ppa are absolute PPA
      totals, percent_*_ppa are shares of the prior season (0-1), and *_usage are shares of
      snaps (0-1). Plotting a total against a percent compares 100.6 with 0.338.
    columns:
      - name: season
        data_tests: [not_null]
      - name: team
        data_tests: [not_null]
      - name: total_ppa
        description: Absolute returning PPA.
      - name: percent_ppa
        description: Share of last season's PPA returning, 0 to 1. Different scale.

  - name: stg_player_season_usage
    description: >
      Player usage share for a season, one row per (season, player). Pairs with
      stg_player_season_ppa on the same key — usage is how often, PPA is how well.
    columns:
      - name: season
        data_tests: [not_null]
      - name: player_id
        data_tests: [not_null]
      - name: conference_abbreviation
        description: >
          Named for what it holds. This endpoint reports B1G / B12 / AAC like
          /ppa/players/season, where most others report full names; calling it `conference`
          would invite a join that returns nothing and raises no error.
      - name: usage_overall
        description: Share of the team's plays this player was involved in.

  - name: stg_game_pregame_wp
    description: >
      Pre-game win probability, one row per (game, SNAPSHOT). NOT DEDUPLICATED, like
      stg_lines — the endpoint is registered snapshot=True because the number moves with the
      market through the week, and collapsing to the latest fetch would keep one value per
      game and discard the movement that repeated fetching exists to capture.
    columns:
      - name: snapshot_ts
        description: >
          When the probability was OBSERVED (raw_manifest.fetched_at), not when the file was
          loaded. Load time would make a catch-up load look simultaneous.
        data_tests: [not_null]
      - name: game_id
        data_tests: [not_null]
      - name: home_win_probability
        description: >
          Home team's probability. The away side is 1 - this and is NOT stored: deriving it
          is exact, whereas storing both invites them to disagree.
      - name: spread
        description: Point spread at the time of the snapshot.

  - name: stg_field_goal_ep
    description: >
      The field-goal expected-points curve, one row per yard line. Static — the endpoint
      takes no parameters and returns the same 100 rows every call. `yards_to_goal` and
      `kick_distance` differ by the snap, hold and end-zone depth, which is why a
      0-yards-to-goal row still has a 17-yard kick; both are kept.
    columns:
      - name: yards_to_goal
        description: Field position.
        data_tests: [not_null, unique]
      - name: kick_distance
        description: What the kicker actually faces, in yards.
      - name: expected_points
        description: Expected points of attempting the field goal from there.

  - name: stg_coach_season
    description: >
      Coaching record, one row per (coach, season, team), unnested from /coaches. TEAM IS
      PART OF THE GRAIN: a coach can appear twice in one season when an interim takes over
      mid-year, so (coach, season) is not unique. `hired_at` belongs to the coach, not the
      season, so it repeats across their rows and is the most recent hire rather than the one
      that started this season.
    columns:
      - name: coach_id
        data_tests: [not_null]
      - name: season
        data_tests: [not_null]
      - name: team_id
        data_tests: [not_null]
      - name: hired_at
        description: Coach-level, not season-level. Repeats across that coach's rows.

  - name: stg_coach_season_detail
    description: >
      The rich coaching season from /coaches/seasons — same grain as stg_coach_season, 36
      fields against 19. Both are kept: separate endpoints, separate raw tables, and they do
      not cover the same seasons (/coaches is fetched back to 1886, /coaches/seasons for
      three). The five record splits are generated from one list so a `home_wins` reading
      `away.wins` is unrepresentable.
    columns:
      - name: coach_id
        data_tests: [not_null]
      - name: season
        data_tests: [not_null]
      - name: team_id
        data_tests: [not_null]
      - name: attribution_complete
        description: >
          Whether CFBD attributes the whole season to this coach. False means the record is
          shared with an interim and must not be read as one person's season.
      - name: neutral_win_percentage
        description: >
          NULL where the split has no games, which is most neutral-site and postseason rows.
          Kept null rather than coerced to 0 — no games played and every game lost are not
          the same season.
      - name: year_over_year_wins
        description: A DELTA against the previous season, not an absolute.
      - name: draft_year
        description: The draft FOLLOWING this season, so season + 1.

  - name: stg_recruit
    description: >
      Individual recruits, one row per recruit record. TWO IDS AND THEY ARE NOT THE SAME:
      `recruit_id` is the recruiting record, `athlete_id` is the college athlete and is null
      until they enrol or get linked. Joining player stats on recruit_id returns nothing;
      joining on athlete_id silently drops every unlinked recruit.
    columns:
      - name: recruit_id
        data_tests: [not_null]
      - name: athlete_id
        description: Null until the recruit exists as a college athlete.
      - name: committed_to
        description: Null for uncommitted recruits — data, not a gap.
      - name: height_inches
        description: Inches. No unit on the wire.
      - name: hometown_fips_code
        description: County FIPS. Called `fipsCode` here, `countyFips` on /draft/picks.

  - name: stg_team_recruiting_rank
    description: >
      Team recruiting class ranking, one row per (class year, team). `national_rank` and
      `points` disagree on ties — several teams can share a points total and get distinct
      ranks — so leaderboards built on each are not interchangeable.
    columns:
      - name: recruiting_class
        data_tests: [not_null]
      - name: team
        data_tests: [not_null]

  - name: stg_team_recruiting_position_group
    description: >
      Recruiting strength by position group. HAS NO UNIQUE KEY, and the endpoint is why:
      every specific group is one row per team, but `All Positions` appears EIGHT times for
      241 of 264 teams with different ratings and nothing in the payload to tell them apart.
      /recruiting/groups aggregates over a year window and recruit type it does not echo
      back, and the registry calls it with no parameters. Deliberately exempt from the grain
      sweep; fetching per explicit window is a registry change recorded in the decision log.
      No season column either, so it cannot be joined to stg_team_recruiting_rank on a class.
      `commits` and `average_stars` arrive as STRINGS beside numeric siblings.
    columns:
      - name: team
        data_tests: [not_null]
      - name: position_group
        data_tests: [not_null]

  - name: stg_team_talent
    description: >
      Team talent composite, one row per (season, team) — the accumulated recruiting rating
      of the roster, as distinct from one class's rank in stg_team_recruiting_rank.
    columns:
      - name: season
        data_tests: [not_null]
      - name: team
        data_tests: [not_null]

  - name: stg_draft_pick
    description: >
      One row per NFL draft pick. Carries ids for BOTH worlds — college_athlete_id /
      college_team_id inward, nfl_athlete_id / nfl_team_id outward. THREE PICK NUMBERS:
      `overall_pick` across the draft, `round`, and `pick_in_round` within it; using
      pick_in_round where overall was meant produces thirty-two number-one picks per draft.
    columns:
      - name: draft_year
        data_tests: [not_null]
      - name: overall_pick
        description: Pick number across the whole draft. Not pick_in_round.
        data_tests: [not_null]
      - name: hometown_latitude
        description: >
          A STRING on this endpoint where /recruiting/players sends a number. Parsed with
          safe_numeric so the two align.

  - name: stg_draft_position
    description: >
      The NFL draft position vocabulary. Small and load-bearing: /draft/picks spells
      positions out ("Quarterback") where the rest of the API abbreviates ("QB"), and this is
      the mapping between them.
    columns:
      - name: position_name
        data_tests: [not_null, unique]
      - name: position_abbreviation
        description: The form the rest of the API uses.

  - name: stg_nfl_team
    description: >
      NFL franchises. NO ID ON THE PAYLOAD, though /draft/picks carries nflTeamId — and the
      only shared value, `location`, is AMBIGUOUS rather than merely fragile: two franchises
      share "New York" and two share "Los Angeles", and /draft/picks stores exactly those
      bare locations. A pick assigned to New York cannot be resolved to a franchise through
      this table, and a location join would silently double every such pick. The key is
      `display_name`. Recorded rather than worked around; inventing an id would be inventing
      data.
    columns:
      - name: location
        description: >
          "Chicago". Matches /draft/picks.nfl_team but NOT uniquely — two franchises share
          "New York" and two share "Los Angeles", verified against the real data. Explicitly
          not the key.
        data_tests: [not_null]
      - name: display_name
        description: '"Chicago Bears". The actual unique key on this table.'
        data_tests: [not_null, unique]

  - name: stg_team_record
    description: >
      Season win-loss record, one row per (season, team), split seven ways. DELIBERATELY NOT
      the source of truth — records are derived from the game spine in fct_team_record and
      this endpoint exists to reconcile against that derivation. Covers every division: 668
      rows for 2024 including Division III. `division` is an EMPTY STRING, not null, for teams
      that have none.
    columns:
      - name: season
        data_tests: [not_null]
      - name: team_id
        data_tests: [not_null]
      - name: classification
        description: fbs / fcs / ii / iii — what makes the non-FBS rows filterable.
      - name: division
        description: Empty string rather than null where a team has none.
      - name: total_wins
        description: Wins across all games. Compare against fct_team_record, not replace it.

  - name: stg_roster
    description: >
      Team rosters, one row per (season, player, TEAM) — team is in the grain because a
      player can appear on two rosters in one season. Ten did in 2024, where a mid-season move
      leaves them listed by both schools; keying on (season, player_id) would silently drop
      one row per transfer. THE `year` FIELD ON THE WIRE IS THE CLASS YEAR, NOT THE SEASON — reading it as the season puts every senior in 4 AD. The season
      comes from the request params, so unparameterized fetches are excluded.
    columns:
      - name: season
        description: From the request params. The payload has no season.
        data_tests: [not_null]
      - name: player_id
        data_tests: [not_null]
      - name: class_year
        description: 1-4, freshman to senior. Named to keep it distinct from `season`.
      - name: recruit_ids
        description: >
          JSON array bridging back to stg_recruit. The reverse of that model's `athlete_id`,
          which is null for anyone unlinked — between the two most players can be joined.
      - name: home_fips_code
        description: >
          County FIPS. Spelled `homeCountyFIPS` here, `fipsCode` on /recruiting/players and
          `countyFips` on /draft/picks; aligned so callers need not know.

  - name: stg_conference_affiliation
    description: >
      Which conference a team belonged to and WHEN, one row per (team, conference, start
      year). The only endpoint that dates an affiliation — dim_team needs a row per season to
      say the same thing. Grain includes start_year because a team can rejoin a conference it
      previously left.
    columns:
      - name: team_id
        data_tests: [not_null]
      - name: conference_id
        description: Carried here; most conference-bearing endpoints give a name only.
      - name: start_year
        data_tests: [not_null]
      - name: end_year
        description: >
          NULL MEANS CURRENT. The open interval is the useful part; coercing it to a
          far-future date would break the `is null` test that identifies current membership.

  - name: stg_conference_change
    description: >
      Realignment as EVENTS, one row per (team, effective year) — the complement to
      stg_conference_affiliation's intervals. Carries classification on both sides, so a
      division move is a single fact rather than two affiliation rows that happen to differ.
      36 moves in 2024 alone, which is why membership is resolved per season everywhere else.
    columns:
      - name: team_id
        data_tests: [not_null]
      - name: effective_year
        data_tests: [not_null]

  - name: stg_cfp_bracket
    description: >
      The playoff bracket header, one row per (season, competition). THE PAYLOAD IS A SINGLE
      OBJECT, not an array — the only endpoint shaped that way.
      DELIBERATELY PARTIAL: /playoffs/cfp is a composite whose participants[] and
      rounds[].matchups[] duplicate /playoffs/cfp/participants and /playoffs/cfp/games
      exactly. Unnesting them here too would put the same rows in two places from sources
      that can drift between fetches, with no way to say which was right. The fields are
      exposed, from the endpoints that own them.
    columns:
      - name: season
        data_tests: [not_null]
      - name: format
        description: >
          e.g. twelve_team_2024. The format changed in 2024 and will change again; a bracket
          read without it cannot be compared across eras.
      - name: champion_team_id
        description: Null until the tournament completes.

  - name: stg_cfp_participant
    description: >
      The playoff field, one row per (season, team). Season comes from the request — the rows
      carry no year. `bid_type` and `conference_champion` are different questions: a team can
      be a champion without an automatic bid, since the twelve-team format grants automatic
      bids to the five highest-ranked champions only.
    columns:
      - name: season
        data_tests: [not_null]
      - name: team_id
        data_tests: [not_null]
      - name: seed
        description: Bracket seed, distinct from committee_rank.
      - name: eliminated_round
        description: >
          NULL FOR THE CHAMPION — they were never eliminated. A count of eliminations that
          ignores the null undercounts the field by one.

  - name: stg_cfp_matchup
    description: >
      Playoff bracket matchups, one row per (season, matchup) — the bracket as a graph.
      SLOTS ARE FLATTENED TO POSITION 1 AND 2, the opposite call from the box scores, because
      the key set is CLOSED: a matchup has exactly two ordered slots and always will. Long
      form would force every caller to self-join to ask who played whom.
    columns:
      - name: season
        data_tests: [not_null]
      - name: matchup_id
        description: >
          The matchup id WITHIN the bracket (31, 36). A DIFFERENT NUMBER from game_id;
          confusing them joins nothing and raises nothing.
        data_tests: [not_null]
      - name: game_id
        description: The CFBD game id (401677176). This is what joins to stg_games.
      - name: slot_1_source
        description: >
          Populated only while the participant is unknown, naming the feeding matchup. A slot
          has a participant or a source, never both; a bracket fetched mid-tournament is a
          legitimate state.
      - name: advances_to_matchup_id
        description: >
          The bracket EDGE — which matchup the winner feeds. Without it this is a list of
          games rather than a tree.

  - name: stg_play
    description: >
      Play-by-play, one row per play. 619,113 plays across 2024-2026 — the highest-volume
      model in the project by an order of magnitude.
      A VIEW DELIBERATELY: a full unnest with field extraction measures 2.4s on the droplet,
      cheap while nothing consumes it. THE FIRST MART THAT READS THIS TWICE SHOULD MATERIALIZE
      IT AS A TABLE — re-inlining a 619k-row unnest per reference is what made fct_game fail
      to finish in 22 minutes when stg_games was still a view.
      Scope is 2024-2026 by the DATA, not a filter: CLAUDE.md limits play-by-play to those
      seasons and the backfill honoured it, so a predicate here would encode the rule twice.
    columns:
      - name: play_id
        description: >
          Eighteen digits, kept as TEXT. CFBD never promised it is numeric, and it is past
          comfortable range for anything narrower than a bigint.
        data_tests: [not_null]
      - name: game_id
        description: Typed as bigint — this is the join to stg_games.
        data_tests: [not_null]
      - name: drive_id
        description: String, joins to stg_drive.drive_id.
      - name: clock_seconds
        description: >
          Derived from the minutes/seconds object so plays order within a period. Text
          ordering puts 9:00 after 12:50.
      - name: is_scoring_play
        description: Marks the play that SCORED, not whether the game had scoring.
      - name: ppa
        description: Predicted points added for this play.

  - name: stg_drive
    description: >
      Drives, one row per drive — the layer between a game and its plays. Start and end
      blocks are symmetric and generated from one list, so `end_yardline` reading
      `start.yardline` is unrepresentable.
    columns:
      - name: drive_id
        description: String, joins to stg_play.drive_id.
        data_tests: [not_null]
      - name: game_id
        data_tests: [not_null]
      - name: start_yardline
        description: >
          Field position from one end; `start_yards_to_goal` measures the same spot from the
          other. Both kept — which is "the" position depends on whose drive it is.
      - name: is_home_offense
        description: >
          THE ONLY LINK TO HOME AND AWAY on this payload. The drive names its offense and
          defense by school, never as home or away.
      - name: elapsed_seconds
        description: >
          Total drive length in seconds, derived from the mm:ss object for the same reason
          stg_play carries clock_seconds. The raw components are elapsed_minutes and
          elapsed_seconds_part.

  - name: stg_play_stat
    description: >
      Play-level stat lines, one row per (play, athlete, stat type) — the structured version
      of stg_play.play_text. SEVERAL ROWS PER PLAY IS NORMAL: a completed pass produces a
      passer, a receiver and a reception. Between this, stg_play and stg_drive a play can be
      traced from its drive to the people in it with no name comparison, which is rare here.
    columns:
      - name: play_id
        description: Joins to stg_play.play_id; both strings.
        data_tests: [not_null]
      - name: athlete_id
        data_tests: [not_null]
      - name: stat_type
        description: Joins to stg_play_stat_type.stat_type.
        data_tests: [not_null]
      - name: stat
        description: >
          A NUMBER here, unlike the box-score models where every value is a string — this
          endpoint reports one measure per row rather than a compound like "4-9".

  - name: stg_play_type
    description: >
      The play type vocabulary, 49 rows. The controlled list behind stg_play.play_type, which
      stores the `text` form. Also the only source of a play type's id and abbreviation,
      neither of which stg_play carries.
    columns:
      - name: play_type_id
        data_tests: [not_null, unique]
      - name: play_type
        description: The `text` form, which is what stg_play.play_type stores.

  - name: stg_play_stat_type
    description: >
      The play-stat type vocabulary, 26 rows. Keyed `name` on the wire where the play types
      use `text`, and with no abbreviation — two vocabularies from one API, spelled two ways.
    columns:
      - name: stat_type_id
        data_tests: [not_null, unique]
      - name: stat_type
        description: Joins to stg_play_stat.stat_type.

  - name: stg_game_box_info
    description: >
      Advanced box score header, one row per game. THE GAME ID IS NOT IN THE PAYLOAD —
      /game/box/advanced is fetched one game at a time and the response never names which
      game it is, so the id is read from `params`. One raw object holds three grains
      (gameInfo, teams, players) and therefore feeds three models.
    columns:
      - name: game_id
        description: From the request params; the payload has no id.
        data_tests: [not_null, unique]
      - name: home_win_prob
        description: >
          THE POSTGAME figure — 0.9989 for a 63-0 win — not a forecast. stg_game_pregame_wp
          holds the pre-kickoff series and stg_game_win_probability the live one.
      - name: excitement_index
        description: CFBD's excitement rating for the game.

  - name: stg_game_box_team
    description: >
      Advanced box score at team grain, one row per (game, team) — the widest model here.
      EIGHT BLOCKS EACH KEYED BY TEAM NAME with no positional guarantee, so each is unnested
      independently and joined on (game_id, team); a positional read would work on almost
      every game and silently swap two teams' numbers on the one where CFBD ordered a block
      differently. The spine is a UNION across blocks so a team missing from one block does
      not lose its row.
    columns:
      - name: game_id
        data_tests: [not_null]
      - name: team
        data_tests: [not_null]
      - name: ppa_overall_total
        description: PPA PER PLAY. Not the same scale as cumulative_ppa_overall_total.
      - name: cumulative_ppa_overall_total
        description: PPA accumulated over the game. Same statistic, different scale.
      - name: ppa_overall_quarter3
        description: >
          NULL where the quarter had no charted plays — a quarter with no plays is not a
          quarter with zero PPA, so the null is kept.
      - name: havoc_total
        description: >
          The `havoc` block is ordered OPPOSITE to `ppa` in 104 of 104 landed games, which is
          why the blocks are joined by name rather than position. Whether the number is havoc
          this team's defence caused or havoc its offence suffered is not stated by the API
          and is not asserted here — it needs a reconciliation against stg_game_team_havoc
          before anything downstream relies on the direction.

  - name: stg_game_box_player
    description: >
      Advanced box score at player grain, one row per (game, team, player). Usage and PPA are
      separate arrays joined on the player name. NO ATHLETE ID ON THIS PAYLOAD — the key is a
      name within a game, so two same-named players in one game would collide and nothing in
      the response could separate them. /games/players and /stats/player/season carry real
      ids and are the better join for anything player-level; this model is for the advanced
      metrics they lack.
    columns:
      - name: game_id
        data_tests: [not_null]
      - name: player_name
        data_tests: [not_null]
      - name: usage_total
        description: Share of the team's plays, 0-1. A SHARE, not a rate.
      - name: ppa_average_total
        description: Points per play. A RATE, not a share.

  - name: stg_game_win_probability
    description: >
      In-game win probability, one row per (game, play) — the live series. THE THIRD AND LAST
      win probability in the project: stg_game_pregame_wp is the pre-kickoff forecast,
      stg_game_box_info the single postgame figure, and this the play-by-play series. None is
      named `win_probability` alone, because reading one as another is invisible.
      Carries a real playId joining to stg_play, so a probability swing traces to the play
      that caused it.
    columns:
      - name: play_id
        description: Joins to stg_play.play_id.
        data_tests: [not_null, unique]
      - name: game_id
        data_tests: [not_null]
      - name: home_has_ball
        description: >
          POSSESSION, not favouritism. homeBall false with home_win_probability 0.9 is a
          losing team with the ball.
      - name: home_win_probability
        description: Home team's probability at this play.

  - name: stg_passing_player_season
    description: >
      Passer production for a season, one row per (season, player). RICHER THAN THE BOX
      SCORE, not a duplicate: stg_game_player_stat has completions and yards, this has air
      yards, depth of target and yards after catch — the throw rather than its result.
      New in spec v5.25.0 and 2025 onward; 2022-2024 answer 200 with an empty array.
    columns:
      - name: season
        data_tests: [not_null]
      - name: player_id
        data_tests: [not_null]
      - name: average_depth_of_target
        description: >
          COMPUTED OVER air_yards_attempts_available, NOT over attempts. Air yards are
          charted for 44.9% of attempts in the landed data, so reading this as a season-wide
          figure overstates its basis by more than double.
      - name: air_yards_attempts_available
        description: The denominator for average_depth_of_target. Carried for that reason.

  - name: stg_passing_player_game
    description: >
      Passer production for a single game, one row per (game, player). Carries a real gameId,
      so it joins to stg_games without a name match — unlike /ppa/players/games, which
      identifies its game by week and opponent alone.
    columns:
      - name: game_id
        data_tests: [not_null]
      - name: player_id
        data_tests: [not_null]

  - name: stg_passing_team_season
    description: >
      Team passing for a season, one row per (season, team). Both sides generated from one
      list. DEFENSE IS PASSING ALLOWED — `defense_completion_rate` is what opposing passers
      achieved, so lower is better on every defensive column. Not inverted, matching CFBD and
      the ppa/wepa models.
    columns:
      - name: season
        data_tests: [not_null]
      - name: team
        data_tests: [not_null]
      - name: defense_completion_rate
        description: Completion rate ALLOWED. Lower is better.

  - name: stg_passing_team_game
    description: >
      Team passing for a single game, one row per (game, team). Two rows per game, so a game
      and its opponent are both present and joinable on game_id.
    columns:
      - name: game_id
        data_tests: [not_null]
      - name: team
        data_tests: [not_null]

  - name: stg_passing_play
    description: >
      Enriched pass attempts, one row per pass — the most detailed play data here. Where
      stg_play describes every play with a text string, this describes every PASS with
      structured geometry: where it was thrown, how far in the air, at whom, and what
      happened. 7,396 rows for a single week, which is why the endpoint is week-scoped and
      opt-in. Three ids join out — playId to stg_play, driveId to stg_drive, gameId to
      stg_games — and passerId/targetId are athlete ids /games/players does not carry.
    columns:
      - name: play_id
        description: Joins to stg_play.play_id.
        data_tests: [not_null, unique]
      - name: parse_status
        description: >
          A QUALITY FLAG THAT MUST NOT BE IGNORED, AND NOT A RARE CASE: 29,750 rows are
          `partial` against 24,322 `complete` on the landed data — the MAJORITY of pass plays
          are only partially parsed. A row whose air yards are null because the parse failed
          looks identical to a throw that genuinely had none, and only this column separates
          them. Any analysis ignoring it silently mixes "unknown" with "zero" on most rows.
          Nothing here filters on it — that is a mart's decision.
      - name: is_spike
        description: >
          Spikes, throwaways and intentional grounding were never meant to be caught. A
          completion rate computed off this table without excluding them measures something
          other than passing accuracy.
      - name: target_id
        description: Null on an incompletion with no identifiable target, and on a throwaway.

  - name: stg_lines
    description: >
      One row per (game, provider, snapshot). Deliberately NOT deduplicated — repeated
      fetches of the same request are the point, because /lines returns only opening and
      current with nothing between, and that movement cannot be backfilled.
    columns:
      - name: filename
        description: Raw file the snapshot came from; provenance back to the landed response.
      - name: snapshot_ts
        description: When the line was OBSERVED (raw_manifest.fetched_at), not when it was loaded.
        data_tests: [not_null]
      - name: game_id
        description: CFBD game id.
        data_tests: [not_null]
      - name: season
        description: Season.
      - name: week
        description: Week.
      - name: season_type
        description: regular or postseason.
      - name: provider_raw
        description: Sportsbook name exactly as landed, including the "Draft Kings" spelling.
        data_tests: [not_null]
      - name: provider_key
        description: Canonical key. Null means an unmapped sportsbook, which fails assert_no_unmapped_provider.
      - name: spread
        description: Numeric spread. Disagrees with formatted_spread historically; neither is authoritative.
      - name: formatted_spread
        description: Spread as CFBD formats it for display. Kept separate and never reconciled against spread.
      - name: spread_open
        description: Opening spread.
      - name: over_under
        description: Current total.
      - name: over_under_open
        description: Opening total.
      - name: home_moneyline
        description: Home moneyline.
      - name: away_moneyline
        description: Away moneyline.
