version: 2

models:
  - name: dim_season
    description: One row per season. Thin by design — it exists so season is a joinable key with attributes rather than a bare integer.
    columns:
      - name: season
        description: Season year, the natural key.
        data_tests: [unique, not_null]
      - name: season_label
        description: Season as text, for display.
      - name: first_game_date
        description: Date of the earliest game, era-aware.
      - name: last_game_date
        description: Date of the latest game.
      - name: game_count
        description: Games recorded in the season.
        data_tests: [not_null]
      - name: has_postseason
        description: Whether any postseason game exists for the season.
      - name: is_current_season
        description: True for the newest season present.

  - name: dim_week
    description: >
      One row per (season, season_type, week). KNOWN CONSTRAINT: CFBD serves no /calendar
      before 2002, so this covers 25 of the 157 seasons in fct_game — any week-grain join
      loses everything earlier.
    columns:
      - name: week_sk
        description: Surrogate key over (season, season_type, week).
        data_tests: [unique, not_null]
      - name: season
        description: Season.
        data_tests: [not_null]
      - name: season_type
        description: regular, postseason, or the 2020-only spring variants.
        data_tests: [not_null]
      - name: week
        description: Week number within the season type.
        data_tests: [not_null]
      - name: start_at
        description: Week window start, UTC.
      - name: end_at
        description: Week window end, UTC.
      - name: first_game_at
        description: First kickoff in the week.
      - name: last_game_at
        description: Last kickoff in the week.
      - name: start_date
        description: Week start as a UTC date.
      - name: end_date
        description: Week end as a UTC date.

  - name: dim_conference
    description: One row per (season, conference). Season-scoped because membership and existence change year to year.
    columns:
      - name: conference_sk
        description: Surrogate key over (season, conference_id).
        data_tests: [unique, not_null]
      - name: season
        description: Season.
        data_tests: [not_null]
      - name: conference_id
        description: CFBD conference id.
        data_tests: [not_null]
      - name: conference_name
        description: Short form ("ACC") — the value stg_teams.conference joins on.
        data_tests: [not_null]
      - name: conference_long_name
        description: Full title.
      - name: conference_abbreviation
        description: CFBD abbreviation.
      - name: classification
        description: fbs / fcs / ii / iii.
      - name: member_count_reported
        description: Membership as CFBD reports it.
      - name: member_team_count
        description: Membership counted from dim_team. A divergence from the reported count is a realignment one source has and the other has not.

  - name: dim_venue
    description: >
      One row per venue, not season-scoped. NOTE: /games carries the venue NAME and no venue
      id, so this cannot be joined to fct_game reliably; fct_game keeps the venue name
      denormalized instead.
    columns:
      - name: venue_sk
        description: Surrogate key over venue_id.
        data_tests: [unique, not_null]
      - name: venue_id
        description: CFBD venue id.
        data_tests: [not_null]
      - name: venue_name
        description: Stadium name.
      - name: city
        description: City.
      - name: state
        description: State or province.
      - name: zip
        description: Postal code.
      - name: country_code
        description: ISO country code.
      - name: timezone
        description: IANA timezone; frequently null.
      - name: latitude
        description: Decimal degrees.
        # A second source table, so a payload-shape change at CFBD's end shows up here even
        # if dim_team is untouched. Also the only numeric column under this test — the cast
        # to text is what makes one test work across types. Measured 95.5%.
        data_tests:
          - populated_rate:
              arguments: {min_rate: 0.85}
      - name: longitude
        description: Decimal degrees.
      - name: elevation_m
        description: Elevation in metres.
      - name: capacity
        description: Seating capacity.
      - name: construction_year
        description: Year built.
      - name: is_grass
        description: Natural grass surface.
      - name: is_dome
        description: Enclosed venue.

  - name: dim_provider
    description: One row per sportsbook. Exists so that two spellings of the same book cannot become two dimension members.
    columns:
      - name: provider_sk
        description: Surrogate key over provider_key.
        data_tests: [unique, not_null]
      - name: provider_key
        description: Canonical key — draftkings, espn_bet, bovada.
        data_tests: [unique, not_null]
      - name: provider_name
        description: Display name. DraftKings is canonical; "Draft Kings" maps to it.
        data_tests: [not_null]
      - name: first_seen_at
        description: Earliest snapshot carrying this provider.
      - name: last_seen_at
        description: Latest snapshot carrying this provider.
      - name: line_rows
        description: Line rows observed across all snapshots.

  - name: dim_team
    description: >
      One row per (season, team). SEASON-SCOPED, NOT SCD2 — per-season scoping answers "what
      was true in season X", which is what every page asks, and realignment happens between
      seasons. Carries contrast-safe colour variants computed in dbt, never in the app.
    columns:
      - name: team_sk
        description: Surrogate key over (season, team_id).
        data_tests: [unique, not_null]
      - name: season
        description: Season the attributes apply to.
        data_tests: [not_null]
      - name: team_id
        description: CFBD team id. Not unique alone — a team appears once per season.
        data_tests: [not_null]
      - name: school
        description: School name.
        data_tests: [not_null]
      - name: mascot
        description: Mascot.
      - name: abbreviation
        description: Short display code.
      - name: conference
        description: Conference short name for this season.
      - name: conference_sk
        description: FK to dim_conference; null for teams with no conference that season.
      - name: division
        description: Division within the conference, where one exists.
      - name: classification
        description: fbs / fcs / ii / iii.
      - name: is_fbs
        description: Convenience flag for the FBS spine.
      - name: city
        description: Team city.
        # Canary for json_get_nested_string, the two-hop accessor. It reads `location.city`,
        # and if the parent hop ever stopped resolving this would go to 0% in silence
        # exactly as the logos did. Measured 97.3%.
        data_tests:
          - populated_rate:
              arguments: {min_rate: 0.90}
      - name: state
        description: Team state.
      - name: color_raw
        description: Primary colour exactly as landed. CFBD returns the literal string '#null' when absent; that is normalised to NULL in staging.
        # Canary for json_get_string, the plain key accessor, on the column the entire
        # contrast ladder is computed from. At 0% every team would fall to the fallback
        # rung and still render — the same invisible failure. Measured 97.0%.
        data_tests:
          - populated_rate:
              arguments: {min_rate: 0.90}
      - name: alt_color_raw
        description: Alternate colour exactly as landed.
      - name: color_on_light
        description: Hex guaranteed to clear 3:1 against the light surface (#fcfcfb).
      - name: color_on_dark
        description: Hex guaranteed to clear 3:1 against the dark surface (#1a1a19).
      - name: color_source_light
        description: Which rung produced color_on_light — primary, alternate, adjusted or fallback.
        data_tests:
          - accepted_values: {values: ['primary', 'alternate', 'adjusted', 'fallback']}
      - name: color_source_dark
        description: Which rung produced color_on_dark.
        data_tests:
          - accepted_values: {values: ['primary', 'alternate', 'adjusted', 'fallback']}
      - name: color_source
        description: The worse of the two rungs — how far from brand this team renders at its worst. Belongs in the data-quality view.
      - name: logos
        description: Full landed logo array (16 URLs — light and dark at 8 sizes).
      - name: logo_source_url
        description: First logo URL, for provenance. Third-party CDN — never hotlinked by the site.
        data_tests:
          # Two thresholds because there are two honest floors, and only the pair of them
          # distinguishes the failure modes worth telling apart.
          #
          # The FBS-modern test is the acceptance criterion: every team the site can render
          # has an asset. Measured 3,143 of 3,143 — the FBS gaps are all defunct programs
          # (Denver, Carlisle, Wichita State), none later than 1995, and the site floor is
          # 2002. 0.99 rather than 1.0 leaves room for CFBD retiring one asset without
          # turning a build red over a single missing PNG.
          - populated_rate:
              arguments:
                min_rate: 0.99
                row_filter: "is_fbs and season >= 2002"
              config:
                severity: error
          # The all-rows test is the accessor canary. It exists to catch the exact defect
          # that got here — a wrong accessor returning NULL for every row — which reads as
          # 0% and trips this long before anyone notices the fallback is doing all the work.
          # Measured 96.4%; 0.90 sits well below the honest floor and far above broken.
          - populated_rate:
              arguments:
                min_rate: 0.90
              config:
                severity: error
      - name: logo_path
        description: Path to our own cached copy. Null until the fetch-and-cache task exists; the column is here so the app never changes shape later.

  - name: fct_game
    description: >
      One row per game. Owns the date-era logic: CFBD records kickoff times only from 2001,
      and converting the earlier midnight-UTC date-only values to a local zone shifts 66,496
      games back a day. Everything downstream reads game_date from here.
    columns:
      - name: game_sk
        description: Surrogate key over game_id.
        data_tests: [unique, not_null]
      - name: game_id
        description: CFBD game id.
        data_tests: [unique, not_null]
      - name: season
        description: Season.
        data_tests: [not_null]
      - name: week
        description: Week number.
      - name: season_type
        description: regular or postseason.
      - name: week_sk
        description: FK to dim_week. Null before 2002, where CFBD publishes no calendar.
      - name: home_team_sk
        description: FK to dim_team for the home side.
      - name: away_team_sk
        description: FK to dim_team for the away side.
      - name: home_team_id
        description: CFBD id, home side.
        data_tests: [not_null]
      - name: away_team_id
        description: CFBD id, away side.
        data_tests: [not_null]
      - name: home_team
        description: Home school name as carried on the game.
      - name: away_team
        description: Away school name as carried on the game.
      - name: home_classification
        description: Home side classification at game time.
      - name: away_classification
        description: Away side classification at game time.
      - name: start_date
        description: Kickoff timestamp, UTC.
      - name: game_date
        description: Local calendar date, era-aware — UTC date for date-only seasons, Eastern for timed ones.
      - name: kickoff_time_known
        description: False for seasons where CFBD records no kickoff time (pre-2001).
      - name: is_completed
        description: Whether the game has been played.
      - name: is_conference_game
        description: Conference matchup.
      - name: is_neutral_site
        description: Neutral-site game.
      - name: home_points
        description: Home score; null until played.
      - name: away_points
        description: Away score; null until played.
      - name: venue
        description: Venue name as carried on the game. Not a key — /games has no venue id.
      - name: attendance
        description: Reported attendance.

  - name: fct_team_series
    description: >
      All-time head-to-head record between two teams, one row per UNORDERED pair. Built from
      the game spine rather than fetched: /teams/matchup returns exactly this and pulling it
      would have cost 1,463 calls for data the warehouse already held. Verified before the
      decision — the derivation reproduces the endpoint exactly for Alabama-Auburn (84 games,
      51-32-1, 1902-2025).
      Complements srv_game, which carries the series PER GAME as it stood before each
      meeting — the right shape for a matchup page, the wrong one for asking about a rivalry.
      19,291 pairs, 109,107 games.
    columns:
      - name: team_series_sk
        description: Surrogate over the ordered pair.
        data_tests: [not_null, unique]
      - name: team_a_id
        description: >
          The LOWER team id of the pair. Arbitrary but stable, which is what collapses the
          two orientations of one rivalry into a single row and what a join needs.
        data_tests: [not_null]
      - name: team_b_id
        data_tests: [not_null]
      - name: team_a
        description: >
          School name from the team's MOST RECENT season. dim_team is season-scoped, so a
          plain join would multiply the series by every season each team existed.
      - name: games
        description: >
          Meetings WITH A KNOWN RESULT. wins + wins + ties equals this, asserted rather than
          trusted — srv_game's first version derived one side as games - home_wins, which
          is only correct in a sport without draws and overstated one side in 40,045 rows.
        data_tests: [not_null]
      - name: ties
        description: A tie is its own outcome, not the absence of a win.
      - name: unscored_games
        description: >
          Completed meetings with NO RECORDED SCORE — three exist across the whole spine
          (Sul Ross State v Angelo State 2025 among them: completed, away 62, home null).
          Upstream data. They cannot be credited to either side without inventing a result,
          so they are excluded from the win tally and counted here rather than dropped:
          games + unscored_games is meetings, `games` is meetings that resolved.
      - name: first_season
        description: Earliest meeting with a known result.

  - name: fct_game_team
    description: >
      One row per (game, team) — exactly two per game. Box-score columns come from
      /games/teams and are null where no box score exists; the game spine is left-joined so a
      game without one still produces its two rows rather than disappearing.
    columns:
      - name: game_team_sk
        description: Surrogate key over (game_id, team_id).
        data_tests: [unique, not_null]
      - name: game_sk
        description: FK to fct_game.
        data_tests: [not_null]
      - name: game_id
        description: CFBD game id.
        data_tests: [not_null]
      - name: team_sk
        description: FK to dim_team.
      - name: team_id
        description: CFBD team id for this side.
        data_tests: [not_null]
      - name: team
        description: School name for this side.
      - name: classification
        description: Classification at game time.
      - name: opponent_team_sk
        description: FK to dim_team for the opponent.
      - name: opponent_team_id
        description: Opponent CFBD id.
        data_tests: [not_null]
      - name: opponent
        description: Opponent school name.
      - name: opponent_classification
        description: Opponent classification at game time.
      - name: season
        description: Season.
        data_tests: [not_null]
      - name: week
        description: Week number.
      - name: season_type
        description: regular or postseason.
      - name: week_sk
        description: FK to dim_week; null before 2002.
      - name: game_date
        description: Era-aware local date, inherited from fct_game.
      - name: kickoff_time_known
        description: Inherited from fct_game.
      - name: is_home
        description: Whether this side was the home team.
      - name: is_neutral_site
        description: Neutral-site game.
      - name: is_conference_game
        description: Conference matchup.
      - name: is_completed
        description: Whether the game has been played.
      - name: venue
        description: Venue name.
      - name: attendance
        description: Reported attendance.
      - name: points_for
        description: Points scored by this side.
      - name: points_against
        description: Points conceded by this side.
      - name: margin
        description: points_for minus points_against; null until played.
      - name: result
        description: W, L or T; null until played.
        data_tests:
          - accepted_values:
              values: ['W', 'L', 'T']
              config: {where: "result is not null"}
      - name: first_downs
        description: Box score — first downs.
      - name: total_yards
        description: Box score — total yards. Can be negative in extreme games.
      - name: rushing_yards
        description: Box score — rushing yards.
      - name: passing_yards
        description: Box score — net passing yards.
      - name: rushing_attempts
        description: Box score — rushing attempts.
      - name: turnovers
        description: Box score — turnovers.
      - name: interceptions
        description: Box score — interceptions thrown.
      - name: fumbles_lost
        description: Box score — fumbles lost.
      - name: third_down_conversions
        description: Third downs converted, split from the compound "N-M" value.
      - name: third_down_attempts
        description: Third downs attempted, split from the compound value.
      - name: fourth_down_conversions
        description: Fourth downs converted.
      - name: fourth_down_attempts
        description: Fourth downs attempted.
      - name: penalties
        description: Penalty count, split from the compound "N-M" value.
      - name: penalty_yards
        description: Penalty yards.
      - name: possession_seconds
        description: Time of possession in seconds, parsed from "MM:SS".
      - name: has_box_score
        description: Whether a /games/teams record existed for this team-game.

  - name: fct_team_record
    description: >
      One row per (season, team), derived from the game spine rather than /records. /records
      is used as a reconciliation test instead — two independent derivations that must agree
      is a stronger artifact than trusting one.
    columns:
      - name: team_season_sk
        description: Surrogate key over (season, team_id).
        data_tests: [unique, not_null]
      - name: season
        description: Season.
        data_tests: [not_null]
      - name: team_sk
        description: FK to dim_team.
      - name: team_id
        description: CFBD team id.
        data_tests: [not_null]
      - name: school
        description: School name from dim_team; null for teams absent from the season's team list.
      - name: conference
        description: Conference for the season.
      - name: conference_sk
        description: FK to dim_conference.
      - name: classification
        description: Classification for the season.
      - name: is_listed_team
        description: Whether this team appears in CFBD's team list for the season. False for lower-division opponents that appear only on schedules.
        data_tests: [not_null]
      - name: games_played
        description: Completed games with scores.
        data_tests: [not_null]
      - name: wins
        description: Wins.
        data_tests: [not_null]
      - name: losses
        description: Losses.
      - name: ties
        description: Ties.
      - name: conference_wins
        description: Wins in conference games.
      - name: conference_losses
        description: Losses in conference games.
      - name: points_for
        description: Points scored across completed games.
      - name: points_against
        description: Points conceded across completed games.
      - name: point_differential
        description: points_for minus points_against.
      - name: win_pct
        description: Wins divided by games played, 3dp.
      - name: tiebreak_rank
        description: >
          cfdb's own ordering within (season, conference). CFBD has no standings endpoint, so
          this is our logic and the page must label it as such.
      - name: tiebreak_basis
        description: Names the rule applied, so the UI can attribute the ordering rather than implying an official standing.

  - name: fct_betting_line
    description: >
      One row per (game, provider, snapshot). APPEND-ONLY — a full refresh would recompute
      from today's /lines and collapse every historical snapshot to the current value,
      destroying the only dataset in the project that cannot be rebuilt.
    columns:
      - name: betting_line_sk
        description: Surrogate key over (game_id, provider_key, snapshot_ts).
        data_tests: [unique, not_null]
      - name: game_sk
        description: FK to fct_game.
      - name: game_id
        description: CFBD game id.
        data_tests: [not_null]
      - name: provider_sk
        description: FK to dim_provider.
      - name: provider_key
        description: Canonical sportsbook key.
        data_tests: [not_null]
      - name: provider_raw
        description: Sportsbook name exactly as landed, preserved so the original spelling is never lost.
      - name: snapshot_ts
        description: When the line was observed. The axis the whole table exists for.
        data_tests: [not_null]
      - name: season
        description: Season.
      - name: week
        description: Week.
      - name: season_type
        description: regular or postseason.
      - name: spread
        description: >
          Closing point spread. NEGATIVE MEANS THE HOME TEAM WAS FAVOURED — documented by
          the CFB Model Training Pack's Data Info Sheet and verified against its 5,133
          training rows, where home teams win 74.4% of spread<0 games against 31.4% of
          spread>0 games. This resolves a question open since 2026-08-17. The word
          "closing" applies to completed games in the pack's training data; CFBD's weekly
          drops are forward-looking, so the sign convention carries but "closing" does not.
          Still disagrees with formatted_spread historically; deliberately not reconciled.
      - name: formatted_spread
        description: Display spread as CFBD formats it. Kept alongside spread; the consumer chooses.
      - name: spread_open
        description: Opening spread.
      - name: over_under
        description: Current total.
      - name: over_under_open
        description: Opening total.
      - name: home_moneyline
        description: Home moneyline.
      - name: away_moneyline
        description: Away moneyline.

  - name: fct_api_usage
    description: >
      Consumption against every metered external resource cfdb depends on, at one row per
      (resource, observed_at). Two resources in one fact because the question asked of them
      is identical and asked at the same moment: are we about to lose a dependency? The
      failure modes are not symmetrical — CFBD publishes a limit and reports position
      exactly; Databricks Free Edition publishes neither and answers an overrun by shutting
      compute down for the day, or the month. Neither is user-visible: the site reads
      serving Postgres, so exhausting either costs freshness, never availability.
    columns:
      - name: api_usage_sk
        description: Surrogate key over (resource, observed_at).
        data_tests: [unique, not_null]
      - name: resource
        description: Which metered dependency this row measures.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['cfbd_api', 'databricks_warehouse']
      - name: observed_at
        description: When the measurement was taken.
        data_tests: [not_null]
      - name: unit
        description: >
          `calls` for CFBD, `seconds` for Databricks. The two are not comparable and the
          column exists so nothing tries.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['calls', 'seconds']
      - name: used_value
        description: >
          Consumed to date within the current quota window. For Databricks this is a
          running total of measured elapsed seconds, since nothing reports it for us.
        data_tests: [not_null]
      - name: limit_value
        description: >
          The published ceiling, or NULL where none is published. The null is meaningful:
          it means unknowable, not unlimited and not zero.
      - name: pct_used
        description: >
          Percentage of the limit consumed, NULL when the limit is unknown. A percentage of
          an unpublished threshold would be an invented number, and avoiding invented
          numbers about quota is the reason this table exists.
      - name: resets_at
        description: When the quota window rolls over. NULL for Databricks.

  - name: dim_athlete
    description: >
      One row per season x player x TEAM. Season-scoped like dim_team, because a player's
      team, class, height and weight all move between seasons.
      Team is in the grain because a player can appear on two rosters in one season — ten
      cases across 2024-2025, each a real mid-season transfer listed by both schools.
      Keying on (season, player_id) would look correct on any sample that missed them and
      would silently drop one row per transfer.
    columns:
      - name: athlete_sk
        description: Surrogate key over (season, player_id, team) — the grain.
        tests: [unique, not_null]
      - name: season
        description: Season the roster row belongs to. From the request, never from the row.
        tests: [not_null]
      - name: player_id
        description: >
          CFBD athlete id, stable across seasons and teams. NOT unique in this table — see
          the grain.
        tests: [not_null]
      - name: full_name
        description: First and last name joined, trimmed so a missing half leaves no gap.
      - name: first_name
        description: Given name as the roster feed publishes it.
      - name: last_name
        description: Family name as the roster feed publishes it.
      - name: athlete_slug
        description: >
          URL-safe identifier, name AND player id. The id is not decoration: 1,343
          (season, first name, last name) combinations map to more than one athlete — there
          are nine distinct Jayden Williamses — so a name-only slug would route all of them
          to one page and no small-sample test would catch it.
          NOT unique within a season by itself: the ten dual-roster players carry one slug
          across two rows, which is the transfer, not a collision.
      - name: team
        description: Team name exactly as the roster feed gave it — the only team identifier
          the source provides.
      - name: team_id
        description: >
          CFBD team id, resolved from `team` against dim_team within season. NULLABLE, and
          null is not a join failure: 321 rows are NAIA and Division II programmes that
          appear on a roster feed and are legitimately absent from CFBD's /teams response.
          Match rate 99.32% / 99.45% / 100.00% for 2024 / 2025 / 2026.
      - name: is_listed_team
        description: >
          Whether dim_team had a row for this team and season. FALSE marks the 321 non-FBS
          programmes above, so a consumer can distinguish them from a broken join.
      - name: team_slug
        description: URL-safe team identifier, falling back to a slug of the roster's own
          team name where dim_team has no row.
      - name: team_display
        description: Team display name, falling back to the roster's own name.
      - name: conference
        description: Team's conference that season; null where the team is not in dim_team.
      - name: classification
        description: Team's division that season; null where the team is not in dim_team.
      - name: logo_source_url
        description: CFBD logo URL for the team; null for unlisted teams.
      - name: color_on_light
        description: Contrast-corrected team colour for a light background.
      - name: color_on_dark
        description: Contrast-corrected team colour for a dark background.
      - name: position
        description: Listed position; null on 2,450 rows where the feed omits it.
      - name: jersey
        description: Jersey number; null on 3,177 rows where the feed omits it.
      - name: class_year
        description: >
          Academic class as 1-4, or NULL where unknown. Anything outside 1-4 is treated as
          unknown rather than mapped — see `class_year_raw`.
      - name: class_year_raw
        description: >
          The value exactly as it arrived, kept so the upstream anomaly stays countable.
          CFBD sometimes sends the SEASON in this field instead of the class: 1,336 rows of
          "2024" in 2024, 1,115 of "2025" in 2025, plus 46 zeros. 2026 is clean, so this is
          an inconsistency rather than a rule, and laundering it into a plausible-looking
          freshman would hide it.
      - name: class_year_display
        description: 'FR, SO, JR or SR. Null wherever `class_year` is unknown.'
      - name: height_inches
        description: Listed height in inches; null on 2,808 rows.
      - name: height_display
        description: >
          Feet and inches, e.g. "6-2". Assembled here rather than in the app: a height is one
          fact with a conventional rendering, the same argument as record_display.
      - name: weight_pounds
        description: Listed weight in pounds; null on 3,013 rows.
      - name: home_city
        description: Home town city.
      - name: home_state
        description: Home town state or province.
      - name: home_country
        description: Home country.
      - name: hometown_display
        description: >
          "City, State" where both are present, otherwise whichever exists, otherwise null —
          never a lone comma, so the page renders an em dash rather than stray punctuation.
      - name: home_latitude
        description: Home town latitude, where the feed supplies coordinates.
      - name: home_longitude
        description: Home town longitude, where the feed supplies coordinates.
      - name: home_fips_code
        description: >
          County FIPS code for the home town. Spelled `homeCountyFIPS` on this endpoint
          against `fipsCode` on /recruiting/players and `countyFips` on /draft/picks; the
          column name is aligned so callers need not know that.
      - name: recruit_ids
        description: >
          JSON array bridging a rostered player back to stg_recruit. The link that endpoint's
          own `athleteId` provides in the other direction, and which is null there for
          anyone unlinked — neither alone is enough.

  - name: fct_player_season_stat
    description: >
      One row per season x player x category x stat type — player season totals, long.
      1,453,075 rows over 23 seasons (2004-2026), 65,181 players, 30 stat types across 10
      categories. The deepest player history in the warehouse and the primary fact behind
      the Players page.
      Long rather than wide for the reason srv_team_stats is long: CFBD's stat types are
      open-ended, and a wide table needs a code change to show a new stat while silently
      omitting it until someone notices.
      IDENTITY IS CARRIED HERE, NOT BORROWED. dim_athlete covers 2024-2026 only, because it
      is built from /roster; this fact runs back to 2004. The dimension is joined to enrich
      and never to filter — an inner join would delete two decades of player history to
      satisfy a foreign key.
      Ranks are deliberately absent; they belong in srv_player_stats, computed over whatever
      population the page is showing.
    columns:
      - name: player_season_stat_sk
        description: Surrogate key over (season, player_id, stat_category, stat_type) — the grain.
        tests: [unique, not_null]
      - name: season
        description: Season the totals cover. 2004-2026.
        tests: [not_null]
      - name: player_id
        description: >
          CFBD athlete id, kept as a string because CFBD never promised it is a number.
          Shared with fct_player_game_stat and dim_athlete — verified, 93.7% of game-level
          athletes resolve to a roster row.
        tests: [not_null]
      - name: player_name
        description: Player name as the stats feed publishes it.
      - name: player_slug
        description: >
          URL-safe identifier, name AND player id. Derived here rather than read off
          dim_athlete so a 2007 season page links exactly as well as a 2025 one; matches
          dim_athlete.athlete_slug by construction wherever both exist.
      - name: position
        description: Listed position for that season, from the stats feed.
      - name: team
        description: Team name as the stats feed gave it.
      - name: team_id
        description: >
          CFBD team id from dim_athlete where the dimension has the athlete; null for every
          season before 2024. Not a join failure — see the model header.
      - name: conference
        description: Conference affiliation as the stats feed recorded it that season.
      - name: stat_category
        description: >
          CFBD's grouping — defensive, receiving, rushing, passing, kickReturns, fumbles,
          interceptions, puntReturns, kicking, punting.
      - name: stat_type
        description: >
          The statistic within the category. 30 distinct types, category-specific and
          open-ended; the page's stat picker is a WHERE on this column, so the selectable
          set is data rather than code.
      - name: stat_value
        description: >
          Numeric value. All 1,453,075 values parse as numbers — measured, not assumed.
          Units differ per stat_type and are not normalised.
      - name: stat_raw
        description: >
          The value exactly as CFBD sent it. Kept even though everything currently parses,
          so a type that starts arriving in another shape stays visible rather than becoming
          a silent null.
      - name: athlete_sk
        description: >
          Link to dim_athlete, joined on (season, player_id, team) — three columns, because
          the dimension's grain includes team and two would fan out the ten dual-roster
          players. Null wherever the roster feed does not reach.
      - name: has_athlete_dimension
        description: >
          Whether dim_athlete had a row. FALSE for every season before 2024 and most of 2026 —
          an absent roster feed, not a broken join.
      - name: class_year_display
        description: 'FR, SO, JR or SR from dim_athlete; null where the dimension does not reach.'
      - name: height_display
        description: Height as feet-inches from dim_athlete; null outside 2024-2026.
      - name: weight_pounds
        description: Listed weight from dim_athlete; null outside 2024-2026.
      - name: jersey
        description: Jersey number from dim_athlete; null outside 2024-2026.

  - name: fct_player_game_stat
    description: >
      One row per game x team x category x stat type x athlete — the player box score, long.
      1,266,259 rows over 3,410 games and 24,600 athletes. Box scores are `recent` scope, so
      this starts at 2024 and is twenty seasons shallower than fct_player_season_stat. That
      is the honest shape of the Players page: deep season history, recent game detail.
      THIS MART RESOLVES WHAT THE SOURCE OMITS. /games/players ships a game id and a team
      NAME and nothing else — no season, no team id. Season, week, dates and the opponent
      come from fct_game (100.00% matched) and team_id from dim_team (99.74%).
    columns:
      - name: player_game_stat_sk
        description: >
          Surrogate key over (game_id, team, stat_category, stat_type, athlete_id) — the grain.
        tests: [unique, not_null]
      - name: game_id
        description: CFBD game id.
        tests: [not_null]
      - name: season
        description: Season, resolved from fct_game — the source carries none.
      - name: week
        description: Week, resolved from fct_game.
      - name: season_type
        description: '`regular` or `postseason`, resolved from fct_game.'
      - name: game_date
        description: Calendar date of the game.
      - name: start_date
        description: Scheduled kickoff, timezone-aware.
      - name: is_completed
        description: Whether the game has finished.
      - name: is_neutral_site
        description: Whether the game was at a neutral venue.
      - name: player_id
        description: CFBD athlete id, shared with fct_player_season_stat and dim_athlete.
        tests: [not_null]
      - name: player_name
        description: Athlete name as the box score publishes it.
      - name: player_slug
        description: >
          URL-safe identifier, name AND player id — the same construction as
          dim_athlete.athlete_slug and fct_player_season_stat.player_slug, so all three
          agree without any of them reading the others.
      - name: athlete_sk
        description: >
          Link to dim_athlete on (season, player_id, team). Three columns, because two would
          fan out the dual-roster players.
      - name: has_athlete_dimension
        description: Whether dim_athlete had a row for this athlete, season and team.
      - name: team
        description: Team name as the box score gave it — the only team identifier the
          source provides.
      - name: team_id
        description: >
          Resolved from dim_team on (season, school). Null on 3,318 rows, all non-FBS
          programmes absent from /teams.
      - name: conference
        description: Conference as the box score recorded it.
      - name: home_away
        description: >
          Whether this team was home or away. Carried on the box-score row itself, which is
          why the opponent is derived without comparing team names.
      - name: team_points
        description: Points this team scored in the game, repeated on every stat row for it.
      - name: opponent
        description: >
          The other side, derived from `home_away` against fct_game rather than by matching
          names — so an upstream rename cannot break it.
      - name: opponent_team_id
        description: CFBD team id of the opponent, from the game spine.
      - name: stat_category
        description: CFBD's grouping for the statistic, e.g. passing, rushing, kicking.
      - name: stat_type
        description: >
          The statistic within the category — C/ATT, YDS, TD, INT, QBR, LONG, CAR, AVG and
          more. Open-ended and category-specific.
      - name: stat_raw
        description: >
          The value exactly as CFBD sent it, and the only column populated on every row.
          Three shapes exist; see stat_value, stat_made and stat_attempted.
      - name: stat_value
        description: >
          The plain-number shape — 1,240,096 of 1,266,259 rows. NULL for a made/attempted
          pair, which has no single value, and null for the literal "--".
      - name: stat_made
        description: >
          First half of a made/attempted pair — 25,519 rows across exactly three types:
          passing C/ATT, kicking FG and kicking XP. "Made" covers all three correctly, since
          a completion is a pass made. Splitting the pair rather than leaving it a string is
          the difference between a page that can show completion percentage and one that can
          only print "12/31".
      - name: stat_attempted
        description: Second half of a made/attempted pair; null on every row that is not one.

  - name: fct_play
    description: >
      One row per play — 583,641 plays across 2024-2026, the finest grain in the warehouse
      and the spine the Players page's drill-down sits on. Play-by-play is `recent` scope by
      decision.
      THE SOURCE HAS NO SEASON AND NO WEEK: /plays is fetched per season and week but the
      rows carry only a game id, so both are resolved here from fct_game — the same job
      fct_player_game_stat does for the box score. Team ids are resolved from dim_team the
      same way, so a play can be attributed without a name comparison.
    columns:
      - name: play_sk
        description: Surrogate key over play_id — the grain, one row per play.
        tests: [unique, not_null]
      - name: play_id
        description: CFBD play id, a string. Joins to fct_play_stat.
        tests: [unique, not_null]
      - name: game_id
        description: CFBD game id the play belongs to.
      - name: drive_id
        description: CFBD drive id, joining to the drive model.
      - name: drive_number
        description: Which drive of the game this play belongs to.
      - name: play_number
        description: Position of the play within its drive.
      - name: season
        description: Resolved from fct_game — the source row carries none.
      - name: week
        description: Resolved from fct_game.
      - name: season_type
        description: '`regular` or `postseason`, from fct_game.'
      - name: game_date
        description: Calendar date of the game.
      - name: start_date
        description: Scheduled kickoff of the game, timezone-aware.
      - name: is_neutral_site
        description: Whether the game was at a neutral venue.
      - name: venue
        description: Venue name.
      - name: offense
        description: Team on offence for this play, by name.
      - name: offense_team_id
        description: Resolved from dim_team within season; null for non-FBS programmes.
      - name: offense_conference
        description: Conference of the team on offence.
      - name: offense_score
        description: Offence's score at the time of the play.
      - name: defense
        description: Team on defence for this play, by name.
      - name: defense_team_id
        description: Resolved from dim_team within season; null for non-FBS programmes.
      - name: defense_conference
        description: Conference of the team on defence.
      - name: defense_score
        description: Defence's score at the time of the play.
      - name: home_team
        description: Home team of the game, regardless of who has the ball.
      - name: away_team
        description: Away team of the game.
      - name: period
        description: Quarter, or the overtime period.
      - name: clock_minutes
        description: Minutes remaining on the game clock.
      - name: clock_seconds_part
        description: >
          The seconds COMPONENT of the clock, not a total. Named `_part` so it cannot be
          mistaken for elapsed or remaining seconds.
      - name: clock_seconds
        description: The clock expressed as total seconds, for arithmetic and sorting.
      - name: offense_timeouts
        description: Timeouts the offence had remaining.
      - name: defense_timeouts
        description: Timeouts the defence had remaining.
      - name: yardline
        description: Field position as CFBD reports it, on the 0-100 field.
      - name: yards_to_goal
        description: Distance to the opponent's goal line — the unambiguous field position.
      - name: down
        description: Down, 1-4. Null or 0 on kickoffs and some special-teams plays.
      - name: distance
        description: Yards needed for a first down.
      - name: yards_gained
        description: Yards gained on the play; negative on a loss.
      - name: is_scoring_play
        description: Whether the play resulted in points.
      - name: play_type
        description: CFBD's classification of the play.
      - name: play_text
        description: >
          The narrative description. fct_play_stat is the structured version of the same
          event — which athlete recorded which stat.
      - name: ppa
        description: Predicted points added for the play, where CFBD computes it.
      - name: wallclock_at
        description: Real-world timestamp of the play, where reported.
      - name: down_distance_display
        description: >
          "3rd and 7", or "1st and Goal" where the distance reaches the end zone. Assembled
          here rather than in the app — a down and distance is one fact with a conventional
          rendering. Null where down is null or 0, because "0th and 10" is not a thing.
      - name: distance_bucket
        description: >
          `short` (<=3), `medium` (4-7), `long` (8+) or `goal to go`. What a filter actually
          needs: "3rd and long" is the question a reader asks and "3rd and 7" is not.
          Boundaries are the conventional ones, named here so no page can pick different ones.
      - name: field_zone
        description: '`red zone` (<=20 to goal), `opponent territory` (<=50), or `own territory`.'

  - name: fct_play_stat
    description: >
      One row per play x athlete x stat type — the bridge from a play to the players in it,
      and what makes the Players page's play-level drill-down possible.
      SEVERAL ROWS PER PLAY IS NORMAL: a completed pass produces a passer, a receiver and a
      reception, each its own row, and one athlete can record two different stats on one play.
      THIS FACT IS TRUNCATED UPSTREAM AND THAT IS THE MOST IMPORTANT THING ABOUT IT. CFBD's
      spec states /plays/stats is "limited to 2,000 records" per request and cfdb fetches it
      per season-week, so every week returns exactly 2,000 rows and stops. It covers 375 of
      the 3,410 games that have box scores — about 11% — and the survivors skew heavily to
      one conference (118 of 177 covered 2024 games are SEC), which is the API's ordering
      showing through rather than a fact about football.
      ANY AGGREGATE OVER THIS FACT IS AN AGGREGATE OVER AN ARBITRARY 11% SAMPLE until a
      per-game backfill runs. Absence must be treated as unknown, never as zero.
      Play context is carried on the row so the drill-down can filter without joining, since
      the site reads one relation per query (G-2).
    columns:
      - name: play_stat_sk
        description: Surrogate key over (play_id, athlete_id, stat_type) — the grain.
        tests: [unique, not_null]
      - name: play_id
        description: CFBD play id, joining to fct_play.
        tests: [not_null]
      - name: drive_id
        description: CFBD drive id.
      - name: game_id
        description: CFBD game id.
      - name: season
        description: Season, carried on the stat row by this endpoint.
      - name: week
        description: Week, carried on the stat row by this endpoint.
      - name: season_type
        description: '`regular` or `postseason`, from fct_play.'
      - name: game_date
        description: Calendar date of the game, from fct_play.
      - name: player_id
        description: CFBD athlete id, shared with the other player facts and dim_athlete.
      - name: player_name
        description: Athlete name as this endpoint publishes it.
      - name: player_slug
        description: >
          URL-safe identifier, name AND player id — the same construction as everywhere else,
          so the page can link without a lookup.
      - name: athlete_sk
        description: Link to dim_athlete on (season, player_id, team); three columns, because
          the dimension's grain includes team.
      - name: has_athlete_dimension
        description: Whether dim_athlete had a row for this athlete, season and team.
      - name: team
        description: Team the athlete was playing for.
      - name: team_id
        description: Resolved from dim_team within season; null for non-FBS programmes.
      - name: conference
        description: Conference of that team.
      - name: opponent
        description: The other team in the game.
      - name: team_score
        description: This team's score at the time of the play.
      - name: opponent_score
        description: The opponent's score at the time of the play.
      - name: stat_type
        description: >
          What the athlete recorded — Reception, Completion, Sack and so on. One measure per
          row, which is why the value needs no parsing.
      - name: stat
        description: >
          The value, already a number on this endpoint — unlike the box-score models, where
          every value is a string with a compound shape to parse.
      - name: period
        description: Quarter, repeated on the stat line by this endpoint.
      - name: clock_minutes
        description: Minutes remaining on the game clock.
      - name: clock_seconds_part
        description: The seconds COMPONENT of the clock, not a total.
      - name: down
        description: >
          Down, taken from the stat row — /plays/stats repeats the play's situation on every
          line it emits. assert_play_stat_situation_agrees_with_the_play checks this against
          fct_play's own copy.
      - name: distance
        description: Yards needed for a first down, from the stat row.
      - name: yards_to_goal
        description: Distance to the opponent's goal line, from the stat row.
      - name: down_distance_display
        description: >
          "3rd and 7", computed in fct_play. Note the derived columns come from fct_play's
          copy of the situation while `down` and `distance` above come from the stat row —
          the agreement test exists because that is two sources for one fact.
      - name: distance_bucket
        description: '`short`, `medium`, `long` or `goal to go`, computed in fct_play.'
      - name: field_zone
        description: '`red zone`, `opponent territory` or `own territory`, computed in fct_play.'
      - name: play_type
        description: CFBD's classification of the play, from fct_play.
      - name: play_text
        description: The narrative description of the play, from fct_play.
      - name: yards_gained
        description: Yards gained on the play, from fct_play.
      - name: is_scoring_play
        description: Whether the play resulted in points, from fct_play.
      - name: ppa
        description: Predicted points added for the play, from fct_play.
      - name: offense_team_id
        description: Team on offence for the play, from fct_play.
      - name: defense_team_id
        description: Team on defence for the play, from fct_play.
