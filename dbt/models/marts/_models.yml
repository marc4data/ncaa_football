version: 2

models:
  - name: mart_team_season_record
    description: >
      One row per team per season: record, scoring, and point differential from
      completed games. Feeds team pages on the site.
    columns:
      - name: team_season_key
        description: season + team_id; the grain of this mart, stated explicitly.
        data_tests:
          - unique
          - not_null
      - name: team_id
        data_tests:
          - not_null
      # No `relationships` test to stg_teams: schedules include lower-division opponents
      # that CFBD's season team list doesn't cover, so referential integrity genuinely
      # does not hold here. `is_listed_team` records the fact instead, and
      # assert_listed_teams_have_attributes checks the join where it should hold.
      - name: is_listed_team
        description: >
          True when this team-season matched CFBD's team list for that season. False for
          lower-division opponents that appear on schedules but aren't listed — their rows
          are kept so league-wide win/loss totals still reconcile.
        data_tests:
          - not_null
      - name: season
        data_tests:
          - not_null
      - name: games_played
        data_tests:
          - not_null
      - name: wins
        data_tests:
          - not_null

  - name: mart_data_freshness
    description: >
      One row per endpoint: how old its newest successful response is, and whether that
      response carried any rows. Source for the "data as of X" stamp every page shows.
    columns:
      - name: endpoint
        data_tests:
          - unique
          - not_null
      - name: total_responses
        data_tests:
          - not_null
      - name: lost_its_data
        description: >
          True when this endpoint used to return rows and its latest successful response
          returned none — the silent failure that reports green.
        data_tests:
          - not_null

  - name: mart_team_schedule
    description: >
      One row per team per game — the schedule from a single team's point of view, for every
      season landed including seasons not yet played. A 2026 row has a kickoff and an
      opponent but no result, which is what a schedule is before it starts.
    columns:
      - name: team_game_key
        description: season + game + team; the grain, stated explicitly.
        data_tests:
          - unique
          - not_null
      - name: season
        data_tests:
          - not_null
      - name: team_id
        data_tests:
          - not_null
      - name: opponent_id
        data_tests:
          - not_null
      - name: venue_role
        data_tests:
          - accepted_values:
              values: ['home', 'away', 'neutral']
      - name: result
        description: W/L/T, null until the game is played.
        data_tests:
          - accepted_values:
              values: ['W', 'L', 'T']
              config:
                where: "result is not null"

  # ==========================================================================================
  # APPENDED BY PROMPT B046 (session B). Everything above belongs to other prompts — this block
  # is at the end so a concurrent edit higher in the file cannot conflict with it.
  # ==========================================================================================
  - name: fct_drive
    description: >
      One row per drive — the layer between a game and its plays, and the spine the Matchup
      post-game Drives chart is drawn on. Scope is 2024 onward, measured from the raw manifest:
      /drives is `recent` scope, the same as /plays.

      Season, week and team ids are resolved here, exactly as fct_play resolves them, because
      the /drives payload carries a game id and nothing else.

      The column the chart is drawn on is `start_yards_from_own_goal` / `end_yards_from_own_goal`
      (100 - yards_to_goal). `yardline` is an absolute coordinate in the HOME team's frame and
      must never be used for geometry — drawn on it, the away band mirrors the home band.
    columns:
      - name: drive_sk
        description: Surrogate key over drive_id — the grain.
        data_tests: [unique, not_null]
      - name: drive_id
        description: CFBD drive id. Text, never numeric — an 18-digit id CFBD never promised is a number.
        data_tests: [unique, not_null]
      - name: game_id
        description: The game this drive belongs to.
        data_tests:
          - not_null
          # TAGGED `full_refresh_only` for the same reason as
          # assert_no_drives_exist_before_the_scope_boundary: fct_game is refreshed by
          # cfbd_scores_refresh and fct_drive is not, so this compares a fresh parent against a
          # stale child every two hours, and a failure here would gate publish_to_serving.
          - relationships:
              to: ref('fct_game')
              field: game_id
              config:
                tags: ['full_refresh_only']
      - name: drive_number
        description: >
          Possession order within the game, 1..n. The chart's y-axis. Dense and gapless in all
          but four games of 3,343 — see assert_a_drive_number_sequence_is_dense.
        data_tests: [not_null]
      - name: season
        description: Resolved from fct_game; /drives carries no season.
        data_tests: [not_null]
      - name: week
        description: Resolved from fct_game; /drives carries no week.
        data_tests: [not_null]
      - name: is_home_offense
        description: >
          Whether the offense on this drive is the home team. The only link to home and away on
          the payload, and what puts a drive in the away band or the home band.
        data_tests: [not_null]
      - name: start_yards_from_own_goal
        description: >
          Field position at the snap, 0 = the offense's own goal line, 100 = the opponent's.
          THE coordinate: offense-relative, so both bands share one x scale driving right.
          Verified on the built model: `= 100 - start_yards_to_goal` with ZERO exceptions over
          all 78,536 rows, and the same for the end pair.
      - name: start_yardline
        description: >
          CFBD's absolute yardline, in the HOME team's frame. ⚠️ EVIDENCE, NOT A RENDERING
          COORDINATE — use start_yards_from_own_goal. It disagrees with the offense-relative
          frame on 39,143 of 78,536 drives, so a bar keyed off this mirrors the away band and
          reads as a rendering fault. The 578 rows where they agree are all at yardline 50,
          where the two formulas coincide.
      - name: end_yards_from_own_goal
        description: >
          Field position at the end of the drive, same frame. May be less than the start — a
          drive can lose yards — and is never clamped. May also fall outside 0..100 on 118
          drives where CFBD's coordinate is broken; `is_end_on_field` is the flag for that.
      - name: is_end_on_field
        description: >
          False where end_yards_from_own_goal falls outside 0..100 (118 of 78,536, range -78..193
          on the built model). The page
          renders the row and suppresses the bar; a missing possession is a worse lie than a
          bar that admits it does not know where it ended.
      - name: is_negative_drive
        description: >
          Whether the drive ended behind where it started, by the COORDINATE delta — 8,786 of
          78,536 on the built model. Deliberately not `yards < 0`, which is 7,946: the 840-row
          gap between the two is the `yards`-versus-coordinates split again, in miniature.
      - name: start_clock_display
        description: >
          The game clock at the snap, as a reader says it — "Q2 07:14". One of the two forms of
          "start time".

          ⚠️ THIS FORM IS NOT NULL IN OVERTIME — measured, it carries the literal `OT` / `2OT`
          on all 326 overtime drives. Only elapsed_from_kickoff_seconds goes null there, so a
          null-check written against this column never fires.
      - name: elapsed_from_kickoff_seconds
        description: >
          Seconds from kickoff to the snap. The other form of "start time". Null outside
          regulation rather than extrapolated — an overtime possession is not 900 seconds of
          anything, and inventing a duration is worse than admitting there is none. Measured on
          the built model: null on all 326 overtime drives plus the 24 CFBD reports as period 0,
          350 in total. Order those rows by drive_number.
      - name: elapsed_display
        description: Drive duration as mm:ss, pre-formatted — a page formatting a duration is the app computing.
      - name: drive_result
        description: >
          CFBD free text; 25 distinct values, confirmed on the built model. Raw — branch on
          drive_result_key, which is unmapped on 0 rows.
      - name: drive_result_key
        description: >
          Normalised result. Null means UNMAPPED, which fails
          assert_every_drive_result_maps_to_a_known_key rather than rendering a blank icon.
        data_tests:
          - not_null:
              config:
                where: "drive_result is not null"
      - name: drive_result_category
        description: >
          Icon family — coarser than the key on purpose, so pass 2 picks one glyph per family
          and overrides only where it wants to.
        data_tests:
          - accepted_values:
              values: ['offensive score', 'defensive score', 'turnover', 'punt', 'kick',
                       'clock', 'unknown']
      - name: scoring_side
        description: >
          Who scored, or null if nobody did. ⚠️ A `TD` SUFFIX ON A TURNOVER MEANS THE DEFENSE
          SCORED. Measured on the built model: 908 drives across ten values — INT TD (430),
          FUMBLE RETURN TD (195), PUNT TD (107), PUNT RETURN TD (86), FUMBLE TD (61),
          MISSED FG TD (14), DOWNS TD (7), END OF HALF TD (5), FG TD (2), END OF GAME TD (1).
          A chart keying an offensive-touchdown icon off the substring "TD" puts every one of
          them on the wrong side of the game.
        data_tests:
          - accepted_values:
              values: ['offense', 'defense']
              config:
                where: "scoring_side is not null"
      - name: yards
        description: >
          Net yards gained by the offense, as CFBD reports it. ⚠️ NOT the bar's length: it
          disagrees with the end-minus-start coordinate delta on 11,950 of 78,418 drives
          (15.2%) on the built model — 34% of touchdowns and 21% of interceptions — because the
          end coordinate is where a RETURN finished and `yards` is what the offense gained.
          Both are right; they measure different things, so a bar drawn from `yards` will not
          land on the end coordinate the same row carries.

  - name: fct_game_line_movement
    description: >
      How far the line travelled, at game grain — one row per game, one book. The derived
      summary the grain rule calls for: srv_line_movement is snapshot grain, a panel wants a
      row per game, and Streamlit cannot aggregate.
    columns:
      - name: game_line_movement_sk
        data_tests: [not_null, unique]
      - name: game_id
        description: One row per game. Unique by construction.
        data_tests: [not_null, unique]
      - name: provider_key
        description: >
          The one book every measure on this row is taken from, set by the
          `line_movement_provider` variable. Two books carry current snapshots and mixing them
          measures a move against a different book's price.
        data_tests: [not_null]
      - name: snapshot_count
        description: >
          How many snapshots this game's line was observed at. Read it before drawing anything:
          1,577 of 1,854 rows carry a single snapshot, because 2024 and 2025 were backfilled one
          row per game, and on those an excursion equals the net move by construction rather
          than by measurement.
        data_tests: [not_null]
      - name: spread_move_from_open
        description: Current spread minus the opening spread. Where the line ended up.
      - name: spread_largest_excursion
        description: >
          The widest the spread ever departed from its open, signed, keeping the direction of
          that departure. Where the line went on the way, which the net move cannot show — a
          line that goes out three points and comes back reads as no move and a three-point
          excursion. Not max(abs()), which would lose the direction.
      - name: total_move_from_open
        description: Current total minus the opening total.
      - name: total_largest_excursion
        description: The same widest-departure measure for the total.
      - name: market_implied_win_probability_move_from_open
        description: >
          The home side's de-vigged win probability now minus at the open, in PROBABILITY
          POINTS. Moneylines are not comparable as numbers — minus 110 to minus 130 and plus
          200 to plus 180 are 4.1 and 2.4 points — so the movement is expressed in the units
          the distribution was measured in. The de-vig is fct_market_probability's, and only
          snapshots it marks usable are counted, so a sentinel moneyline cannot register as an
          enormous excursion.
      - name: market_implied_win_probability_largest_excursion
        description: The widest that probability ever departed from its opening value, signed.
      - name: open_predates_snapshot_gap
        description: >
          True when this game's snapshot window SPANS the three days with no snapshots at all,
          so its movement is measured across that hole and its excursion is a floor rather than
          a measurement. It asks whether the window spans the gap, not merely whether the line
          opened before it: the second reading is true of every 2024 and 2025 game, all of which
          finished a year before the outage, and would flag 1,728 rows where 98 is correct.
        data_tests: [not_null]
