  # ---------------------------------------------------------------------------------------
  - name: srv_game_travel
    description: >
      Matchup page, Travel and rest. One row per game x team, so a matchup query returns two.
      This section was listed as blocked on "the venue join key" for months. The key was on
      /games/weather all along — venueId on every row, matching dim_venue 6,847 of 6,847.
      TWO MEASURES WITH DIFFERENT COVERAGE, and a consumer must not average over the
      difference: `rest_days` comes from the schedule and exists for every game that is not a
      season opener; `travel_km` needs coordinates for both the game venue and the team's own
      home venue, so it is 2024 onward and about 79% even there.
      NULL means unknown. ZERO means they played at home. Those are different answers.
    columns:
      - name: game_travel_sk
        description: Surrogate key over (game_id, team_id) — the grain.
      - name: game_id
        description: CFBD game id. Appears on exactly two rows, one per team.
      - name: team_id
        description: CFBD team id for the side this row describes.
      - name: team
        description: Name of the side this row describes.
      - name: opponent_team_id
        description: CFBD team id of the opponent.
      - name: opponent
        description: Opponent name.
      - name: season
        description: Season the game belongs to.
      - name: week
        description: Week within the season and season_type.
      - name: season_type
        description: '`regular` or `postseason`.'
      - name: game_date
        description: Calendar date of the game.
      - name: is_home
        description: Whether this team was the designated home side.
      - name: is_neutral_site
        description: >
          Whether the game was at a neutral venue. Neutral sites count as travel for BOTH
          teams — a bowl game is a trip for everyone, and the home/away label on one is a
          scheduling artefact rather than a fact about geography.
      - name: game_venue
        description: Venue the game was played at, from the weather payload.
      - name: travel_km
        description: >
          Great-circle distance from this team's own home venue to where the game was played,
          in kilometres to one decimal place. Haversine on a spherical Earth, which is
          accurate to a few tenths of a percent — far below anything a travel story turns on.
          NULL where either venue is unknown, never 0. ZERO means they played at home.
          The home venue is DERIVED, not declared: CFBD publishes no "this team's stadium"
          field, so it is the venue the team played most of its non-neutral home games at
          that season. For small programmes with only one or two weather-covered home games
          that mode can land on the wrong venue — 19 rows of 221,758, all non-FBS, tracked by
          assert_a_home_game_is_played_at_home.
      - name: elevation_change_m
        description: >
          Altitude of the game venue relative to this team's home venue, in metres. SIGNED on
          purpose: arriving 1,500 m higher and 1,500 m lower are different experiences, and a
          magnitude would erase which one happened. Null where either elevation is unknown —
          /venues does not publish it for every venue.
      - name: game_elevation_m
        description: Elevation of the game venue in metres, where published.
      - name: home_elevation_m
        description: Elevation of this team's derived home venue in metres, where published.
      - name: previous_game_date
        description: >
          Date of this team's previous game IN THE SAME SEASON. Null on a season opener.
      - name: rest_days
        description: >
          Whole calendar days since this team's previous game in the same season. Null on a
          season opener, which is the absence of a previous game rather than a long rest.
          Counted within a season deliberately: the gap between a bowl game and the following
          September is not rest in any sense a reader means.
      - name: rest_bucket
        description: >
          `season opener`, `short week` (<=5 days), `normal week` (6-8), `extra rest` (9-14)
          or `long layoff` (15+). A short week is the thing readers actually ask about, and
          the boundaries are named here so no page picks different ones.
      - name: as_of_ts
        description: AC-G.35. Last load of the `game` domain, rendered instead of now().

  # ---------------------------------------------------------------------------------------
  - name: srv_edge_bucket_performance
    description: >
      Edge Finder, track record. One row per model x version x split x market x edge bucket:
      how often the model's pick was right, grouped by how big the edge it claimed was.
      THE QUESTION THE SLIDER RAISES AND CANNOT ANSWER. The page lets a reader filter to
      edges above some size; without this, that filter implies bigger is better. The measured
      answer is that it is not — spread hit rates run 41.6% to 52.1% with no relationship to
      edge size, against a 52.38% break-even.
      FILTER ON market. A spread edge is in points and a moneyline edge is a probability;
      they are stacked long because bucketing them on one scale would produce a table that
      sorts but does not mean anything.
    columns:
      - name: edge_bucket_sk
        description: >
          Surrogate key over (model_name, model_version, split, market, edge_bucket) — the grain.
      - name: model_name
        description: Name of the model whose picks are being scored.
      - name: model_version
        description: Version of that model. Part of the grain — versions are never merged.
      - name: model_family
        description: Broader family the model belongs to.
      - name: split
        description: Data split — a train-split hit rate is not a claim about the future.
      - name: market
        description: '`spread` or `moneyline`. The column every consumer must filter on.'
      - name: edge_unit
        description: >
          `points` for spread rows, `probability` for moneyline. Carried because the two are
          not comparable and must never be ranked against each other.
      - name: edge_bucket
        description: >
          The edge-size band, in the market's own unit — "3-5 pts" or "5-10 pp". Boundaries
          are conventional round numbers rather than quantiles of this dataset: quantile
          buckets would move on every re-score, so a bucket's meaning would change under a
          reader who had learned it.
      - name: bucket_order
        description: Display order for the bands, so a page sorts them without parsing labels.
      - name: bucket_games
        description: >
          Graded games in the band. NO RATE HERE IS READABLE WITHOUT IT — the whole fact is
          1,106 graded cover predictions across six models, so individual cells hold tens of
          games rather than thousands.
      - name: bucket_hits
        description: >
          Games where the MODEL'S OWN PICK was right, not where the home team won. That is
          what makes a hit rate below 50% meaningful rather than a home-field artefact.
      - name: hit_rate_pct
        description: '`bucket_hits` over `bucket_games` as a percentage, to 1 decimal place.'
      - name: edge_over_break_even_pct
        description: >
          Hit rate minus 52.38%, the break-even against a standard -110 spread price.
          NULL FOR MONEYLINE ON PURPOSE: those bets are priced per game, so a 77% hit rate on
          heavy favourites can lose money and subtracting a fixed threshold from it would be
          a confident, meaningless number.
      - name: mean_edge_magnitude
        description: Average absolute edge within the band, in the market's own unit.
      - name: is_thin_sample
        description: >
          Whether the band holds fewer than 30 graded games. Thirty is a CONVENTION, not a
          statistical claim, and it is named in one place so no page can quietly pick a
          friendlier threshold. Thin cells are marked rather than dropped — a 50% rate over
          18 games is not evidence, and hiding it would be a different dishonesty from
          overstating it.
      - name: out_of_sample_games
        description: >
          How many of the band's games fell outside the model's training weeks. A band made
          largely of extrapolated predictions is weaker evidence than its n suggests.
      - name: attribution
        description: >
          Licence-required attribution from dim_model_version, carried as data so a page
          cannot render these rates without it.
      - name: as_of_ts
        description: AC-G.35. Last load of the `prediction` domain, rendered instead of now().

  # ---------------------------------------------------------------------------------------
  - name: srv_game_team
    description: >
      THE game x team serving surface: one row per team per game. R-077.
      NOTHING SAT AT THIS GRAIN BEFORE, which is why 150 measure columns across four staging
      models had no downstream consumer and were invisible from the inside — landed, staged,
      and never once selected.
      THE GRAIN RULE IS WHY THEY ARE HERE AND NOT ON srv_game: "Can't add game.team grain to
      a table that is at game grain." srv_game carries game-grain columns and derived
      both-team summaries; a per-team success rate is neither.
      COVERAGE IS PARTIAL AND THE FLAGS SAY WHERE. The four sources cover 1,849 to 3,339 games
      against 110,879 in the spine, because box scores are `recent` scope. The has_* columns
      distinguish "the endpoint does not cover this game" from "this team recorded nothing",
      which a null alone cannot. The name join behind them matched 100.00% on all four.
      Efficiency and explosiveness are complements throughout: success rate says how OFTEN a
      team stayed on schedule, explosiveness says how BIG the plays that worked were. Reading
      either alone describes half a team.
    columns:
      - name: game_team_advanced_sk
        description: >
          Surrogate key over (game_id, team_id) — THE GRAIN, declared and tested. R-077 asked
          for uniqueness on (game_id, team_id) and this key is exactly that pair, so testing
          it tests the grain rather than a proxy for it.
        tests: [unique, not_null]
      - name: game_team_sk
        description: >
          Surrogate key from fct_game_team — the grain, one row per team per game.
      - name: game_id
        description: >
          CFBD game id. Appears on exactly two rows, one per team.
      - name: season
        description: >
          Season the game belongs to.
      - name: week
        description: >
          Week within the season and season_type.
      - name: season_type
        description: >
          `regular`, `postseason`, or one of the two COVID-era spring types.
      - name: game_date
        description: >
          Calendar date of the game.
      - name: team_id
        description: >
          CFBD team id for the side this row describes.
      - name: team
        description: >
          Name of the side this row describes.
      - name: conference
        description: >
          Conference affiliation for that season, from dim_team — fct_game_team carries
          classification but not conference.
      - name: classification
        description: >
          Division for that season: `fbs`, `fcs` and so on.
      - name: opponent_team_id
        description: >
          CFBD team id of the opponent.
      - name: opponent
        description: >
          Opponent name.
      - name: is_fbs_game
        description: >
          Whether EITHER side of this game is FBS — the same predicate srv_game carries, so
          the Division filter selects the same games from both views. Symmetric across a
          game's two rows: filtering on it keeps both or neither, which team-level
          `classification` cannot do.
      - name: is_home
        description: >
          Whether this team was the designated home side.
      - name: is_neutral_site
        description: >
          Whether the game was played at a neutral venue.
      - name: is_completed
        description: >
          Whether the game has finished. A cancelled game reads 0-0 with this false, so
          "points are not null" is not a substitute.
      - name: points_for
        description: >
          Points scored by this team.
      - name: points_against
        description: >
          Points scored by the opponent.
      - name: margin
        description: >
          points_for minus points_against — negative in a loss, computed upstream so no page
          subtracts.
      - name: result
        description: >
          `W`, `L` or `T` from this team's perspective; null until completed.
      - name: first_downs
        description: >
          First downs gained by this team.
      - name: total_yards
        description: >
