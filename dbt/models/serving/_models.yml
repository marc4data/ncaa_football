      - name: class_year_display
        description: 'FR, SO, JR or SR; null wherever the class is unknown.'
      - name: height_inches
        description: Listed height in inches; null on 2,808 rows.
      - name: height_display
        description: Height as feet-inches, e.g. "6-2", assembled upstream.
      - name: weight_pounds
        description: Listed weight in pounds; null on 3,013 rows.
      - name: home_city
        description: Home town city.
      - name: home_state
        description: Home town state or province.
      - name: hometown_display
        description: >
          "City, State" where both exist, otherwise whichever does, otherwise null — never a
