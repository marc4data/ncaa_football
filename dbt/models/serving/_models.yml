  # ---------------------------------------------------------------------------------------
  - name: srv_player_play
    description: >
      Players page, the play-level drill-down — one row per play a player is credited on, and
      the section the site IA singles out as what nobody in the comp set offers publicly.
      EVERY FILTER THE PAGE OFFERS IS A COLUMN HERE, because the site reads one relation per
      query with a WHERE and no joins (G-2) and does no arithmetic (G-3).
      COVERAGE, AND HOW TO READ ABSENCE. /plays/stats caps at 2,000 records per request, so
      the original week-scoped fetch returned an arbitrary 11% of games skewed to whichever
      the API listed first. Fixed by fanning out per game: 375,925 rows over 1,884 games,
      with 2024 conference coverage now even (Big Ten 151, ACC 149, SEC 144, Big 12 127).
      The fan-out runs over completed FBS games, which is the project's scope, so absence
      means "cfdb did not ask about that game", never "the player did nothing".
      Published on the weekly cadence; see srv_player_stats.
    columns:
      - name: play_stat_sk
        description: Surrogate key over (play, athlete, stat type) — the grain.
      - name: play_id
        description: CFBD play id, joining to the play spine.
      - name: game_id
        description: CFBD game id.
      - name: season
        description: Season the play belongs to.
      - name: week
        description: Week the play belongs to.
      - name: season_type
        description: '`regular` or `postseason`.'
      - name: game_date
        description: Calendar date of the game.
      - name: player_id
        description: CFBD athlete id.
      - name: player_slug
        description: URL-safe identifier, name and player id.
      - name: player_name
        description: Athlete name as this endpoint publishes it.
      - name: team
        description: Team the athlete was playing for.
      - name: team_id
        description: Resolved from dim_team within season.
      - name: conference
        description: Conference of that team.
      - name: opponent
        description: The other team in the game.
      - name: stat_type
        description: >
          What the athlete recorded on the play — Reception, Completion, Sack and so on. One
          measure per row, which is why the value needs no parsing.
      - name: stat
        description: The value, already numeric on this endpoint unlike the box score.
      - name: period
        description: Quarter, or the overtime period.
      - name: down
        description: >
          Down, 1-4. Null or 0 on kickoffs and some special-teams plays, where there is no
          down to report.
      - name: distance
        description: Yards needed for a first down.
      - name: yards_to_goal
        description: Distance to the opponent's goal line — the unambiguous field position.
      - name: down_distance_display
        description: >
          "3rd and 7", or "1st and Goal" where the distance reaches the end zone. Assembled
          upstream because a down and distance is one fact with a conventional rendering.
      - name: distance_bucket
        description: >
          `short` (<=3), `medium` (4-7), `long` (8+) or `goal to go`. What the filter actually
          needs: "3rd and long" is the question a reader asks and "3rd and 7" is not.
      - name: field_zone
        description: '`red zone` (<=20 to goal), `opponent territory` (<=50), or `own territory`.'
      - name: play_type
        description: CFBD's classification of the play.
      - name: play_text
        description: >
          The narrative description of the play. This view is the structured counterpart —
          which athlete recorded which stat — sitting beside the prose.
      - name: yards_gained
        description: Yards gained on the play; negative on a loss.
      - name: is_scoring_play
        description: Whether the play resulted in points.
      - name: ppa
        description: Predicted points added for the play, where CFBD computes it.
      - name: as_of_ts
        description: AC-G.35. Last load of the `game` domain, rendered instead of now().

  # ---------------------------------------------------------------------------------------
  - name: srv_game_weather
    description: >
      Matchup page, Weather section. One row per game with conditions at kickoff and the
      venue's geography. 6,847 games, 2024 onward — weather is not collected for earlier
      seasons, so a 2019 matchup legitimately has no row.
      A SEPARATE VIEW RATHER THAN COLUMNS ON srv_matchup: that table is already the widest
      object in the model at 77 columns and 110,879 rows, and widening it would add twenty-odd
      columns null on 94% of them. The site reads one relation per query, not one per page.
      WEATHER DESCRIBES THE VENUE'S LOCATION, NOT THE PLAYING ENVIRONMENT. Domed games carry
      ordinary outdoor readings — including five with measurable precipitation — so
      `is_indoors` is the column that says whether any of it reached the field.
    columns:
      - name: game_weather_sk
        description: Surrogate key over game_id — the grain, one row per game.
      - name: game_id
        description: CFBD game id, joining to srv_matchup and the rest of the game spine.
      - name: season
        description: Season the game belongs to. 2024 onward only.
      - name: week
        description: Week within the season and season_type.
      - name: season_type
        description: '`regular` or `postseason`.'
      - name: start_at
        description: Kickoff timestamp as the weather feed reports it.
      - name: home_team
        description: Home team name, as echoed by the weather endpoint.
      - name: away_team
        description: Away team name, as echoed by the weather endpoint.
      - name: venue
        description: Venue name from the weather payload.
      - name: city
        description: Venue city, from dim_venue.
      - name: state
        description: Venue state, from dim_venue.
      - name: timezone
        description: Venue timezone, from dim_venue.
      - name: latitude
        description: >
          Venue latitude. Populated on all but one row — O'Hara Field is in dim_venue with no
          coordinates published, which is an upstream gap rather than a failed join.
      - name: longitude
        description: Venue longitude, with the same single exception as latitude.
      - name: elevation_m
        description: >
          Venue elevation in metres. Populated on 3,847 of 6,847 rows — /venues does not
          publish it for every venue, so an elevation feature would be partial and should say
          so rather than treating absence as sea level.
      - name: capacity
        description: Venue capacity, from dim_venue.
      - name: is_grass
        description: Whether the playing surface is grass, from dim_venue.
      - name: is_indoors
        description: >
          THE COLUMN THAT QUALIFIES EVERY OTHER ONE. Whether the venue is enclosed. Agrees
          with dim_venue.is_dome on all 6,847 rows — two independent sources, zero
          disagreements. Indoor games still carry outdoor readings, so this is what says
          whether they affected play.
      - name: temperature_f
        description: Temperature in Fahrenheit at kickoff. Observed range 6.1 to 107.2.
      - name: dew_point_f
        description: Dew point in Fahrenheit.
      - name: humidity_pct
        description: Relative humidity as a percentage.
      - name: precipitation_in
        description: Precipitation in inches. Non-zero on 444 games.
      - name: snowfall_in
        description: Snowfall in inches.
      - name: pressure_mb
        description: Barometric pressure in millibars.
      - name: wind_speed_mph
        description: Wind speed in miles per hour. Observed range 0 to 32.7.
      - name: wind_direction_deg
        description: Wind bearing in degrees, 0-360, as reported.
      - name: wind_direction_compass
        description: >
          The bearing as one of eight compass points. A reader does not parse 247°, and eight
          points is coarse enough to stay honest about a single instantaneous reading.
      - name: weather_condition
        description: >
          CFBD's text label — Cloudy, Clear, Fair, Light Rain and so on. NULL on 548 rows
          where the feed sends a blank, only 6 of which are indoors; normalised from empty
          string so a page renders an em dash rather than a cell that looks broken.
      - name: is_precipitating
        description: >
          Whether any precipitation was recorded. Null-safe — unknown stays unknown rather
          than becoming false. "0.00 in" reads as a measurement; this reads as an answer.
      - name: as_of_ts
        description: AC-G.35. Last load of the `game` domain, rendered instead of now().

