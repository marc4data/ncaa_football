        description: Model's predicted home score; null for probability-only models.
      - name: predicted_away_points
        description: Model's predicted away score; null for probability-only models.
      - name: confidence_bucket
        description: The model's own confidence label for this prediction.
      - name: home_cover_edge
        description: >
          Model's edge on the home side against the spread, in points. Derived once in
          fct_prediction and only consumed here.
      - name: home_win_probability_edge
        description: >
          Model's edge on the home moneyline, as a probability. Not comparable with
          `home_cover_edge`, which is in points.
      - name: is_out_of_sample_week
        description: >
          Whether the model is extrapolating for this week — no training data exists this
          early in a season.
      - name: is_default_actionable
        description: >
          The inverse of `is_out_of_sample_week`, precomputed so no page presents an
          extrapolated early-season edge as actionable.
      - name: training_week_floor
        description: >
          The model's own coverage floor, carried as DATA so the Empty state is not a
          hardcoded "Week 5" string. CFBD does not ship current-season feature files until
          week 5, because the models need several weeks of this year's results before they
          can forecast this year's teams. Weeks 1-4 having no predictions is BY DESIGN and
          recurs every season — which makes it EMPTY (the data does not exist yet, and here
          is why), never Degraded (we have not built it).
      - name: attribution
        description: >
          AC-G.41. Licence-required attribution travelling as data, so a page cannot draw the
          model's numbers without it.
      - name: as_of_ts
        description: AC-G.35. Last load of the `game` domain, rendered instead of now().

