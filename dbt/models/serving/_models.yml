      page has no roster and says so, because /roster is `recent` scope and that is not a
      defect.
      Straight off dim_athlete with no aggregation: the dimension's grain is already
      (season, player, team), which is exactly a roster. It is its own view rather than
      columns on srv_team_overview because that is one row per team-season and this is many —
      a different grain is a different relation.
