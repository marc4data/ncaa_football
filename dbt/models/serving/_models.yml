  - name: srv_standings
    description: >
      Standings. One row per season x team, denormalized on purpose because the site reads
      exactly one of these per view with a WHERE and no joins. Replaces
      mart_team_season_record, and mirrors that mart's column names and semantics so the
      parity test can compare them directly; new columns are additive and excluded from parity.
    columns:
      - name: team_season_sk
        description: Surrogate key over (season, team) — the grain.
      - name: team_season_key
        description: >
          Readable composite key, `season-team_id`. Retained under the mart's original name
          so the parity test compares like with like.
      - name: season
        description: Season the record covers.
      - name: team_id
        description: CFBD team id.
      - name: is_listed_team
        description: >
          Whether the team appears in CFBD's own team list for that season, as opposed to
          existing only because it played someone who does. Distinguishes a real roster entry
          from a spine stub.
      - name: school
        description: School name.
      - name: conference
        description: Conference affiliation for that season.
      - name: classification
        description: Division for that season.
      - name: games_played
        description: Games played that season.
      - name: wins
        description: Wins that season.
      - name: losses
        description: Losses that season.
      - name: ties
        description: Ties that season, non-zero only in eras that permitted them.
      - name: points_for
        description: Total points scored that season.
      - name: points_against
        description: Total points conceded that season.
      - name: point_differential
        description: '`points_for` minus `points_against`, computed upstream.'
      - name: win_pct
        description: Winning percentage as the record fact defines it.
      - name: conference_wins
        description: Wins against conference opponents.
      - name: conference_losses
        description: Losses against conference opponents.
      - name: conference_win_pct
        description: Winning percentage within the conference.
      - name: tiebreak_rank
        description: Position within the conference after tiebreakers are applied.
      - name: tiebreak_basis
        description: >
          Which rule decided `tiebreak_rank`. Without it a standings order looks arbitrary
          the moment two teams share a record.
      - name: division
        description: >
          Division within the conference. NULL IS NORMAL, NOT MISSING DATA. AC-5.2 groups by
          division "where a conference has them", and post-realignment only 159 of 2,044 FBS
          team-seasons have one — the SEC and Big Ten dropped divisions in 2024. A page that
          rendered a Degraded state for the other 92% would be reporting a defect that does
          not exist.
      - name: home_wins
        description: Wins in home games.
      - name: home_losses
        description: Losses in home games.
      - name: away_wins
        description: Wins in away games.
      - name: away_losses
        description: Losses in away games.
      - name: neutral_games
        description: >
          Games at neutral sites. A count rather than a record, because neutral-site results
          are already counted in the overall W-L and splitting them again would double-count.
      - name: home_record_display
        description: >
          AC-5.3. Pre-formatted home record, e.g. "5-2". The app never assembles this from
          two columns: a record is one fact with a conventional rendering, not two numbers
          and a hyphen decided in Python.
      - name: away_record_display
        description: Pre-formatted away record, same convention.
      - name: current_streak_display
        description: Pre-formatted current streak, e.g. "W3".
      - name: current_streak_outcome
        description: Whether the current streak is of wins or losses, for styling.
      - name: current_streak_length
        description: How many games the current streak runs to.
      - name: last_5_display
        description: Pre-formatted record over the last five games.
      - name: ats_record_display
        description: >
          Pre-formatted against-the-spread record, sharing one definition with the Team page
          rather than being recomputed here. NULL, never "0-0-0", where nothing has been
          graded — so an ungraded season is visibly absent rather than looking like a team
          that went 0-0-0.
      - name: ats_as_favorite_display
        description: Pre-formatted ATS record in games where this team was favoured.
      - name: ats_as_underdog_display
        description: Pre-formatted ATS record in games where this team was the underdog.
      - name: abbreviation
        description: Short form for compact rendering.
      - name: color_on_light
        description: Contrast-corrected team colour safe on a light background.
      - name: color_on_dark
        description: Contrast-corrected team colour safe on a dark background.
      - name: logo_source_url
        description: CFBD logo URL for the team.
      - name: logo_url
        description: Alias of `logo_source_url`, carried so pages written against either name work.
      - name: team_slug
        description: URL-safe team identifier used in the site's routing.
      - name: team_display
        description: Display name, falling back to `school` where dim_team has no row.
      - name: as_of_ts
        description: AC-G.35. Last load of the `game` domain, rendered instead of now().

  # ---------------------------------------------------------------------------------------
  - name: srv_team_overview
    description: >
      Team page, Overview tab. One row per team per season.
      BUILT NARROWED, BY DECISION. Identity, record, conference standing and ATS are
      derivable from facts that exist today. The ratings and profile block — SP+, Elo, SRS,
      adjusted EPA, success rate, points per drive, havoc, returning production, coach — is
      NOT here, because every one depends on a fact scheduled in Track B. Those columns are
      deliberately ABSENT rather than present-and-null: a null column reads as "no data for
      this team", whereas an absent column lets the page render its Degraded state and name
      `fct_team_week_rating`, which is what AC-8.2 asks for.
      ATS comes from fct_team_record rather than being computed here, so Standings and this
      page share one definition instead of deriving it twice.
    columns:
      - name: team_overview_sk
        description: Surrogate key over (season, team_id) — the grain.
      - name: season
        description: Season the overview covers.
      - name: team_id
        description: CFBD team id.
      - name: team_slug
        description: URL-safe team identifier used in the site's routing.
      - name: team_display
        description: Display name for the team.
      - name: mascot
        description: Team mascot.
      - name: abbreviation
        description: Short form for compact rendering.
      - name: logo_url
        description: CFBD logo URL for the team.
      - name: color_primary
        description: The school's primary colour as CFBD publishes it, unmodified.
      - name: color_on_light
        description: Contrast-corrected colour safe on a light background.
      - name: color_on_dark
        description: Contrast-corrected colour safe on a dark background.
      - name: color_source
        description: >
          Where the corrected colours came from — the published colour, or a substitute where
          it failed contrast. The audit trail for a colour the site changed.
      - name: conference
        description: Conference affiliation for that season.
      - name: division
        description: >
          Division within the conference. Null is NORMAL rather than missing — most
          conferences no longer have divisions. See srv_standings.division.
      - name: classification
        description: Division level for that season — `fbs`, `fcs` and so on.
      - name: city
        description: City the team is based in.
      - name: state
        description: State or territory the team is based in.
      - name: wins
        description: Wins that season; null before any game has been played.
      - name: losses
        description: Losses that season; null before any game has been played.
      - name: record_display
        description: >
          AC-5.3. Pre-formatted "W-L", assembled here because the app must not build a
          record from components.
      - name: conference_standing
        description: Position within the conference, from srv_standings' tiebreak rank.
      - name: conference_wins
        description: Wins against conference opponents.
      - name: conference_losses
        description: Losses against conference opponents.
      - name: conference_record_display
        description: Pre-formatted conference record, same convention as `record_display`.
      - name: games_played
        description: Games played that season.
      - name: points_for
        description: Total points scored that season.
      - name: points_against
        description: Total points conceded that season.
      - name: point_differential
        description: '`points_for` minus `points_against`, computed upstream.'
      - name: yards_for
        description: >
          Total offensive yards. Read against `games_with_box_score`, not `games_played`.
      - name: rushing_yards_for
        description: Rushing yards gained that season.
      - name: passing_yards_for
        description: Passing yards gained that season.
      - name: yards_allowed
        description: >
          Total yards conceded. Read against `games_with_opponent_box_score`.
      - name: rushing_yards_allowed
        description: Rushing yards conceded that season.
      - name: passing_yards_allowed
        description: Passing yards conceded that season.
      - name: penalty_yards
        description: Penalty yards assessed against this team.
      - name: takeaways
        description: Turnovers forced that season.
      - name: giveaways
        description: Turnovers committed that season.
      - name: turnover_margin
        description: '`takeaways` minus `giveaways`, computed upstream.'
      - name: games_with_box_score
        description: >
          AC-G.33. The n the "for" totals were computed over, at or below `games_played`
          because not every game has a box score. Using `games_played` as the denominator
          instead produces a per-game figure against the wrong n.
      - name: games_with_opponent_box_score
        description: >
          The same denominator for the "allowed" totals, tracked separately because a game
          can have one side's box score and not the other's.
      - name: ats_wins
        description: Games where this team beat the spread.
      - name: ats_losses
        description: Games where this team failed to beat the spread.
      - name: ats_pushes
        description: Games that landed exactly on the spread.
      - name: ats_record_display
        description: >
          Pre-formatted ATS record. NOT coalesced to zero: a team with no graded games has
          NULL here, because "0-0-0" claims a measurement that was never taken. The coalesce
          this replaced made every 2026 team read 0-0-0 while wins and losses in the SAME ROW
          were correctly null — one table, two treatments of "hasn't happened yet". Null lets
          the page render an em dash per AC-G.32.
      - name: ats_as_favorite_display
        description: >
          Pre-formatted ATS record in games where this team was favoured. Null where the team
          was never a favourite — 34 team-seasons changed from "0-0" to absent when this was
          corrected.
      - name: ats_as_underdog_display
        description: Pre-formatted ATS record in games where this team was the underdog.
      - name: as_of_ts
        description: AC-G.35. Last load of the `game` domain, rendered instead of now().

  # ---------------------------------------------------------------------------------------
  - name: srv_player_stats
    description: >
      Players page, season stats. One row per player x season x category x stat type, long
      for the reason srv_team_stats is long — CFBD's stat types are open-ended and a wide
      table would silently omit whatever it adds next.
      Runs back to 2004, twenty seasons deeper than the game log and the drill-down, because
      /stats/player/season is `full` scope while box scores and plays are `recent`.
      PUBLISHED ON THE WEEKLY CADENCE, not the two-hourly one — this table and its two
      siblings are 608 MB of the serving schema and would triple the payload on the link that
      is the pipeline's failure point. See HEAVY_SERVING in src/publish_marts.py.
    columns:
      - name: player_season_stat_sk
        description: Surrogate key over (season, player, category, stat type) — the grain.
      - name: season
        description: Season the totals cover. 2004 onward.
      - name: player_id
        description: CFBD athlete id, shared with the game log and the drill-down.
      - name: player_slug
        description: >
          URL-safe identifier, name AND player id. The id is load-bearing: 1,343 name-and-
          season combinations map to more than one athlete, including nine Jayden Williamses.
      - name: player_name
        description: Player name as the stats feed publishes it.
      - name: position
        description: Listed position for that season.
      - name: team
        description: Team name as the stats feed gave it.
      - name: team_id
        description: >
          CFBD team id where dim_athlete reaches; null for seasons before 2024, which have no
          roster feed. Not a join failure.
      - name: conference
        description: Conference affiliation recorded for that season.
      - name: stat_category
        description: >
          CFBD's grouping — defensive, receiving, rushing, passing, kickReturns, fumbles,
          interceptions, puntReturns, kicking, punting.
      - name: stat_type
        description: >
          The statistic within the category. The page's stat picker is a WHERE on this
          column, so the selectable set is data rather than code.
      - name: stat_value
        description: >
          The value. Units differ per stat_type and are not normalised, so figures are only
          comparable within one (stat_category, stat_type).
          Zero is a real measurement here and is kept: "0 interceptions" is a fact about a
          season, and its absence is not the same statement.
      - name: rank_desc
        description: >
          Rank within (season, stat_category, stat_type), highest value first — correct for
          stats where more is better. Ties share a rank and the next is skipped.
      - name: rank_asc
        description: >
          The same ranking lowest-first, for stats where less is better. Both directions are
          precomputed because the warehouse does not know which way a given stat reads and
          the page must not decide with arithmetic.
      - name: percentile
        description: >
          percent_rank within (season, stat_category, stat_type), ascending, to 4 decimal
          places. 0 is the lowest value in the group and 1 the highest, so it reads with
          rank_asc.
      - name: rank_population
        description: >
          How many rows the rank was computed over. Without it a rank of 40th is unreadable —
          40 of 2,000 and 40 of 45 are different statements.
      - name: class_year_display
        description: 'FR, SO, JR or SR; null where dim_athlete does not reach, i.e. before 2024.'
      - name: height_display
        description: Height as feet-inches, e.g. "6-2"; null outside 2024-2026.
      - name: weight_pounds
        description: Listed weight; null outside 2024-2026.
      - name: jersey
        description: Jersey number; null outside 2024-2026.
      - name: as_of_ts
        description: AC-G.35. Last load of the `stats` domain, rendered instead of now().

