  - name: srv_standings
    description: >
      Standings. One row per season x team, denormalized on purpose because the site reads
      exactly one of these per view with a WHERE and no joins. Replaces
      mart_team_season_record, and mirrors that mart's column names and semantics so the
      parity test can compare them directly; new columns are additive and excluded from parity.
    columns:
      - name: team_season_sk
        description: Surrogate key over (season, team) — the grain.
      - name: team_season_key
        description: >
          Readable composite key, `season-team_id`. Retained under the mart's original name
          so the parity test compares like with like.
      - name: season
        description: Season the record covers.
      - name: team_id
        description: CFBD team id.
      - name: is_listed_team
        description: >
          Whether the team appears in CFBD's own team list for that season, as opposed to
          existing only because it played someone who does. Distinguishes a real roster entry
          from a spine stub.
      - name: school
        description: School name.
      - name: conference
        description: Conference affiliation for that season.
      - name: classification
        description: Division for that season.
      - name: games_played
        description: Games played that season.
      - name: wins
        description: Wins that season.
      - name: losses
        description: Losses that season.
      - name: ties
        description: Ties that season, non-zero only in eras that permitted them.
      - name: points_for
        description: Total points scored that season.
      - name: points_against
        description: Total points conceded that season.
      - name: point_differential
        description: '`points_for` minus `points_against`, computed upstream.'
      - name: win_pct
        description: Winning percentage as the record fact defines it.
      - name: conference_wins
        description: Wins against conference opponents.
      - name: conference_losses
        description: Losses against conference opponents.
      - name: conference_win_pct
        description: Winning percentage within the conference.
      - name: tiebreak_rank
        description: Position within the conference after tiebreakers are applied.
      - name: tiebreak_basis
        description: >
          Which rule decided `tiebreak_rank`. Without it a standings order looks arbitrary
          the moment two teams share a record.
      - name: division
        description: >
          Division within the conference. NULL IS NORMAL, NOT MISSING DATA. AC-5.2 groups by
          division "where a conference has them", and post-realignment only 159 of 2,044 FBS
          team-seasons have one — the SEC and Big Ten dropped divisions in 2024. A page that
          rendered a Degraded state for the other 92% would be reporting a defect that does
          not exist.
      - name: home_wins
        description: Wins in home games.
      - name: home_losses
        description: Losses in home games.
      - name: away_wins
        description: Wins in away games.
      - name: away_losses
        description: Losses in away games.
      - name: neutral_games
        description: >
          Games at neutral sites. A count rather than a record, because neutral-site results
          are already counted in the overall W-L and splitting them again would double-count.
      - name: home_record_display
        description: >
          AC-5.3. Pre-formatted home record, e.g. "5-2". The app never assembles this from
          two columns: a record is one fact with a conventional rendering, not two numbers
          and a hyphen decided in Python.
      - name: away_record_display
        description: Pre-formatted away record, same convention.
      - name: current_streak_display
        description: Pre-formatted current streak, e.g. "W3".
      - name: current_streak_outcome
        description: Whether the current streak is of wins or losses, for styling.
      - name: current_streak_length
        description: How many games the current streak runs to.
      - name: last_5_display
        description: Pre-formatted record over the last five games.
      - name: ats_record_display
        description: >
          Pre-formatted against-the-spread record, sharing one definition with the Team page
          rather than being recomputed here. NULL, never "0-0-0", where nothing has been
          graded — so an ungraded season is visibly absent rather than looking like a team
          that went 0-0-0.
      - name: ats_as_favorite_display
        description: Pre-formatted ATS record in games where this team was favoured.
      - name: ats_as_underdog_display
        description: Pre-formatted ATS record in games where this team was the underdog.
      - name: abbreviation
        description: Short form for compact rendering.
      - name: color_on_light
        description: Contrast-corrected team colour safe on a light background.
      - name: color_on_dark
        description: Contrast-corrected team colour safe on a dark background.
      - name: logo_source_url
        description: CFBD logo URL for the team.
      - name: logo_url
        description: Alias of `logo_source_url`, carried so pages written against either name work.
      - name: team_slug
        description: URL-safe team identifier used in the site's routing.
      - name: team_display
        description: Display name, falling back to `school` where dim_team has no row.
      - name: as_of_ts
        description: AC-G.35. Last load of the `game` domain, rendered instead of now().

  # ---------------------------------------------------------------------------------------
  - name: srv_schedule
    description: >
      Schedule. ONE ROW PER GAME — not one per team. The grain inversion the spec once
      carried backwards, so a count here equals the game count for the filtered scope and
      never twice it. Contrast srv_team_game_log, which is deliberately one row per side.
      The current line and the current prediction are collapsed to one row each before
      joining, so a game with many snapshots and many scored models still yields one row.
    columns:
      - name: game_sk
        description: Surrogate key from the game fact — the grain.
      - name: game_id
        description: CFBD game id.
      - name: season
        description: Season the game belongs to.
      - name: week
        description: Week within the season and season_type.
      - name: season_type
        description: '`regular` or `postseason`.'
      - name: week_sk
        description: Surrogate key of the week, for joining to the week dimension.
      - name: game_date
        description: Calendar date of the game.
      - name: start_date
        description: Scheduled kickoff, timezone-aware, as stored.
      - name: start_date_et
        description: >
          AC-G.34. Kickoff converted to US Eastern and stored WITHOUT a timezone, applied
          here and never in the app. Do not read this as UTC.
      - name: kickoff_time_known
        description: >
          Whether a real kickoff time is known. FALSE means `start_date` carries a placeholder,
          typically an unscheduled future game, so a page must not render an hour for it.
      - name: is_completed
        description: >
          Whether the game has finished. A cancelled game reads 0-0 with this false, so
          "points are not null" is not a substitute for it.
      - name: is_conference_game
        description: Whether both teams were in the same conference that season.
      - name: is_neutral_site
        description: Whether the game was played at a neutral venue.
      - name: venue_display
        description: Venue name as rendered.
      - name: network
        description: Broadcast network; null where not published.
      - name: attendance
        description: Reported attendance; null where not published.
      - name: excitement_index
        description: CFBD's excitement index for the game; null until it has been computed.
      - name: is_fbs_game
        description: >
          Whether EITHER team was FBS — not both. A Division II visitor's trip to an FBS
          stadium is an FBS game, and requiring both would drop 20 of the 25 games on the
          opening Thursday. 934 of 3,831 games in 2025 qualify. Carried as a column rather
          than a hardcoded WHERE so the site filters on it with a default that can be widened.
      - name: home_team_id
        description: CFBD team id for the home side.
      - name: home_team_slug
        description: URL-safe home team identifier.
      - name: home_team_display
