        description: Alias of `spread`, carried so pages written against either name work.
      - name: spread_open
        description: Opening spread for the game from that provider.
      - name: over_under
        description: Over/under at the most recent snapshot.
      - name: over_under_open
        description: Opening over/under for the game from that provider.
      - name: home_moneyline
        description: American-odds moneyline for the home team at the latest snapshot.
      - name: away_moneyline
        description: American-odds moneyline for the away team at the latest snapshot.
      - name: provider_key
        description: Which sportsbook the market columns came from.
      - name: line_snapshot_ts
        description: When the market columns were observed.
      - name: snapshot_ts
        description: Alias of `line_snapshot_ts`, carried so pages written against either name work.
      - name: market_implied_home_win_probability
        description: De-vigged market probability for the home team.
      - name: market_implied_away_win_probability
        description: De-vigged market probability for the away team.
      - name: overround
        description: >
          The bookmaker's margin in the raw prices — how far the implied probabilities summed
          above 100% before de-vigging. Carried so a reader can see how much was removed.
      - name: devig_method
        description: Method used to remove the vigorish.
      - name: model_name
        description: Name of the model behind the prediction columns.
      - name: model_family
        description: Broader family that model belongs to.
      - name: model_version_key
        description: The model VERSION, from dim_model_version.
      - name: predicted_margin
        description: Model's predicted margin in the away-minus-home convention.
      - name: predicted_margin_home_perspective
        description: '`predicted_margin` negated, so positive reads as "home favoured by".'
      - name: predicted_total_points
        description: Model's predicted combined score.
      - name: predicted_home_points
        description: Model's predicted home score.
      - name: predicted_away_points
        description: Model's predicted away score.
      - name: predicted_home_win_probability
        description: Model's probability that the home team wins.
      - name: home_win_probability
        description: Alias of `predicted_home_win_probability`, carried for page compatibility.
      - name: confidence_bucket
        description: The model's own confidence label for this prediction.
      - name: home_cover_edge
        description: Model's edge on the home side against the spread, in points.
      - name: home_win_probability_edge
        description: Model's edge on the home moneyline, as a probability.
      - name: is_out_of_sample_week
        description: Whether the model is extrapolating for this week.
      - name: training_week_floor
        description: >
          The model's coverage floor, carried as data so the Empty state is not a hardcoded
          "Week 5" string. Weeks 1-4 having no predictions is by design and recurs annually.
      - name: actual_margin
        description: Realised margin, away minus home, following the storage convention.
      - name: actual_margin_home_perspective
        description: >
          The same result read the other way round, so a page can put it beside
          `predicted_margin_home_perspective` without flipping a sign. Computed here because
          the app computing it would be the app owning a convention (G-3).
      - name: series_games
        description: >
          Prior meetings between these two teams WITH A RECORDED RESULT, excluding this game.
          Two games are flagged completed with no score, and counting them gave a
          head-to-head of 0-0-0 over one meeting — a row that reconciles to nothing.
      - name: series_home_team_wins
        description: >
          Prior meetings won by THIS GAME'S home team, whichever venue they were played at.
      - name: series_away_team_wins
        description: >
          Prior meetings won by this game's away team. Counted directly, NOT derived as
          `series_games - series_home_team_wins` — that form is only correct in a sport
          without draws, and silently credited all 2,600 tied games to the away side,
          overstating it in 40,045 of 102,985 rows.
      - name: series_ties
        description: >
          Prior meetings that ended level. Its own outcome, not a rounding error: college
          football had no overtime before 1996.
      - name: series_first_season
        description: Season of the earliest prior meeting with a result.
      - name: series_last_season
        description: Season of the most recent prior meeting with a result.
      - name: attribution
        description: AC-G.41. Licence-required attribution travelling as data.
      - name: as_of_ts
        description: AC-G.35. Last load of the `game` domain, rendered instead of now().

  # ---------------------------------------------------------------------------------------
  - name: srv_player_stats
    description: >
      Players page, season stats. One row per player x season x category x stat type, long
      for the reason srv_team_stats is long — CFBD's stat types are open-ended and a wide
      table would silently omit whatever it adds next.
      Runs back to 2004, twenty seasons deeper than the game log and the drill-down, because
      /stats/player/season is `full` scope while box scores and plays are `recent`.
      PUBLISHED ON THE WEEKLY CADENCE, not the two-hourly one — this table and its two
      siblings are 608 MB of the serving schema and would triple the payload on the link that
      is the pipeline's failure point. See HEAVY_SERVING in src/publish_marts.py.
    columns:
      - name: player_season_stat_sk
        description: Surrogate key over (season, player, category, stat type) — the grain.
      - name: season
        description: Season the totals cover. 2004 onward.
      - name: player_id
        description: CFBD athlete id, shared with the game log and the drill-down.
      - name: player_slug
        description: >
          URL-safe identifier, name AND player id. The id is load-bearing: 1,343 name-and-
          season combinations map to more than one athlete, including nine Jayden Williamses.
      - name: player_name
        description: Player name as the stats feed publishes it.
      - name: position
        description: Listed position for that season.
      - name: team
        description: Team name as the stats feed gave it.
      - name: team_id
        description: >
          CFBD team id where dim_athlete reaches; null for seasons before 2024, which have no
          roster feed. Not a join failure.
      - name: conference
        description: Conference affiliation recorded for that season.
      - name: stat_category
        description: >
          CFBD's grouping — defensive, receiving, rushing, passing, kickReturns, fumbles,
          interceptions, puntReturns, kicking, punting.
      - name: stat_type
        description: >
          The statistic within the category. The page's stat picker is a WHERE on this
          column, so the selectable set is data rather than code.
      - name: stat_value
        description: >
          The value. Units differ per stat_type and are not normalised, so figures are only
          comparable within one (stat_category, stat_type).
          Zero is a real measurement here and is kept: "0 interceptions" is a fact about a
          season, and its absence is not the same statement.
      - name: rank_desc
        description: >
          Rank within (season, stat_category, stat_type), highest value first — correct for
          stats where more is better. Ties share a rank and the next is skipped.
      - name: rank_asc
        description: >
          The same ranking lowest-first, for stats where less is better. Both directions are
          precomputed because the warehouse does not know which way a given stat reads and
          the page must not decide with arithmetic.
      - name: percentile
        description: >
          percent_rank within (season, stat_category, stat_type), ascending, to 4 decimal
          places. 0 is the lowest value in the group and 1 the highest, so it reads with
          rank_asc.
      - name: rank_population
        description: >
          How many rows the rank was computed over. Without it a rank of 40th is unreadable —
          40 of 2,000 and 40 of 45 are different statements.
      - name: class_year_display
        description: 'FR, SO, JR or SR; null where dim_athlete does not reach, i.e. before 2024.'
      - name: height_display
        description: Height as feet-inches, e.g. "6-2"; null outside 2024-2026.
      - name: weight_pounds
        description: Listed weight; null outside 2024-2026.
      - name: jersey
        description: Jersey number; null outside 2024-2026.
      - name: as_of_ts
        description: AC-G.35. Last load of the `stats` domain, rendered instead of now().

  # ---------------------------------------------------------------------------------------
  - name: srv_player_game_log
    description: >
      Players page, game log. One row per player x game x category x stat type.
      2024 ONWARD ONLY, because box scores are `recent` scope. A player with a 2015 season on
      the season tab and nothing here is the honest state rather than a defect —
      srv_player_stats runs back to 2004 and this cannot.
      Published on the weekly cadence; see srv_player_stats.
    columns:
      - name: player_game_stat_sk
        description: >
          Surrogate key over (game, team, category, stat type, athlete) — the grain.
      - name: game_id
        description: CFBD game id.
      - name: season
        description: Season, resolved from the game spine — the box-score feed carries none.
      - name: week
        description: Week, resolved from the game spine.
      - name: season_type
        description: '`regular` or `postseason`.'
      - name: game_date
        description: Calendar date of the game.
      - name: start_date
        description: Scheduled kickoff, timezone-aware.
      - name: player_id
        description: CFBD athlete id, shared with the season stats and the drill-down.
      - name: player_slug
        description: URL-safe identifier, name and player id.
      - name: player_name
        description: Athlete name as the box score publishes it.
      - name: team
        description: Team the athlete played for in this game.
      - name: team_id
        description: >
          Resolved from dim_team within season; null for non-FBS programmes absent from
          /teams.
      - name: conference
        description: Conference of that team.
      - name: home_away
        description: Whether the team was home or away, carried on the box-score row itself.
      - name: opponent
        description: >
          The other side, derived from home_away against the game spine rather than by
          matching names, so an upstream rename cannot break it.
      - name: opponent_team_id
        description: CFBD team id of the opponent.
      - name: team_points
        description: Points this team scored in the game, repeated on each of its stat rows.
      - name: stat_category
        description: CFBD's grouping for the statistic, e.g. passing, rushing, kicking.
      - name: stat_type
        description: >
          The statistic within the category — C/ATT, YDS, TD, INT, QBR, LONG, CAR, AVG and
          more, open-ended and category-specific.
      - name: stat_raw
        description: >
          The value exactly as CFBD sent it, and the only column populated on every row.
          Three shapes exist; see the three columns below.
      - name: stat_value
        description: >
          The plain-number shape. NULL for a made/attempted pair, which has no single value,
          and null for the literal "--" that CFBD sends for an uncomputed QBR.
      - name: stat_made
        description: >
          First half of a made/attempted pair, across exactly three types: passing C/ATT,
          kicking FG and kicking XP. "Made" is correct for each, since a completion is a pass
          made. Splitting the pair is what lets a page show completion percentage rather than
          only printing "12/31".
      - name: stat_attempted
        description: Second half of a made/attempted pair; null on every row that is not one.
      - name: as_of_ts
        description: AC-G.35. Last load of the `game` domain, rendered instead of now().

  # ---------------------------------------------------------------------------------------
  - name: srv_player_play
    description: >
      Players page, the play-level drill-down — one row per play a player is credited on, and
      the section the site IA singles out as what nobody in the comp set offers publicly.
      EVERY FILTER THE PAGE OFFERS IS A COLUMN HERE, because the site reads one relation per
      query with a WHERE and no joins (G-2) and does no arithmetic (G-3).
      COVERAGE IS INCOMPLETE AND MUST BE READ THAT WAY. /plays/stats caps at 2,000 records per
      request, so the original week-scoped fetch returned an arbitrary 11% of games. The
      source is fixed — the endpoint now fans out per game — but this view is only as complete
      as what has landed. Absence means "no stat line landed for that play", never "the player
      did nothing".
      Published on the weekly cadence; see srv_player_stats.
    columns:
      - name: play_stat_sk
        description: Surrogate key over (play, athlete, stat type) — the grain.
      - name: play_id
        description: CFBD play id, joining to the play spine.
      - name: game_id
        description: CFBD game id.
      - name: season
        description: Season the play belongs to.
      - name: week
        description: Week the play belongs to.
      - name: season_type
        description: '`regular` or `postseason`.'
      - name: game_date
        description: Calendar date of the game.
      - name: player_id
        description: CFBD athlete id.
      - name: player_slug
        description: URL-safe identifier, name and player id.
      - name: player_name
        description: Athlete name as this endpoint publishes it.
      - name: team
        description: Team the athlete was playing for.
      - name: team_id
        description: Resolved from dim_team within season.
      - name: conference
        description: Conference of that team.
      - name: opponent
        description: The other team in the game.
      - name: stat_type
        description: >
          What the athlete recorded on the play — Reception, Completion, Sack and so on. One
          measure per row, which is why the value needs no parsing.
      - name: stat
        description: The value, already numeric on this endpoint unlike the box score.
      - name: period
        description: Quarter, or the overtime period.
      - name: down
        description: >
          Down, 1-4. Null or 0 on kickoffs and some special-teams plays, where there is no
          down to report.
      - name: distance
        description: Yards needed for a first down.
      - name: yards_to_goal
        description: Distance to the opponent's goal line — the unambiguous field position.
      - name: down_distance_display
        description: >
          "3rd and 7", or "1st and Goal" where the distance reaches the end zone. Assembled
          upstream because a down and distance is one fact with a conventional rendering.
      - name: distance_bucket
        description: >
          `short` (<=3), `medium` (4-7), `long` (8+) or `goal to go`. What the filter actually
          needs: "3rd and long" is the question a reader asks and "3rd and 7" is not.
      - name: field_zone
        description: '`red zone` (<=20 to goal), `opponent territory` (<=50), or `own territory`.'
      - name: play_type
        description: CFBD's classification of the play.
      - name: play_text
        description: >
          The narrative description of the play. This view is the structured counterpart —
          which athlete recorded which stat — sitting beside the prose.
      - name: yards_gained
        description: Yards gained on the play; negative on a loss.
      - name: is_scoring_play
        description: Whether the play resulted in points.
      - name: ppa
        description: Predicted points added for the play, where CFBD computes it.
      - name: as_of_ts
        description: AC-G.35. Last load of the `game` domain, rendered instead of now().

  # ---------------------------------------------------------------------------------------
  - name: srv_game_weather
    description: >
      Matchup page, Weather section. One row per game with conditions at kickoff and the
      venue's geography. 6,847 games, 2024 onward — weather is not collected for earlier
      seasons, so a 2019 matchup legitimately has no row.
      A SEPARATE VIEW RATHER THAN COLUMNS ON srv_matchup: that table is already the widest
      object in the model at 77 columns and 110,879 rows, and widening it would add twenty-odd
      columns null on 94% of them. The site reads one relation per query, not one per page.
      WEATHER DESCRIBES THE VENUE'S LOCATION, NOT THE PLAYING ENVIRONMENT. Domed games carry
      ordinary outdoor readings — including five with measurable precipitation — so
      `is_indoors` is the column that says whether any of it reached the field.
    columns:
      - name: game_weather_sk
        description: Surrogate key over game_id — the grain, one row per game.
      - name: game_id
        description: CFBD game id, joining to srv_matchup and the rest of the game spine.
      - name: season
        description: Season the game belongs to. 2024 onward only.
      - name: week
        description: Week within the season and season_type.
      - name: season_type
        description: '`regular` or `postseason`.'
      - name: start_at
        description: Kickoff timestamp as the weather feed reports it.
      - name: home_team
        description: Home team name, as echoed by the weather endpoint.
      - name: away_team
        description: Away team name, as echoed by the weather endpoint.
      - name: venue
        description: Venue name from the weather payload.
      - name: city
        description: Venue city, from dim_venue.
      - name: state
        description: Venue state, from dim_venue.
      - name: timezone
        description: Venue timezone, from dim_venue.
      - name: latitude
        description: >
          Venue latitude. Populated on all but one row — O'Hara Field is in dim_venue with no
          coordinates published, which is an upstream gap rather than a failed join.
      - name: longitude
        description: Venue longitude, with the same single exception as latitude.
      - name: elevation_m
        description: >
          Venue elevation in metres. Populated on 3,847 of 6,847 rows — /venues does not
          publish it for every venue, so an elevation feature would be partial and should say
          so rather than treating absence as sea level.
      - name: capacity
        description: Venue capacity, from dim_venue.
      - name: is_grass
        description: Whether the playing surface is grass, from dim_venue.
      - name: is_indoors
        description: >
          THE COLUMN THAT QUALIFIES EVERY OTHER ONE. Whether the venue is enclosed. Agrees
          with dim_venue.is_dome on all 6,847 rows — two independent sources, zero
          disagreements. Indoor games still carry outdoor readings, so this is what says
          whether they affected play.
      - name: temperature_f
        description: Temperature in Fahrenheit at kickoff. Observed range 6.1 to 107.2.
      - name: dew_point_f
        description: Dew point in Fahrenheit.
      - name: humidity_pct
        description: Relative humidity as a percentage.
      - name: precipitation_in
        description: Precipitation in inches. Non-zero on 444 games.
      - name: snowfall_in
        description: Snowfall in inches.
      - name: pressure_mb
        description: Barometric pressure in millibars.
      - name: wind_speed_mph
        description: Wind speed in miles per hour. Observed range 0 to 32.7.
      - name: wind_direction_deg
        description: Wind bearing in degrees, 0-360, as reported.
      - name: wind_direction_compass
        description: >
          The bearing as one of eight compass points. A reader does not parse 247°, and eight
          points is coarse enough to stay honest about a single instantaneous reading.
      - name: weather_condition
        description: >
          CFBD's text label — Cloudy, Clear, Fair, Light Rain and so on. NULL on 548 rows
          where the feed sends a blank, only 6 of which are indoors; normalised from empty
          string so a page renders an em dash rather than a cell that looks broken.
      - name: is_precipitating
        description: >
          Whether any precipitation was recorded. Null-safe — unknown stays unknown rather
          than becoming false. "0.00 in" reads as a measurement; this reads as an answer.
      - name: as_of_ts
        description: AC-G.35. Last load of the `game` domain, rendered instead of now().

  # ---------------------------------------------------------------------------------------
  - name: srv_team_roster
    description: >
      Team page, Roster section. One row per player on a team's roster in a season — 68,357
      rows across 2024-2026, which is every season cfdb holds a roster feed for. A 2019 team
      page has no roster and says so, because /roster is `recent` scope and that is not a
      defect.
      Straight off dim_athlete with no aggregation: the dimension's grain is already
      (season, player, team), which is exactly a roster. It is its own view rather than
      columns on srv_team_overview because that is one row per team-season and this is many —
      a different grain is a different relation.
    columns:
      - name: athlete_sk
        description: Surrogate key from dim_athlete over (season, player, team) — the grain.
      - name: season
        description: Season the roster row belongs to. 2024 onward.
      - name: player_id
        description: CFBD athlete id, shared with every player fact.
      - name: player_slug
        description: >
          URL-safe identifier carrying name AND player id, so a roster row links to the right
          one of nine Jayden Williamses.
      - name: full_name
        description: First and last name joined, trimmed.
      - name: first_name
        description: Given name as the roster feed publishes it.
      - name: last_name
        description: Family name as the roster feed publishes it.
      - name: team
        description: Team name as the roster feed gave it.
      - name: team_id
        description: >
          CFBD team id; null for the 321 NAIA and Division II programmes absent from /teams.
      - name: team_slug
        description: >
          URL-safe team identifier, and what the Team page filters on. Falls back to a slug
          of the roster's own team name where dim_team has no row.
      - name: team_display
        description: Team display name.
      - name: conference
        description: Conference affiliation for that season; null for unlisted teams.
      - name: classification
        description: Division for that season; null for unlisted teams.
      - name: is_listed_team
        description: >
          Whether dim_team had a row. FALSE marks a non-FBS programme rather than a broken
          join.
      - name: position
        description: Listed position; null on 2,450 rows where the feed omits it.
      - name: jersey
        description: Jersey number; null on 3,177 rows where the feed omits it.
      - name: class_year
        description: >
          Academic class as 1-4, or null. CFBD sometimes sends the season in this field
          instead — see dim_athlete.class_year_raw — and anything outside 1-4 is treated as
          unknown rather than mapped.
      - name: class_year_display
        description: 'FR, SO, JR or SR; null wherever the class is unknown.'
      - name: height_inches
        description: Listed height in inches; null on 2,808 rows.
      - name: height_display
        description: Height as feet-inches, e.g. "6-2", assembled upstream.
      - name: weight_pounds
        description: Listed weight in pounds; null on 3,013 rows.
      - name: home_city
        description: Home town city.
      - name: home_state
        description: Home town state or province.
      - name: hometown_display
        description: >
          "City, State" where both exist, otherwise whichever does, otherwise null — never a
          lone comma, so the page renders an em dash rather than stray punctuation.
      - name: as_of_ts
        description: AC-G.35. Last load of the `team` domain, rendered instead of now().
