      by side. Deliberately narrower than the Edge Finder — this answers "what is on today
      and where does the model disagree", not "let me filter every market by edge size".
      "TODAY" IS THE CURRENT CFBD WEEK, not a calendar date, because a slate spans Thursday
      to Saturday and a date filter would show an empty page on Wednesday. The week is
      anchored on the earliest game that has not yet KICKED OFF rather than on
      `not is_completed`: twelve historical games (10 in 2023, 2 in 2024) are permanently
      flagged incomplete because they were cancelled and CFBD never marks them otherwise, so
      completion-based anchoring selected 2023 week 6 on the first build.
