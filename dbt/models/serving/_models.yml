  # ---------------------------------------------------------------------------------------
  - name: srv_team_overview
    description: >
      Team page, Overview tab. One row per team per season.
      BUILT NARROWED, BY DECISION. Identity, record, conference standing and ATS are
      derivable from facts that exist today. The ratings and profile block — SP+, Elo, SRS,
      adjusted EPA, success rate, points per drive, havoc, returning production, coach — is
      NOT here, because every one depends on a fact scheduled in Track B. Those columns are
      deliberately ABSENT rather than present-and-null: a null column reads as "no data for
      this team", whereas an absent column lets the page render its Degraded state and name
      `fct_team_week_rating`, which is what AC-8.2 asks for.
      ATS comes from fct_team_record rather than being computed here, so Standings and this
      page share one definition instead of deriving it twice.
    columns:
      - name: team_overview_sk
        description: Surrogate key over (season, team_id) — the grain.
      - name: season
        description: Season the overview covers.
      - name: team_id
        description: CFBD team id.
      - name: team_slug
        description: URL-safe team identifier used in the site's routing.
      - name: team_display
        description: Display name for the team.
      - name: mascot
        description: Team mascot.
      - name: abbreviation
        description: Short form for compact rendering.
      - name: logo_url
        description: CFBD logo URL for the team.
      - name: color_primary
        description: The school's primary colour as CFBD publishes it, unmodified.
      - name: color_on_light
        description: Contrast-corrected colour safe on a light background.
      - name: color_on_dark
        description: Contrast-corrected colour safe on a dark background.
      - name: color_source
        description: >
          Where the corrected colours came from — the published colour, or a substitute where
          it failed contrast. The audit trail for a colour the site changed.
      - name: conference
        description: Conference affiliation for that season.
      - name: division
        description: >
          Division within the conference. Null is NORMAL rather than missing — most
          conferences no longer have divisions. See srv_standings.division.
      - name: classification
        description: Division level for that season — `fbs`, `fcs` and so on.
      - name: city
        description: City the team is based in.
      - name: state
        description: State or territory the team is based in.
      - name: wins
        description: Wins that season; null before any game has been played.
      - name: losses
        description: Losses that season; null before any game has been played.
      - name: record_display
        description: >
          AC-5.3. Pre-formatted "W-L", assembled here because the app must not build a
          record from components.
      - name: conference_standing
        description: Position within the conference, from srv_standings' tiebreak rank.
      - name: conference_wins
        description: Wins against conference opponents.
      - name: conference_losses
        description: Losses against conference opponents.
      - name: conference_record_display
        description: Pre-formatted conference record, same convention as `record_display`.
      - name: games_played
        description: Games played that season.
      - name: points_for
        description: Total points scored that season.
      - name: points_against
        description: Total points conceded that season.
      - name: point_differential
        description: '`points_for` minus `points_against`, computed upstream.'
      - name: yards_for
        description: >
          Total offensive yards. Read against `games_with_box_score`, not `games_played`.
      - name: rushing_yards_for
        description: Rushing yards gained that season.
      - name: passing_yards_for
        description: Passing yards gained that season.
      - name: yards_allowed
        description: >
          Total yards conceded. Read against `games_with_opponent_box_score`.
      - name: rushing_yards_allowed
        description: Rushing yards conceded that season.
      - name: passing_yards_allowed
        description: Passing yards conceded that season.
      - name: penalty_yards
        description: Penalty yards assessed against this team.
      - name: takeaways
        description: Turnovers forced that season.
      - name: giveaways
        description: Turnovers committed that season.
      - name: turnover_margin
        description: '`takeaways` minus `giveaways`, computed upstream.'
      - name: games_with_box_score
        description: >
          AC-G.33. The n the "for" totals were computed over, at or below `games_played`
          because not every game has a box score. Using `games_played` as the denominator
          instead produces a per-game figure against the wrong n.
      - name: games_with_opponent_box_score
        description: >
          The same denominator for the "allowed" totals, tracked separately because a game
          can have one side's box score and not the other's.
      - name: ats_wins
        description: Games where this team beat the spread.
      - name: ats_losses
        description: Games where this team failed to beat the spread.
      - name: ats_pushes
        description: Games that landed exactly on the spread.
      - name: ats_record_display
        description: >
          Pre-formatted ATS record. NOT coalesced to zero: a team with no graded games has
          NULL here, because "0-0-0" claims a measurement that was never taken. The coalesce
          this replaced made every 2026 team read 0-0-0 while wins and losses in the SAME ROW
          were correctly null — one table, two treatments of "hasn't happened yet". Null lets
          the page render an em dash per AC-G.32.
      - name: ats_as_favorite_display
        description: >
          Pre-formatted ATS record in games where this team was favoured. Null where the team
          was never a favourite — 34 team-seasons changed from "0-0" to absent when this was
          corrected.
      - name: ats_as_underdog_display
        description: Pre-formatted ATS record in games where this team was the underdog.
      - name: as_of_ts
        description: AC-G.35. Last load of the `game` domain, rendered instead of now().

  # ---------------------------------------------------------------------------------------
  - name: srv_scoreboard
    description: >
      Scoreboard. One row per game, carrying BOTH card states — pre-game and post-game
      fields live on the same row so the app switches on `is_completed` rather than querying
      two objects. Additive.
      Team names come from fct_game rather than dim_team: the dimension is built from CFBD's
      /teams response, which does not list every opponent an FBS side schedules, and taking
      names from it left 12,168 of 110,634 rows — 11% of the scoreboard — with a null team
      and `None` for the winner. Slugs fall back to a slug OF the game's name, because a null
      slug is a link to nowhere while a derived one reaches a page that honestly renders Empty.
      Poll rank is AP only and one poll only, because the badge shows ONE number; a second
      poll here would fan the scoreboard out silently.
    columns:
      - name: game_sk
        description: Surrogate key from the game fact — the grain, one row per game.
      - name: game_id
        description: CFBD game id.
      - name: season
        description: Season the game belongs to.
      - name: week
        description: Week within the season and season_type.
      - name: season_type
        description: '`regular` or `postseason`.'
      - name: game_date
        description: Calendar date of the game.
      - name: start_date
        description: Scheduled kickoff, timezone-aware, as stored.
      - name: start_date_et
        description: >
          Kickoff converted to US Eastern and stored WITHOUT a timezone. Do not read as UTC.
      - name: is_completed
        description: >
          Whether the game has finished, and the column the card switches on. A cancelled
          game reads 0-0 with this false.
      - name: is_neutral_site
        description: Whether the game was played at a neutral venue.
      - name: venue
        description: Venue name.
      - name: venue_display
        description: Alias of `venue`, carried so pages written against either name work.
      - name: is_fbs_game
        description: >
          Whether EITHER team was FBS — not both. Requiring both would drop 20 of the 25
          games on the opening Thursday; 934 of 3,831 games in 2025 qualify. A column rather
          than a hardcoded WHERE so the default can be widened.
      - name: home_team_id
        description: CFBD team id for the home side.
      - name: home_team
        description: Home team name FROM THE GAME FACT, populated on every row.
      - name: home_abbreviation
        description: Home team abbreviation from dim_team; null for teams not in /teams.
      - name: home_team_slug
        description: >
          URL-safe home team identifier, falling back to a slug of the game's own team name
          where dim_team has no row.
      - name: home_team_display
        description: Home team display name, falling back to the game fact's name.
      - name: home_color_on_light
        description: Contrast-corrected home colour for a light background.
      - name: home_logo_url
        description: CFBD logo URL for the home team.
      - name: home_points
        description: Home team's final score; null until scored.
      - name: away_team_id
        description: CFBD team id for the away side.
      - name: away_team
        description: Away team name from the game fact, populated on every row.
      - name: away_abbreviation
        description: Away team abbreviation from dim_team; null for teams not in /teams.
      - name: away_team_slug
        description: URL-safe away team identifier, with the same slug fallback as the home side.
      - name: away_team_display
        description: Away team display name, falling back to the game fact's name.
      - name: away_color_on_light
        description: Contrast-corrected away colour for a light background.
      - name: away_logo_url
        description: CFBD logo URL for the away team.
      - name: away_points
        description: Away team's final score; null until scored.
      - name: home_rank
        description: >
          AC-1.5. AP rank the home team held going INTO this game, so an unranked team shows
          no badge rather than an em dash inside one. Week-scoped, which is why it cannot be
          read off dim_team.
      - name: away_rank
        description: AP rank the away team held going into this game; null if unranked.
      - name: winner
        description: >
          Name of the winning team. Null when the game is not completed AND null on a tie —
          the two cases are distinguished by `is_completed`, not by this column.
      - name: final_margin
        description: >
          Absolute points margin. NULL, not zero, for a game with no result — so zero here
          means exactly one thing: the two teams finished level. Previously
          `abs(coalesce(home, 0) - coalesce(away, 0))`, which gave all 1,769 unplayed games a
          margin of 0, indistinguishable from a tie.
      - name: actual_margin
        description: >
          Signed margin, away minus home, following the project convention. Distinct from
          `final_margin`, which is unsigned.
      - name: total_points
        description: >
          Combined score. Computed in dbt rather than summed in the app, and NULL for a game
          that has not been played rather than zero.
      - name: home_wins
        description: Home team's season win total, for the record shown on the card.
      - name: home_losses
        description: Home team's season loss total.
      - name: away_wins
        description: Away team's season win total.
      - name: away_losses
        description: Away team's season loss total.
      - name: excitement_index
        description: CFBD's excitement index for the game; null until computed.
      - name: is_upset
        description: Whether the result counted as an upset by the upstream definition.
      - name: attendance
        description: Reported attendance; null where not published.
      - name: total_yards_both_teams
        description: >
          R-006. Game-grain total from the two team-grain box-score rows. NULL for most of
          history — box scores are `recent` scope, 3,360 of 7,662 completed 2025 team-rows
          carry total_yards and nothing before 2024 does. That renders as an em dash, which
          is the honest state.
      - name: rushing_yards_both_teams
        description: Combined rushing yards for the game, same scope caveat as above.
      - name: passing_yards_both_teams
        description: Combined passing yards for the game, same scope caveat as above.
      - name: turnovers_both_teams
        description: Combined turnovers for the game, same scope caveat as above.
      - name: teams_with_box_score
        description: >
          2 when both box scores landed, 1 when only one did, 0 when neither. A total built
          from one team is not a game total, and this is what lets the page say so.
      - name: spread_at_close
        description: >
          R-007. The last line recorded before kickoff where one exists. Read WITH
          `spread_at_close_basis` — for older games this may be a line CFBD reported to us
          long afterwards rather than one observed pre-kickoff.
      - name: spread_at_close_provider
        description: Which sportsbook that line came from.
      - name: spread_at_close_basis
        description: >
          PROVENANCE, and the reason this column exists. `observed_before_kickoff` means cfdb
          sampled the line while the market was live. `as_recorded_by_cfbd` means our
          snapshot history begins 2026-08-15, so for an older game the only line we hold is
          whatever CFBD returned when we fetched it — a real market number whose timestamp is
          our fetch time, not a pre-kickoff observation. Calling both "close" would conflate
          a line we watched with a line we were told about.
      - name: favorite_covered
        description: >
          R-008. Whether the FAVOURITE covered — distinct from which side covered. Four
          states, and pending is not push: `pending` (no result yet), `push` (landed exactly
          on the number), `no_favorite` (a pick'em, spread exactly 0 — the not-applicable
          third state of AC-G.32 and a real case in the data), `yes` or `no`. Null when no
          spread is held. Follows the away-minus-home convention, so a NEGATIVE spread means
          the home team was favoured.
      - name: as_of_ts
        description: AC-G.35. Last load of the `game` domain, rendered instead of now().

