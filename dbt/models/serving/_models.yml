      - name: provider_key
        description: Which sportsbook the market columns came from.
      - name: market_implied_home_win_probability
        description: De-vigged market probability for the home team.
      - name: devig_method
        description: >
          Method used to remove the vigorish. The choice moves the number, so the
          probability is not reproducible without it.
      - name: model_name
        description: >
          Name of the model behind the prediction columns. Selection prefers a model that
          populates `predicted_margin` over the merely most recent.
