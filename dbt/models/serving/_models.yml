      2024 ONWARD ONLY, because box scores are `recent` scope. A player with a 2015 season on
      the season tab and nothing here is the honest state rather than a defect —
      srv_player_stats runs back to 2004 and this cannot.
      Published on the weekly cadence; see srv_player_stats.
    columns:
      - name: player_game_stat_sk
        description: >
          Surrogate key over (game, team, category, stat type, athlete) — the grain.
      - name: game_id
        description: CFBD game id.
      - name: season
        description: Season, resolved from the game spine — the box-score feed carries none.
      - name: week
        description: Week, resolved from the game spine.
      - name: season_type
        description: '`regular` or `postseason`.'
      - name: game_date
        description: Calendar date of the game.
      - name: start_date
        description: Scheduled kickoff, timezone-aware.
      - name: player_id
        description: CFBD athlete id, shared with the season stats and the drill-down.
      - name: player_slug
        description: URL-safe identifier, name and player id.
      - name: player_name
        description: Athlete name as the box score publishes it.
      - name: team
        description: Team the athlete played for in this game.
      - name: team_id
        description: >
          Resolved from dim_team within season; null for non-FBS programmes absent from
          /teams.
      - name: conference
        description: Conference of that team.
      - name: home_away
        description: Whether the team was home or away, carried on the box-score row itself.
      - name: opponent
        description: >
          The other side, derived from home_away against the game spine rather than by
          matching names, so an upstream rename cannot break it.
      - name: opponent_team_id
        description: CFBD team id of the opponent.
      - name: team_points
        description: Points this team scored in the game, repeated on each of its stat rows.
      - name: stat_category
        description: CFBD's grouping for the statistic, e.g. passing, rushing, kicking.
      - name: stat_type
        description: >
          The statistic within the category — C/ATT, YDS, TD, INT, QBR, LONG, CAR, AVG and
          more, open-ended and category-specific.
      - name: stat_raw
        description: >
          The value exactly as CFBD sent it, and the only column populated on every row.
          Three shapes exist; see the three columns below.
      - name: stat_value
        description: >
          The plain-number shape. NULL for a made/attempted pair, which has no single value,
          and null for the literal "--" that CFBD sends for an uncomputed QBR.
      - name: stat_made
        description: >
          First half of a made/attempted pair, across exactly three types: passing C/ATT,
          kicking FG and kicking XP. "Made" is correct for each, since a completion is a pass
          made. Splitting the pair is what lets a page show completion percentage rather than
          only printing "12/31".
      - name: stat_attempted
        description: Second half of a made/attempted pair; null on every row that is not one.
      - name: as_of_ts
