      - name: defense_line_yards
        description: >
          Rushing yards credited to the offensive line rather than to the back. The team's
          defensive side.
      - name: defense_line_yards_total
        description: >
          Rushing yards credited to the offensive line rather than to the back. Whole game.
          The team's defensive side.
      - name: defense_second_level_yards
        description: >
          Rushing yards gained five to ten yards past the line of scrimmage. The team's
          defensive side.
      - name: defense_second_level_yards_total
        description: >
          Rushing yards gained five to ten yards past the line of scrimmage. Whole game. The
          team's defensive side.
      - name: defense_open_field_yards
        description: >
          Rushing yards gained more than ten yards past the line of scrimmage. The team's
          defensive side.
      - name: defense_open_field_yards_total
        description: >
          Rushing yards gained more than ten yards past the line of scrimmage. Whole game.
          The team's defensive side.
      - name: defense_standard_downs_ppa
        description: >
          Predicted points added — the change in expected points the plays produced, which
          is the per-play efficiency measure the advanced stats are built on. Restricted to
          standard downs. The team's defensive side.
      - name: defense_standard_downs_success_rate
        description: >
          Share of plays that stayed ahead of the down-and-distance schedule — the standard
          efficiency measure, and the counterpart to explosiveness. Restricted to standard
          downs. The team's defensive side.
      - name: defense_standard_downs_explosiveness
        description: >
          Average value of the plays that DID succeed. Efficiency says how often; this says
          how big. Restricted to standard downs. The team's defensive side.
      - name: defense_passing_downs_ppa
        description: >
          Predicted points added — the change in expected points the plays produced, which
          is the per-play efficiency measure the advanced stats are built on. Restricted to
          passing downs. The team's defensive side.
      - name: defense_passing_downs_success_rate
        description: >
          Share of plays that stayed ahead of the down-and-distance schedule — the standard
          efficiency measure, and the counterpart to explosiveness. Restricted to passing
          downs. The team's defensive side.
      - name: defense_passing_downs_explosiveness
        description: >
          Average value of the plays that DID succeed. Efficiency says how often; this says
          how big. Restricted to passing downs. The team's defensive side.
      - name: defense_rushing_plays_ppa
        description: >
          Predicted points added — the change in expected points the plays produced, which
          is the per-play efficiency measure the advanced stats are built on. Restricted to
          rushing plays. The team's defensive side.
      - name: defense_rushing_plays_total_ppa
        description: >
          Predicted points added — the change in expected points the plays produced, which
          is the per-play efficiency measure the advanced stats are built on. Restricted to
          rushing plays. The team's defensive side.
      - name: defense_rushing_plays_success_rate
        description: >
          Share of plays that stayed ahead of the down-and-distance schedule — the standard
          efficiency measure, and the counterpart to explosiveness. Restricted to rushing
          plays. The team's defensive side.
      - name: defense_rushing_plays_explosiveness
        description: >
          Average value of the plays that DID succeed. Efficiency says how often; this says
          how big. Restricted to rushing plays. The team's defensive side.
      - name: defense_passing_plays_ppa
        description: >
          Predicted points added — the change in expected points the plays produced, which
          is the per-play efficiency measure the advanced stats are built on. Restricted to
          passing plays. The team's defensive side.
      - name: defense_passing_plays_total_ppa
        description: >
          Predicted points added — the change in expected points the plays produced, which
          is the per-play efficiency measure the advanced stats are built on. Restricted to
          passing plays. The team's defensive side.
      - name: defense_passing_plays_success_rate
        description: >
          Share of plays that stayed ahead of the down-and-distance schedule — the standard
          efficiency measure, and the counterpart to explosiveness. Restricted to passing
          plays. The team's defensive side.
      - name: defense_passing_plays_explosiveness
        description: >
          Average value of the plays that DID succeed. Efficiency says how often; this says
          how big. Restricted to passing plays. The team's defensive side.
      - name: opponent_conference
        description: >
          Conference of the opponent that season.
      - name: offense_total_plays
        description: >
          Plays. The team's offensive side.
      - name: offense_total_havoc_events
        description: >
          COUNT of disrupted plays the team's offence suffered — tackles for loss, forced
          fumbles, interceptions and passes defended against it. A count, not a rate; read
          it against offense_total_havoc_rate.
      - name: offense_front_seven_havoc_events
        description: >
          Count of plays against this offence disrupted by the opposing front seven.
      - name: offense_db_havoc_events
        description: >
          Count of plays against this offence disrupted by the opposing defensive backs.
      - name: offense_havoc_rate
        description: >
          Share of plays ending in a tackle for loss, forced fumble, interception or pass
          defended. The team's offensive side.
      - name: offense_front_seven_havoc_rate
        description: >
          Share of this offence's plays disrupted by the opposing front seven.
      - name: offense_db_havoc_rate
        description: >
          Share of this offence's plays disrupted by the opposing defensive backs.
      - name: defense_total_plays
        description: >
          Plays. The team's defensive side.
      - name: defense_total_havoc_events
        description: >
          COUNT of plays this defence disrupted. A count, not a rate; read it against
          defense_total_havoc_rate, since a high count on a high-play game is a different
          statement from a high rate.
      - name: defense_front_seven_havoc_events
        description: >
          Count of plays disrupted by this team's front seven.
      - name: defense_db_havoc_events
        description: >
          Count of plays disrupted by this team's defensive backs.
      - name: defense_havoc_rate
        description: >
          Share of plays ending in a tackle for loss, forced fumble, interception or pass
          defended. The team's defensive side.
      - name: defense_front_seven_havoc_rate
        description: >
          Share of plays disrupted by this team's front seven.
      - name: defense_db_havoc_rate
        description: >
          Share of plays disrupted by this team's defensive backs.
      - name: offense_overall
        description: >
          Offensive predicted points added per play across the whole game, from the per-game
          PPA feed — the headline efficiency number for this team's offence.
      - name: offense_passing
        description: >
          Offensive predicted points added per play on passing plays only.
      - name: offense_rushing
        description: >
          Offensive predicted points added per play on rushing plays only.
      - name: offense_first_down
        description: >
          Offensive predicted points added per play on first down.
      - name: offense_second_down
        description: >
          Offensive predicted points added per play on second down.
      - name: offense_third_down
        description: >
          Offensive predicted points added per play on third down.
      - name: defense_overall
        description: >
          Defensive predicted points added per play allowed across the whole game. LOWER IS
          BETTER here — this is points the defence gave up, not gained.
      - name: defense_passing
        description: >
          Defensive predicted points added allowed per passing play. Lower is better.
      - name: defense_rushing
        description: >
          Defensive predicted points added allowed per rushing play. Lower is better.
      - name: defense_first_down
        description: >
          Defensive predicted points added allowed per first-down play. Lower is better.
      - name: defense_second_down
        description: >
          Defensive predicted points added allowed per second-down play. Lower is better.
      - name: defense_third_down
        description: >
          Defensive predicted points added allowed per third-down play. Lower is better.
      - name: spread_final
        description: >
          The spread FROM THIS TEAM'S SIDE — negative means this team was favoured. The
          home-perspective number negated on the away row, which is what lets every derived
          column below be one expression with no branch. "Final" is srv_game's lock rule:
          the closing number once it exists, the live one before that.
      - name: total_final
        description: Over/under on the same locked line. Game-level, identical on both rows.
      - name: line_implied_points_final
        description: >
          `(total_final - spread_final) / 2` — what the market's own two numbers imply this
          team scores. R-201 verified the identity on 1,930 games: the two rows of a game
          always sum to the total, and the larger of the pair is always
          `(total + abs(spread)) / 2`.
          NOT "expected points". These come from the market, not from cfdb's model, and
          "expected" reads as a prediction — the one framing the training-pack licence cares
          about (R-201 section 2.1). Called line-implied everywhere, Excel header included.
      - name: points_vs_line_implied_final
        description: >
          Actual points scored minus line-implied. Unlike ATS margin the two rows of a game
          do NOT cancel: together they sum to the game's total points minus the over/under,
          which is the over/under result expressed in points.
      - name: ats_margin_final
        description: >
          `margin + spread_final`. Positive means this team beat the number. The two rows of
          a game are exact negatives of each other, so a pair that does not cancel is a
          defect rather than a close call.
      - name: covered_final
        description: >
          `yes` / `no` / `push`, `pending` before the game is played, null when no line was
          recorded. Per TEAM, unlike srv_game's `winner_covered_close`, which is a verdict
          about whoever won.
      - name: spread_open
        description: >
          The opening spread from this team's side, NULL WHEN IT EQUALS `spread_final` —
          Marc's rule, applied per column so a blank means "this never changed" rather than
          "this is missing". It suppresses less than it sounds: the spread moved on 753 of
          888 FBS games in 2025.
      - name: total_open
        description: Opening over/under, null when unchanged. 756 of 888 moved in 2025.
      - name: line_implied_points_open
        description: >
          Line-implied points from the opening line, null when identical to the closing
          figure. It depends on both inputs, so it is populated when EITHER the spread or the
          total moved.
      - name: points_vs_line_implied_open
        description: >
          Actual points minus the opening line-implied figure; null when the open and closing
          implied figures agree.
      - name: ats_margin_open
        description: >
          What this team's result would have graded at against the opening spread; null when
          the spread did not move.
      - name: covered_open
        description: >
          The cover verdict against the OPENING spread, null when the spread did not move.
          Where this differs from `covered_final` the line movement changed the outcome,
          which is the comparison the pair exists to make.
      - name: team_slug
        description: >
          URL slug for this row's team, from the `team_identity` macro so the dim-miss
          fallback has one spelling rather than one per view. What the site's team links use.
      - name: team_display
        description: >
          Canonical display name from dim_team, falling back to the fact's own `team`. The
          macro emits it alongside the slug; taking one without the other would be the second
          spelling the macro exists to prevent.
      - name: team_logo_url
        description: >
          This team's logo. Null for a non-FBS opponent held as a dim_team stub — 587 of 626
          rows in a week-2 2025 sample carry one, and the page must render a name without it.
      - name: opponent_team_slug
        description: >
          The opponent's slug, same macro. Named `opponent_team_slug` and not
          `opponent_slug`, matching `home_team_slug` / `away_team_slug` on srv_game — a third
          spelling of the same idea is how these drift.
      - name: opponent_team_display
        description: Canonical display name for the opponent.
      - name: opponent_logo_url
        description: The opponent's logo; null on the same stub rows as team_logo_url.
      - name: team_rank
        description: >
          This row's own poll rank, picked from fct_game's home/away pair by `is_home`. Null
          for an unranked team, which is nearly all of them — 24 of 626 in the same sample.
      - name: opponent_rank
        description: The other side's rank, by the same pick. Null when unranked.
      - name: venue_display
        description: >
          Game-grain, repeated across the pair. The grain rule forbids pushing FINER grain
          into a coarser view, not the reverse; asserted symmetric across a game's two rows.
      - name: attendance
        description: Game-grain, repeated across the pair.
      - name: excitement_index
        description: Game-grain, repeated across the pair.
      - name: is_upset
        description: >
          Game-grain, repeated across the pair. NOT this team's own result — `result` and
          `margin` answer that from this row's side.
      - name: as_of_ts
        description: >
          Freshness for the whole view, from mart_as_of's `game` domain. Read as a SCALAR
          SUBQUERY rather than a cross join: a second row for one domain would silently
          double every row of this view, and a scalar subquery raises instead.
      - name: attribution
        description: >
          CFBD credit. NO cfdb model prediction travels on this view — box scores, advanced
          stats and arithmetic on published market numbers — so it deliberately does not
          borrow dim_model_version's disclaimer, which would imply predictions that are not
          here. AC-G.41 is satisfied by the column existing and being accurate, not by it
          naming a model.

  # ---------------------------------------------------------------------------------------
  - name: srv_game
    description: >
      THE game-grain serving view: one row per game, 130 columns. R-076 and R-094.
      Named for its GRAIN, not for a page. Four views were one row per game over fct_game —
      srv_schedule, srv_scoreboard, srv_matchup and srv_today_edges — split by which page read
      them. All four are retired into this one; there is no alias and no view over it, because
      a second name is how they drifted in the first place.
      EACH RENAME FOUND A COLUMN WITH TWO IMPLEMENTATIONS, by comparing rather than reading.
      The team display name had already drifted and shipped an em dash on 12,168 rows.
      `home_rank` agreed on all 11,982 populated rows and was one edit from the same fate.
      `model_version_key` was worse than either: it DISAGREED on all 567 populated rows, one
      view holding the model name and the other the version, and is fixed here.
      THE GRAIN RULE (Marc, 2026-09-02): "Can't add game.team grain to a table that is at game
      grain." Anything finer lives in srv_game_team; the both-teams box totals and the
      head-to-head series here are DERIVED summaries, which the rule permits.
    columns:
      - name: game_sk
        tests: [unique, not_null]
        description: >
          Surrogate key from the game fact — the grain.
      - name: game_id
        description: >
          CFBD game id.
      - name: season
        description: >
          Season the game belongs to.
      - name: week
        description: >
          Week within the season and season_type.
      - name: season_type
        description: >
          `regular` or `postseason`.
      - name: week_sk
        description: >
          Surrogate key of the week, for joining to the week dimension.
      - name: game_date
        description: >
          Calendar date of the game.
      - name: start_date
        description: >
          Scheduled kickoff, timezone-aware, as stored.
      - name: start_date_et
        description: >
          AC-G.34. Kickoff converted to US Eastern and stored WITHOUT a timezone, applied
          here and never in the app. Do not read this as UTC.
      - name: kickoff_time_known
        description: >
          Whether a real kickoff time is known. FALSE means `start_date` carries a
          placeholder, typically an unscheduled future game, so a page must not render an
          hour for it.
      - name: is_completed
        description: >
          Whether the game has finished. A cancelled game reads 0-0 with this false, so
          "points are not null" is not a substitute for it.
      - name: is_conference_game
        description: >
          Whether both teams were in the same conference that season.
      - name: is_neutral_site
        description: >
          Whether the game was played at a neutral venue.
      - name: venue
        description: >
          Venue name.
      - name: venue_display
        description: >
          Venue name as rendered.
      - name: network
        description: >
          Broadcast network; null where not published.
      - name: network_abbreviation
        description: >
          Short form of `network`, from dim_broadcast_outlet. A column rather than a trim in
          a view, so the site and the Excel workbook cannot disagree about what a channel is
          called. Falls back to the full name for an outlet not yet mapped, which renders
          long and is a visible prompt to add it.
      - name: attendance
        description: >
          Reported attendance; null where not published.
      - name: excitement_index
        description: >
          CFBD's excitement index for the game; null until it has been computed.
      - name: is_upset
        description: >
          Whether a RANKED side lost to a side ranked worse or unranked. AP poll only, at the
          time of the game. NULL where neither team was ranked — there is no favourite to be
          upset, and saying `false` there was a claim with no basis behind it on 83% of
          completed games. A market favourite is a different basis and a different question;
          `winner_covered_close` answers that one.
      - name: is_upset_by_line
        description: >
          Whether the side favoured by the closing spread lost outright, and the ONLY basis for
          an upset here — R-181. Null where no closing line was held or the game was a pick'em,
          which names no favourite; the page renders that null as a dash rather than as a
          verdict of "no upset". Poll rank is deliberately not a fallback: roughly 25 teams are
          ranked in a given week while 100% of completed FBS games in 2025 carry a closing
          line, so the rank basis added verdicts only where they were least meaningful.
      - name: is_fbs_game
        description: >
          Whether EITHER team was FBS — not both. A Division II visitor's trip to an FBS
          stadium is an FBS game, and requiring both would drop 20 of the 25 games on the
          opening Thursday. 934 of 3,831 games in 2025 qualify. Carried as a column rather
          than a hardcoded WHERE so the site filters on it with a default that can be
          widened.
      - name: home_team_id
        description: >
          CFBD team id for the home side.
      - name: home_team
        description: >
          Home team name FROM THE GAME FACT, populated on every row.
      - name: home_team_slug
        description: >
          URL-safe home team identifier.
      - name: home_team_display
        description: >
          Home team display name, falling back to the game fact's name.
      - name: home_abbreviation
        description: >
          Home team abbreviation.
      - name: home_conference
        description: >
          Home team's conference for that season.
      - name: home_color_on_light
        description: >
          Contrast-corrected home colour for a light background.
      - name: home_color_on_dark
        description: >
          Contrast-corrected home colour for a dark background.
      - name: home_logo_url
        description: >
          CFBD logo URL for the home team.
      - name: home_points
        description: >
          Home team's final score; null until the game is scored.
      - name: home_rank
        description: >
          Home team's poll rank at kickoff; null if unranked.
      - name: away_team_id
        description: >
          CFBD team id for the away side.
      - name: away_team
        description: >
          Away team name from the game fact, populated on every row.
      - name: away_team_slug
        description: >
          URL-safe away team identifier.
      - name: away_team_display
        description: >
          Away team display name, falling back to the game fact's name.
      - name: away_abbreviation
        description: >
          Away team abbreviation.
      - name: away_conference
        description: >
          Away team's conference for that season.
      - name: away_color_on_light
        description: >
          Contrast-corrected away colour for a light background.
      - name: away_color_on_dark
        description: >
          Contrast-corrected away colour for a dark background.
      - name: away_logo_url
        description: >
          CFBD logo URL for the away team.
      - name: away_points
        description: >
          Away team's final score; null until the game is scored.
      - name: away_rank
        description: >
          Away team's poll rank at kickoff; null if unranked.
      - name: winner
        description: >
          Name of the winning team. Null when the game is not completed AND null on a tie —
          the two cases are distinguished by `is_completed`, not by this column.
      - name: final_margin
        description: >
          Absolute points margin. NULL, not zero, for a game with no result — so zero here
          means exactly one thing: the two teams finished level. Previously
          `abs(coalesce(home, 0) - coalesce(away, 0))`, which gave all 1,769 unplayed games
          a margin of 0, indistinguishable from a tie.
      - name: actual_margin
        description: >
          Signed margin, away minus home, following the project convention. Distinct from
          `final_margin`, which is unsigned.
      - name: total_points
        description: >
          Combined score. Computed in dbt rather than summed in the app, and NULL for a game
          that has not been played rather than zero.
      - name: home_wins
        description: >
          Home team's season win total, for the record shown on the card.
      - name: home_losses
        description: >
          Home team's season loss total.
      - name: away_wins
        description: >
          Away team's season win total.
      - name: away_losses
        description: >
          Away team's season loss total.
      - name: total_yards_both_teams
        description: >
          R-006. Game-grain total from the two team-grain box-score rows. NULL for most of
          history — box scores are `recent` scope, 3,360 of 7,662 completed 2025 team-rows
          carry total_yards and nothing before 2024 does. That renders as an em dash, which
          is the honest state.
      - name: rushing_yards_both_teams
        description: >
          Combined rushing yards for the game, same scope caveat as above.
      - name: passing_yards_both_teams
        description: >
          Combined passing yards for the game, same scope caveat as above.
      - name: turnovers_both_teams
        description: >
          Combined turnovers for the game, same scope caveat as above.
      - name: teams_with_box_score
        description: >
          2 when both box scores landed, 1 when only one did, 0 when neither. A total built
          from one team is not a game total, and this is what lets the page say so.
      - name: spread_current
        description: >
          Spread from the most recent snapshot across all providers, in the away-minus-home
          convention. One value per game — see srv_odds_board for the per-provider
          breakdown.
      - name: total_current
        description: >
          Over/under from that same most recent snapshot.
      - name: spread_at_close
        description: >
          R-007. The last line recorded before kickoff where one exists. Read WITH
          `spread_at_close_basis` — for older games this may be a line CFBD reported to us
          long afterwards rather than one observed pre-kickoff.
      - name: spread_at_close_provider
        description: >
          Which sportsbook that line came from.
      - name: spread_at_close_basis
        description: >
          PROVENANCE, and the reason this column exists. `observed_before_kickoff` means
          cfdb sampled the line while the market was live. `as_recorded_by_cfbd` means our
          snapshot history begins 2026-08-15, so for an older game the only line we hold is
          whatever CFBD returned when we fetched it — a real market number whose timestamp
          is our fetch time, not a pre-kickoff observation. Calling both "close" would
          conflate a line we watched with a line we were told about.
      - name: favorite_covered
        description: >
          R-008. Whether the FAVOURITE covered — distinct from which side covered. Four
          states, and pending is not push: `pending` (no result yet), `push` (landed exactly
          on the number), `no_favorite` (a pick'em, spread exactly 0 — the not-applicable
          third state of AC-G.32 and a real case in the data), `yes` or `no`. Null when no
          spread is held. Follows the away-minus-home convention, so a NEGATIVE spread means
          the home team was favoured.
      - name: predicted_margin
        description: >
          Model's predicted margin in the away-minus-home convention. Model selection
          prefers one that actually populates this column, because six of seven models are
          probability models and ordering by recency alone loses the margin almost every
          time.
      - name: predicted_margin_home_perspective
        description: >
          `predicted_margin` negated, so positive reads as "home favoured by". Explicitly
          named because the pack's own sign is preserved on the column above.
      - name: home_win_probability
        description: >
          Model's probability that the home team wins.
      - name: predicted_home_win_probability
        description: >
          Model's probability that the home team wins. Duplicated as home_win_probability,
          which is the name srv_schedule used; both are kept so pages written against either
          continue to work.
      - name: predicted_total_points
        description: >
          Model's predicted combined score.
      - name: predicted_home_points
        description: >
          Model's predicted home score.
      - name: predicted_away_points
        description: >
          Model's predicted away score.
      - name: confidence_bucket
        description: >
          The model's own confidence label for this prediction.
      - name: home_cover_edge
        description: >
          Model's edge on the home side against the spread, in points.
      - name: home_win_probability_edge
        description: >
          Model's edge on the home moneyline, as a probability.
      - name: is_out_of_sample_week
        description: >
          Whether the model is extrapolating for this week.
      - name: is_default_actionable
        description: >
          The inverse of is_out_of_sample_week, precomputed so every consumer applies the
          same rule and no page presents an extrapolated early-season edge as actionable.
      - name: training_week_floor
        description: >
          The model's own coverage floor, carried as data so an Empty state is not a
          hardcoded "Week 5" string. CFBD ships no current-season feature files until week
          5, so weeks 1-4 having no predictions is by design and recurs annually.
      - name: model_name
        description: >
          Name of the model behind the prediction columns. Its own column now: it used to be
          what `model_version_key` contained, which is what the C2 diff caught.
      - name: model_family
        description: >
          Broader family that model belongs to.
      - name: model_version_key
        description: >
          The model VERSION, from dim_model_version — which is what the column's name has
          always claimed. srv_game inherited the model NAME here from srv_schedule while
          srv_matchup carried the version, and they disagreed on all 567 populated rows
          (`random_forest_score` against `98d34949266b`). Part 1 documented the quirk rather
          than renaming it because a serving rename is a breaking change; merging the views
          IS that change, so it was fixed here.
      - name: attribution
        description: >
          AC-G.41. Licence-required attribution travelling as data.
      - name: spread
        description: >
          Spread at the most recent snapshot, away-minus-home convention.
      - name: spread_open
        description: >
          Opening spread for the game from that provider.
      - name: over_under
        description: >
          Over/under at the most recent snapshot.
      - name: over_under_open
        description: >
          Opening over/under for the game from that provider.
      - name: spread_move_from_open
        description: >
          How far the spread has moved since it opened, in points. NAMED FOR WHAT
          srv_line_movement ALREADY CALLS IT — coining "change" here would be the Total-
          versus-O/U mistake committed twice. SIGN: spread is home-perspective and negative
          favours the home team, so -1.5 means the market moved TOWARD the home side, the
          same reading as the spread and the predicted margin beside it. NULL, not zero,
          when it has not moved, and null again when no opening number was recorded — those
          are different facts, and spread_open beside it tells them apart. 1,608 games have
          moved.
      - name: total_move_from_open
        description: >
          How far the over/under has moved since it opened. Same null-not-zero rule and the
          same naming reasoning as spread_move_from_open. 1,601 games have moved.
      - name: best_rank_in_game
        description: >
          The better of the two AP ranks, for sorting a slate by how interesting it is.
          `least()` ignores nulls in both dialects, so a ranked team facing an unranked one
          keeps its number — LSU at 3 against unranked SE Louisiana gives 3. NULL when
          neither side is ranked. RANK 1 IS THE BEST AND UNRANKED IS NULL, so anything
          sorting on this must put nulls LAST or every unranked game leads the page.
          Deliberately not coalesced to a sentinel: 999 would sort correctly and lie
          everywhere else, including the Excel export.
      - name: home_moneyline
        description: >
          American-odds moneyline for the home team at the latest snapshot.
      - name: away_moneyline
        description: >
          American-odds moneyline for the away team at the latest snapshot.
      - name: provider_key
        description: >
          Which sportsbook the market columns came from.
      - name: line_snapshot_ts
        description: >
          When the market columns were observed.
      - name: snapshot_ts
        description: >
          Alias of line_snapshot_ts, carried because srv_matchup exposed both and the rename
          drops nothing.
      - name: market_implied_home_win_probability
        description: >
          De-vigged market probability for the home team.
      - name: market_implied_away_win_probability
        description: >
          De-vigged market probability for the away team.
      - name: overround
        description: >
          The bookmaker's margin in the raw prices — how far the implied probabilities
          summed above 100% before de-vigging. Carried so a reader can see how much was
          removed.
      - name: devig_method
        description: >
          Method used to remove the vigorish.
      - name: home_classification
        description: >
          Home team's division for that season.
      - name: away_classification
        description: >
          Away team's division for that season.
      - name: actual_margin_home_perspective
        description: >
          The same result read the other way round, so a page can put it beside
          `predicted_margin_home_perspective` without flipping a sign. Computed here because
          the app computing it would be the app owning a convention (G-3).
      - name: series_games
        description: >
          Prior meetings between these two teams WITH A RECORDED RESULT, excluding this
          game. Two games are flagged completed with no score, and counting them gave a
          head-to-head of 0-0-0 over one meeting — a row that reconciles to nothing.
      - name: series_home_team_wins
        description: >
          Prior meetings won by THIS GAME'S home team, whichever venue they were played at.
      - name: series_away_team_wins
        description: >
          Prior meetings won by this game's away team. Counted directly, NOT derived as
          `series_games - series_home_team_wins` — that form is only correct in a sport
          without draws, and silently credited all 2,600 tied games to the away side,
          overstating it in 40,045 of 102,985 rows.
      - name: series_ties
        description: >
          Prior meetings that ended level. Its own outcome, not a rounding error: college
          football had no overtime before 1996.
      - name: series_first_season
        description: >
          Season of the earliest prior meeting with a result.
      - name: series_last_season
        description: >
          Season of the most recent prior meeting with a result.
      - name: is_current_week
        description: >
          Whether this game is in the week currently in play — the rule srv_today_edges
          filtered on, carried as a COLUMN so the Today page filters on a fact rather than
          re-deriving it. "Current" is the current CFBD WEEK, not today's date: a slate
          spans Thursday to Saturday and a date filter shows an empty page on Wednesday.
          Anchored on kickoff time rather than `not is_completed`, because twelve historical
          games are permanently flagged incomplete and anchoring on completion selected 2023
          week 6.
      - name: pregame_home_win_probability
        description: >
          CFBD's pregame win probability for the home side. READ pregame_wp_basis BEFORE
          QUOTING IT — for most games this figure was fetched after the game finished and is
          not a forecast we observed.
      - name: pregame_wp_basis
        description: >
          PROVENANCE, and the reason the column exists. `observed_before_kickoff` means cfdb
          sampled it while the game was still ahead; `as_recorded_by_cfbd` means the value
          is real but its timestamp is our fetch time. Measured: only 131 of 1,891 games
          have a genuine pre-kickoff observation, and all 131 are 2026 — snapshotting began
          2026-08-15, so every 2024 and 2025 row is the second kind.
      - name: pregame_wp_snapshot_ts
        description: >
          When the pregame probability was observed. Nine distinct timestamps exist across
          the whole table, which is why this is a VALUE and not a movement series.
      - name: is_indoors
        description: >
          Whether the venue is enclosed, and THE COLUMN THAT QUALIFIES EVERY OTHER WEATHER
          FIELD. CFBD reports conditions at the venue's LOCATION rather than inside it, so a
          domed game carries ordinary outdoor readings; rendering them without this states
          something false.
      - name: temperature_f
        description: >
          Temperature in Fahrenheit at kickoff. Null before 2024 — weather is not collected
          for earlier seasons, which renders as an em dash rather than a zero.
      - name: wind_speed_mph
        description: >
          Wind speed in miles per hour at kickoff.
      - name: precipitation_in
        description: >
          Precipitation in inches at kickoff.
      - name: weather_condition_code
        description: >
          CFBD's numeric condition code. 18 distinct values; the site maps them to an icon
          set rather than inventing conditions the data does not carry.
      - name: weather_condition
        description: >
          CFBD's text label for the conditions — Cloudy, Clear, Fair, Light Rain. Null where
          the feed sends a blank, so a page renders an em dash rather than an empty cell
          that looks broken.
      - name: home_pregame_elo
        description: >
          The home team's Elo rating going INTO this game. A rating per team per game is a
          rating per team per week, which is what makes a weekly rating series possible
          without a single new API call — the project had recorded that as needing
          /ratings/elo re-fetched by week. Populated on 67,306 of 110,879 rows; null before
          Elo existed.
      - name: home_postgame_elo
        description: >
          The home team's Elo rating after the game. The difference from the pregame figure
          is what the result was worth.
      - name: away_pregame_elo
        description: >
          The away team's Elo rating going into this game.
      - name: away_postgame_elo
        description: >
          The away team's Elo rating after the game.
      - name: home_q1
        description: >
          Home points in the first quarter. Null where CFBD sends no line score — 60% of
          rows, all historical; the earliest game with quarters is 2001.
      - name: home_q2
        description: >
          Home points in the second quarter.
      - name: home_q3
        description: >
          Home points in the third quarter.
      - name: home_q4
        description: >
          Home points in the fourth quarter.
      - name: home_overtime_points
        description: >
          Home points scored after regulation, SUMMED across however many overtimes there
          were. A column per period would either invent nine of them or truncate a long game
          — periods reach thirteen in this data. Zero means the game ended in regulation;
          null means no quarters are held for it.
      - name: home_periods
        description: >
          How many scoring periods were recorded, so a page can render "2OT" honestly rather
          than inferring it. 4 for a regulation game, 13 at the extreme.
      - name: away_q1
        description: >
          Away points in the first quarter.
      - name: away_q2
        description: >
          Away points in the second quarter.
      - name: away_q3
        description: >
          Away points in the third quarter.
      - name: away_q4
        description: >
          Away points in the fourth quarter.
      - name: away_overtime_points
        description: >
          Away points scored after regulation, summed across all overtimes.
      - name: away_periods
        description: >
          How many scoring periods were recorded for the away side.
      - name: home_team_record_display
        description: >
          The home team's record LEADING INTO this game's week, as a W-L string — extending
          to W-L-T only where the running tie count is non-zero, since ties existed before
          1996 and a two-part string misstates those seasons. NOT the same as
          `home_wins`/`home_losses` above, which are SEASON-FINAL: showing those beside a
          Week 3 game from a finished season is the composition failure this column exists
          to prevent. Named `home_team_record_display` and not `home_record_display` because
          srv_standings already uses that name for "record in home games". Null where the
          warehouse holds no completed game for the team, since 0-0 there would be a lie.
      - name: away_team_record_display
        description: >
          The away team's record leading into this game's week. See home_team_record_display
          for the semantics and the deliberate naming.
      - name: as_of_ts
        description: >
          AC-G.35. Last load of the `game` domain, rendered instead of now().
