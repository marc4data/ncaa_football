# dbt profile used *inside* the Airflow containers.
#
# Identical to profiles.yml.example except for the host: on the compose network Postgres
# answers to `postgres`, not `localhost`. Committed deliberately — it carries no secret,
# because every value falls back to the local Compose defaults and can be overridden by
# environment variables.
cfdb_profile:
  target: airflow
  outputs:
    airflow:
      type: postgres
      host: "{{ env_var('PG_HOST', 'postgres') }}"
      port: "{{ env_var('PG_PORT', '5432') | int }}"
      user: "{{ env_var('PG_USER', 'cfdb') }}"
      password: "{{ env_var('PG_PASSWORD', 'cfdb') }}"
      dbname: "{{ env_var('PG_DB', 'cfdb') }}"
      schema: public
      threads: 4
    # The analytics warehouse. Reached only via an explicit `--target databricks`, never as
    # the default, so a missing or expired credential can fail just the one task that asked
    # for it rather than every dbt run in the stack.
    #
    # No secret here either: these env_vars have no fallback, so the file is inert without
    # the environment the compose file supplies from .env.
    databricks:
      type: databricks
      host: "{{ env_var('DATABRICKS_SERVER_HOSTNAME') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: "{{ env_var('DATABRICKS_CATALOG', 'workspace') }}"
      schema: "{{ env_var('DATABRICKS_SCHEMA', 'cfdb') }}"
      threads: 4
