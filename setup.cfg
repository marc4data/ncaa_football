[flake8]
max-line-length = 120
exclude = .git,__pycache__,.venv,venv,data,dbt/target,dbt/dbt_packages
# E203: conflicts with common formatter output on slices
extend-ignore = E203

[tool:pytest]
testpaths = tests
# Our own deprecation warnings fail the build; third-party ones don't.
filterwarnings =
    error::DeprecationWarning:src\..*
