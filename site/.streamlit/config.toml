# R-099. The site's accent, stated once so Streamlit stops choosing for us.
#
# There was no config.toml at all, so primaryColor was Streamlit's default #FF4B4B — which is
# why the Dense/Stacked radio rendered red. Nobody chose red; nobody chose anything.
#
# #1f6feb is already the site's accent and is used consistently in theme.py: every link, the
# footer, the dataset caption, the `p` chip, and .cfdb-winner. An interactive control painted
# in the page-title colour would read as body text and look inert — the accent is the one that
# says "this is a control", and it is already the colour of everything else clickable here.
#
# DECLARED PER MODE, AND THAT IS NOT COSMETIC.
#
# The first version of this file set a bare `[theme] primaryColor` and a comment claiming the
# background and text colours were "left unset so they continue to follow the viewer's
# light/dark preference". That is not what Streamlit does. Declaring ANY key under a bare
# `[theme]` makes it resolve a concrete theme, and an unset `base` resolves to light — so the
# app stopped following the OS preference entirely and served the light palette to everyone.
#
# Measured, not reasoned: with the bare `[theme]` version the page background under
# `prefers-color-scheme: dark` was rgb(255,255,255); with this file it is rgb(14,17,23).
#
# `[theme.light]` and `[theme.dark]` override only within each mode and leave the choice of
# mode to the viewer.
#
# R-552. THIS COMMENT USED TO END "...which is what theme.py's own prefers-color-scheme blocks
# are written against." THERE ARE NO SUCH BLOCKS ANY MORE and the sentence was describing the
# defect rather than the design: `prefers-color-scheme` answers the OPERATING SYSTEM, so a
# reader on a dark Mac with the app in Light got a light page painted with dark rules. R-547
# converted three declarations, R-552 converted the last block, and theme.py now derives its
# neutrals from `Canvas`/`CanvasText` and picks its brand hues with `light-dark()` — both of
# which follow the `color-scheme` property Streamlit sets from the keys BELOW. So this file is
# what theme.py is written against; the media query never was.
[theme.light]
primaryColor = "#1f6feb"

[theme.dark]
primaryColor = "#1f6feb"
